<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilara × Avala — Portal za naručivanje</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d82028'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='19' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EV%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#242a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════
   VILARA × AVALA — Poslovni portal
   Fraunces (naslovi) + Inter (tekst)
   ════════════════════════════════════════════ */
:root{
  /* Avala General Hospital — krimson crvena + grafit na čistoj kliničkoj beloj */
  --forest:#242a33; --forest-2:#2f3640; --forest-3:#191e25;
  --gold:#d82028; --gold-dk:#bd1a22;
  --cream:#f4f5f7; --paper:#ffffff; --line:#e5e8ec;
  --ink:#1b2026; --ink-2:#515862; --ink-3:#8b929c;
  --ok:#2f7d56; --ok-bg:#e7f3ec;
  --warn:#c0492a; --warn-bg:#fbe7df;
  --info:#2f5e7d; --info-bg:#e5eef4;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,24,30,.05),0 4px 16px rgba(20,24,30,.07);
  --shadow-lg:0 8px 40px rgba(20,24,30,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* ── LOGIN ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%,var(--forest-2),var(--forest-3));padding:20px;z-index:100}
.login-card{background:var(--paper);border-radius:20px;box-shadow:var(--shadow-lg);
  padding:42px 36px;width:100%;max-width:380px;text-align:center}
.login-mark{width:60px;height:60px;border-radius:15px;background:var(--gold);color:#fff;
  font-family:'Fraunces',serif;font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-card h1{font-size:25px;margin-bottom:4px}
.login-card .sub{color:var(--ink-3);font-size:13.5px;margin-bottom:26px}
.login-card input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  margin-bottom:11px;background:var(--cream);transition:.15s;text-align:center}
.login-card input:focus{outline:none;border-color:var(--gold);background:#fff}
.login-err{color:var(--warn);font-size:13px;min-height:18px;margin-bottom:6px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--gold);color:#fff}
.btn-primary:hover{background:var(--gold-dk)}
.btn-gold{background:var(--forest);color:#fff}
.btn-gold:hover{background:var(--forest-2)}
.btn-ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px}
.btn-danger{background:var(--warn-bg);color:var(--warn)}
.btn-danger:hover{background:#f6dccf}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:var(--forest);color:var(--cream);
  display:flex;align-items:center;gap:14px;padding:0 22px;height:60px}
.topbar .mark{width:36px;height:36px;border-radius:9px;background:var(--gold);color:#fff;
  font-family:'Fraunces',serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.topbar .brand{font-family:'Fraunces',serif;font-weight:600;font-size:17px}
.topbar .brand small{display:block;font-family:'Inter';font-weight:400;font-size:11px;opacity:.6;letter-spacing:.02em}
.topbar .spacer{flex:1}
.topbar .who{font-size:13px;opacity:.85;display:flex;align-items:center;gap:8px}
.topbar .who .role{background:rgba(216,32,40,.16);color:var(--gold);padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.topbar .logout{color:var(--cream);opacity:.7;font-size:13px;padding:6px 10px;border-radius:7px}
.topbar .logout:hover{opacity:1;background:rgba(255,255,255,.08)}

.layout{display:flex;max-width:1240px;margin:0 auto}
.nav{width:212px;flex-shrink:0;padding:22px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;
  border-radius:9px;color:var(--ink-2);font-size:14px;font-weight:500;transition:.13s;margin-bottom:2px}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button.active{background:var(--forest);color:var(--cream);font-weight:600}
.nav button.active .ico{opacity:1}
.nav button .ico{width:18px;height:18px;flex-shrink:0;opacity:.6}
.nav button .badge{margin-left:auto;background:var(--gold);color:#fff;font-size:11px;font-weight:700;
  min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

.main{flex:1;min-width:0;padding:26px 26px 80px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:27px}
.page-head .desc{color:var(--ink-3);font-size:13.5px;margin-top:3px}
.page-head .ph-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ── CARDS / PANELS ── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.grid{display:grid;gap:16px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:5px;line-height:1}
.stat .val small{font-size:15px;color:var(--ink-3);font-family:'Inter';font-weight:500}
.stat.accent{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.stat.accent .lbl{color:rgba(247,243,234,.6)}
.stat.warn{border-color:#eccab5}
.stat.warn .val{color:var(--warn)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:14px}
thead th{text-align:left;padding:12px 15px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-3);font-weight:600;background:var(--cream);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8f9fb}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{font-weight:600}
.muted{color:var(--ink-3)}

/* ── BADGES ── */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-info{background:var(--info-bg);color:var(--info)}
.tag-gray{background:#eceef1;color:var(--ink-2)}
.tag-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── FORMS ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:var(--paper);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field textarea{resize:vertical;min-height:64px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border:1.5px solid var(--line);border-radius:20px;font-size:13px;font-weight:500;color:var(--ink-2);transition:.13s}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,30,.55);backdrop-filter:blur(3px);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
.modal{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:560px;margin:auto}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:20px}
.modal-head .x{margin-left:auto;font-size:22px;color:var(--ink-3);width:30px;height:30px;border-radius:7px;line-height:1}
.modal-head .x:hover{background:var(--cream);color:var(--ink)}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ── A LA CARTE ORDER UI ── */
.meal-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.meal-tab{padding:11px 20px;border-radius:30px;background:var(--paper);border:1.5px solid var(--line);
  font-weight:600;font-size:14px;color:var(--ink-2);transition:.15s;display:flex;align-items:center;gap:9px}
.meal-tab .ct{background:var(--cream);color:var(--ink-3);font-size:12px;padding:1px 8px;border-radius:12px;font-weight:700}
.meal-tab.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.meal-tab.on .ct{background:var(--gold);color:#fff}
.cat-block{margin-bottom:22px}
.cat-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:11px;
  padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cat-title::before{content:"";width:5px;height:16px;background:var(--gold);border-radius:3px}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.dish{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;transition:.15s}
.dish.has{border-color:var(--gold);background:#fff5f5}
.dish .dn{font-weight:600;font-size:14.5px}
.dish .dd{font-size:12px;color:var(--ink-3);margin-top:2px;min-height:16px}
.dish .drow{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.dish .price{font-weight:600;color:var(--forest);font-size:14px}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:30px;height:30px;font-size:17px;font-weight:600;color:var(--forest);background:var(--cream)}
.qty button:hover{background:var(--line)}
.qty input{width:38px;text-align:center;border:none;background:transparent;font-weight:600;padding:0}
.qty input:focus{outline:none}

/* ── CART / SUMMARY ── */
.cart{position:sticky;top:80px}
.cart-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.cart-head h3{font-size:17px}
.cart-items{max-height:300px;overflow-y:auto}
.cart-item{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.cart-item:last-child{border:none}
.cart-item .ci-q{background:var(--forest);color:var(--cream);font-weight:700;font-size:12px;min-width:24px;height:24px;
  border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cart-item .ci-n{flex:1;min-width:0}
.cart-item .ci-n small{display:block;color:var(--ink-3);font-size:11.5px}
.cart-item .ci-p{font-weight:600;font-variant-numeric:tabular-nums}
.cart-empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}
.cart-foot{padding:16px 18px;border-top:1px solid var(--line)}
.cart-total{display:flex;justify-content:space-between;font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:13px}

/* ── ORDER CARD (admin view) ── */
.ord-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.ord-head{padding:15px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--cream)}
.ord-head .om{width:42px;height:42px;border-radius:10px;background:var(--forest);color:var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.ord-head .om b{font-family:'Fraunces';font-size:17px}
.ord-head .om span{font-size:9px;opacity:.7;margin-top:1px}
.ord-head .oi h4{font-size:15.5px;font-family:'Inter';font-weight:700}
.ord-head .oi .osub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ord-head .oactions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ord-body{padding:6px 18px 14px}
.ord-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ord-line:last-child{border:none}
.ord-line .olq{background:var(--cream);font-weight:700;min-width:30px;text-align:center;padding:2px 6px;border-radius:6px;font-size:13px}
.ord-line .oln{flex:1}
.ord-line .olc{font-size:11px;color:var(--ink-3)}

.empty{text-align:center;padding:54px 20px;color:var(--ink-3)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.4}
.empty h3{font-size:18px;color:var(--ink-2);margin-bottom:5px}

.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--forest);color:var(--cream);padding:12px 20px;border-radius:30px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);animation:tin .3s;max-width:90vw}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}

.loading{display:flex;align-items:center;justify-content:center;padding:50px;color:var(--ink-3);gap:10px}
.spin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--forest);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.inline-form{display:grid;gap:12px}
.date-pick{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--radius-sm);padding:4px 4px 4px 14px;font-weight:600}
.date-pick input{border:none;background:transparent;font-weight:600;padding:6px}
.date-pick input:focus{outline:none}

.sub-tabs{display:flex;gap:4px;background:var(--cream);padding:4px;border-radius:11px;margin-bottom:18px;width:fit-content;flex-wrap:wrap}
.sub-tab{padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.sub-tab.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

@media(max-width:880px){
  .layout{flex-direction:column}
  .nav{width:auto;position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:12px;
    border-bottom:1px solid var(--line);background:var(--paper)}
  .nav-group{display:none}
  .nav button{flex-direction:column;gap:5px;font-size:11px;padding:9px 12px;min-width:74px;text-align:center;white-space:nowrap}
  .nav button .badge{position:absolute;margin:0;top:5px;right:8px}
  .nav button{position:relative}
  .main{padding:18px 14px 70px}
  .cart{position:static}
  .order-layout{grid-template-columns:1fr!important}
}
.order-layout{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
@media(max-width:1080px){.order-layout{grid-template-columns:1fr 300px}}
</style>
</head>
<body>

<!-- ════ LOGIN ════ -->
<div id="login">
  <div class="login-card">
    <div class="login-mark">V</div>
    <h1>Vilara × Avala</h1>
    <div class="sub">Portal za naručivanje obroka</div>
    <input id="li-user" placeholder="Korisničko ime" autocomplete="username">
    <input id="li-pin" type="password" placeholder="Lozinka" autocomplete="current-password">
    <div class="login-err" id="li-err"></div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Prijava</button>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="app">
  <div class="topbar">
    <div class="mark">V</div>
    <div class="brand">Vilara × Avala<small id="tb-sub">Portal</small></div>
    <div class="spacer"></div>
    <div class="who"><span id="tb-name"></span><span class="role" id="tb-role"></span></div>
    <button class="logout" onclick="logout()">Odjava</button>
  </div>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ════════════════════════════════════════════════
//  KONFIGURACIJA
// ════════════════════════════════════════════════
const SB_URL = 'https://xlavckejuwldtpdnqabj.supabase.co';
const SB_KEY = 'sb_publishable_UkyzsM2DEJE7fNydLmR2QA_mBBzs3t3';
const sb = supabase.createClient(SB_URL, SB_KEY);

const OBROCI = [
  {id:'dorucak', naziv:'Doručak', ico:'☕'},
  {id:'rucak',   naziv:'Ručak',   ico:'🍲'},
  {id:'vecera',  naziv:'Večera',  ico:'🌙'},
];
const KATEGORIJE = ['dorucak','glavno','dijeta','supa','dezert'];
const KAT_NAZIV = {dorucak:'Doručak',glavno:'Glavna jela',dijeta:'Lagana dijeta',supa:'Supe i čorbe',dezert:'Dezerti'};

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let S = {
  user:null,           // {korisnicko_ime, uloga, ime}
  page:null,
  jela:[], artikli:[], normativi:[],
  cart:{},             // {obrok: {jelo_id: qty}}
  orderObrok:'dorucak',
  orderDatum:sutra(),
};

function sutra(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function danas(){return new Date().toISOString().slice(0,10);}
function fmt(n){return Number(n||0).toLocaleString('sr-RS',{minimumFractionDigits:0,maximumFractionDigits:2});}
function fmtDin(n){return fmt(n)+' RSD';}
function datSr(s){if(!s)return'';const[y,m,d]=s.split('-');return `${d}.${m}.${y}.`;}
function danUNedelji(s){const dani=['Nedelja','Ponedeljak','Utorak','Sreda','Četvrtak','Petak','Subota'];return dani[new Date(s+'T00:00').getDay()];}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
function toast(msg,type=''){
  const t=document.createElement('div');
  t.className='toast '+type; t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2600);
}

// ════════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════════
const EMAIL_DOMEN = '@vilara.local';
async function doLogin(){
  const u=document.getElementById('li-user').value.trim().toLowerCase();
  const p=document.getElementById('li-pin').value;
  const err=document.getElementById('li-err');
  err.textContent='';
  if(!u||!p){err.textContent='Unesite korisničko ime i lozinku.';return;}
  const email = u.includes('@') ? u : u+EMAIL_DOMEN;
  const {data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error||!data.user){err.textContent='Pogrešno korisničko ime ili lozinka.';return;}
  // učitaj ulogu iz av_korisnici
  const {data:row}=await sb.from('av_korisnici').select('*').eq('auth_id',data.user.id).maybeSingle();
  if(!row||!row.aktivan){err.textContent='Nalog nije aktivan. Kontaktirajte administratora.';await sb.auth.signOut();return;}
  S.user={korisnicko_ime:row.korisnicko_ime,uloga:row.uloga,ime:row.ime,id:row.id,auth_id:row.auth_id};
  startApp();
}
async function logout(){await sb.auth.signOut();location.reload();}

function startApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').style.display='block';
  document.getElementById('tb-name').textContent=S.user.ime||S.user.korisnicko_ime;
  document.getElementById('tb-role').textContent={admin:'Administrator',kuvar:'Kuhinja',direktor:'Direktor',klijent:'Klijent'}[S.user.uloga]||S.user.uloga;
  document.getElementById('tb-sub').textContent={admin:'Administracija',kuvar:'Kuhinja',direktor:'Izveštaji',klijent:'Naručivanje'}[S.user.uloga]||'';
  buildNav();
  const first=NAV[S.user.uloga][0].items[0].id;
  go(first);
}

function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=NAV[S.user.uloga].map(g=>
    (g.grp?`<div class="nav-group">${g.grp}</div>`:'')+
    g.items.map(it=>`<button id="nav-${it.id}" onclick="go('${it.id}')">${ICONS[it.i]}<span>${it.n}</span><span class="badge hidden" id="badge-${it.id}"></span></button>`).join('')
  ).join('');
}
function setBadge(id,n){
  const b=document.getElementById('badge-'+id);if(!b)return;
  if(n>0){b.textContent=n;b.classList.remove('hidden');}else b.classList.add('hidden');
}
function go(page){
  S.page=page;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+page)?.classList.add('active');
  RENDER[page]?.();
}
const RENDER={};
function setMain(html){document.getElementById('main').innerHTML=html;}
function loading(){setMain('<div class="loading"><div class="spin"></div> Učitavanje…</div>');}

//  DATA LOADERS

async function loadJela(){
  const {data}=await sb.from('av_jela').select('*').order('kategorija').order('naziv');
  S.jela=data||[];return S.jela;
}
async function loadArtikli(){
  const {data}=await sb.from('av_artikli').select('*').order('naziv');
  S.artikli=data||[];return S.artikli;
}
async function loadNormativi(){
  const {data}=await sb.from('av_normativ').select('*');
  S.normativi=data||[];return S.normativi;
}

// init
(async function(){
  document.getElementById('li-pin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('li-user').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('li-pin').focus();});
  const {data}=await sb.auth.getSession();
  if(data.session?.user){
    const {data:row}=await sb.from('av_korisnici').select('*').eq('auth_id',data.session.user.id).maybeSingle();
    if(row&&row.aktivan){
      S.user={korisnicko_ime:row.korisnicko_ime,uloga:row.uloga,ime:row.ime,id:row.id,auth_id:row.auth_id};
      startApp();
    }
  }
})();
</script>
<script id="views">
// ════════════════════════════════════════════════
//  KLIJENT — NARUČIVANJE (a la carte)
// ════════════════════════════════════════════════
RENDER.naruci = async function(){
  loading();
  await loadJela();
  if(!S.cart[S.orderObrok]) S.cart[S.orderObrok]={};
  renderNaruci();
};
function renderNaruci(){
  const aktivna = S.jela.filter(j=>j.aktivno);
  const tabs = OBROCI.map(o=>{
    const ct = Object.values(S.cart[o.id]||{}).reduce((a,b)=>a+b,0);
    return `<button class="meal-tab ${o.id===S.orderObrok?'on':''}" onclick="switchObrok('${o.id}')">
      ${o.ico} ${o.naziv} ${ct>0?`<span class="ct">${ct}</span>`:''}</button>`;
  }).join('');

  const jelaObrok = aktivna.filter(j=>(j.obrok||[]).includes(S.orderObrok));
  let body='';
  if(!jelaObrok.length){
    body=`<div class="empty"><div class="big">🍽️</div><h3>Nema jela za ovaj obrok</h3><p>Vilara još nije dodala jela u ovu kategoriju.</p></div>`;
  } else {
    KATEGORIJE.forEach(kat=>{
      const list=jelaObrok.filter(j=>j.kategorija===kat);
      if(!list.length)return;
      body+=`<div class="cat-block"><div class="cat-title">${KAT_NAZIV[kat]}</div><div class="dish-grid">`;
      list.forEach(j=>{
        const q=S.cart[S.orderObrok][j.id]||0;
        body+=`<div class="dish ${q>0?'has':''}" id="dish-${j.id}">
          <div class="dn">${esc(j.naziv)}</div>
          <div class="dd">${esc(j.opis||'')}</div>
          <div class="drow">
            <span class="price">${fmtDin(j.cena_porcije)}</span>
            <div class="qty">
              <button onclick="qChange('${j.id}',-1)">−</button>
              <input type="text" value="${q}" id="q-${j.id}" onchange="qSet('${j.id}',this.value)">
              <button onclick="qChange('${j.id}',1)">+</button>
            </div>
          </div></div>`;
      });
      body+=`</div></div>`;
    });
  }

  setMain(`
    <div class="page-head">
      <div><h2>Naruči obroke</h2><div class="desc">Izbor jela za isporuku — a la carte</div></div>
      <div class="ph-actions">
        <div class="date-pick">📅 <span class="muted" style="font-size:13px">${danUNedelji(S.orderDatum)}</span>
          <input type="date" value="${S.orderDatum}" min="${danas()}" onchange="setDatum(this.value)"></div>
      </div>
    </div>
    <div class="meal-tabs">${tabs}</div>
    <div class="order-layout">
      <div>${body}</div>
      <div>${renderCart()}</div>
    </div>`);
}
function renderCart(){
  let items='', total=0, count=0;
  OBROCI.forEach(o=>{
    const c=S.cart[o.id]||{};
    Object.entries(c).forEach(([jid,q])=>{
      if(q<=0)return;
      const j=S.jela.find(x=>x.id===jid);if(!j)return;
      const sum=j.cena_porcije*q; total+=sum; count+=q;
      items+=`<div class="cart-item"><span class="ci-q">${q}×</span>
        <span class="ci-n">${esc(j.naziv)}<small>${OBROCI.find(x=>x.id===o.id).naziv} · ${fmtDin(j.cena_porcije)}</small></span>
        <span class="ci-p">${fmt(sum)}</span></div>`;
    });
  });
  return `<div class="card cart">
    <div class="cart-head">${ICONS.cart.replace('class="ico"','style="width:18px;height:18px"')}<h3>Porudžbina</h3></div>
    <div class="cart-items">${items||'<div class="cart-empty">Korpa je prazna.<br>Dodajte jela klikom na +</div>'}</div>
    <div class="cart-foot">
      <div class="cart-total"><span>Ukupno</span><span>${fmt(total)} RSD</span></div>
      <button class="btn btn-primary btn-block" ${count?'':'disabled'} onclick="posalji()">Pošalji porudžbinu (${count})</button>
    </div></div>`;
}
function switchObrok(o){S.orderObrok=o;if(!S.cart[o])S.cart[o]={};renderNaruci();}
function setDatum(d){S.orderDatum=d;renderNaruci();}
function qChange(jid,delta){
  const c=S.cart[S.orderObrok];
  c[jid]=Math.max(0,(c[jid]||0)+delta);
  if(c[jid]===0)delete c[jid];
  renderNaruci();
}
function qSet(jid,val){
  const n=Math.max(0,parseInt(val)||0);
  const c=S.cart[S.orderObrok];
  if(n===0)delete c[jid];else c[jid]=n;
  renderNaruci();
}
async function posalji(){
  // skupi sve obroke koji imaju stavke -> zasebne porudzbine
  const obrociSaStavkama = OBROCI.filter(o=>Object.values(S.cart[o.id]||{}).some(q=>q>0));
  if(!obrociSaStavkama.length){toast('Korpa je prazna.','err');return;}
  let kreirano=0;
  for(const o of obrociSaStavkama){
    const c=S.cart[o.id];
    const {data:ord,error}=await sb.from('av_porudzbine').insert({
      datum_za:S.orderDatum, obrok:o.id, status:'nova', kreirao:S.user.ime||S.user.korisnicko_ime
    }).select().single();
    if(error){toast('Greška pri slanju.','err');return;}
    const stavke=Object.entries(c).filter(([_,q])=>q>0).map(([jid,q])=>{
      const j=S.jela.find(x=>x.id===jid);
      return {porudzbina_id:ord.id, jelo_id:jid, jelo_naziv:j.naziv, kolicina:q, cena_porcije:j.cena_porcije};
    });
    await sb.from('av_stavke').insert(stavke);
    kreirano++;
  }
  S.cart={};
  toast(`Poslato! (${kreirano} ${kreirano===1?'obrok':'obroka'})`,'ok');
  go('moje');
}

// ════════════════════════════════════════════════
//  KLIJENT — MOJE PORUDZBINE
// ════════════════════════════════════════════════
RENDER.moje = async function(){
  loading();
  const {data:ords}=await sb.from('av_porudzbine').select('*').order('datum_za',{ascending:false}).order('created_at',{ascending:false});
  const ids=(ords||[]).map(o=>o.id);
  let stavke=[];
  if(ids.length){const {data}=await sb.from('av_stavke').select('*').in('porudzbina_id',ids);stavke=data||[];}
  renderPorudzbineList(ords||[],stavke,false);
};
function statusTag(st){
  if(st==='nova')return '<span class="tag tag-info tag-dot">Nova</span>';
  if(st==='potvrdjena')return '<span class="tag tag-ok tag-dot">Potvrđena</span>';
  if(st==='isporucena')return '<span class="tag tag-gray tag-dot">Isporučena</span>';
  return st;
}
function renderPorudzbineList(ords,stavke,admin){
  const uloga=S.user.uloga;
  const jeKuvar=uloga==='kuvar';
  const jeAdmin=uloga==='admin';
  const naslov=admin?(jeKuvar?'Porudžbine za kuhinju':'Porudžbine'):'Moje porudžbine';
  const showCene=jeAdmin||uloga==='klijent'; // kuvar ne vidi cene
  if(!ords.length){
    setMain(`<div class="page-head"><div><h2>${naslov}</h2></div></div>
      <div class="empty"><div class="big">📋</div><h3>Nema porudžbina</h3><p>${admin?'Klijent još nije poslao nijednu porudžbinu.':'Još niste poslali nijednu porudžbinu.'}</p></div>`);
    return;
  }
  // grupisi po datumu
  const byDate={};
  ords.forEach(o=>{(byDate[o.datum_za]=byDate[o.datum_za]||[]).push(o);});
  let html='';
  Object.keys(byDate).sort().reverse().forEach(dat=>{
    html+=`<div style="margin:20px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="font-size:17px">${danUNedelji(dat)}, ${datSr(dat)}</h3>
      <span class="muted" style="font-size:13px">${dat===sutra()?'(sutra)':dat===danas()?'(danas)':''}</span>
      ${(jeAdmin||jeKuvar)?`<div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-sm btn-ghost" onclick="nalogKuvar('${dat}')">🍳 Nalog za kuvara</button>
        ${jeAdmin?`<button class="btn btn-sm btn-ghost" onclick="nalogVozac('${dat}')">🚐 Nalog za vozača</button>`:''}
      </div>`:''}</div>`;
    OBROCI.forEach(ob=>{
      const o=byDate[dat].find(x=>x.obrok===ob.id);
      if(!o)return;
      const st=stavke.filter(s=>s.porudzbina_id===o.id);
      const total=st.reduce((a,s)=>a+s.cena_porcije*s.kolicina,0);
      const broj=st.reduce((a,s)=>a+s.kolicina,0);
      html+=`<div class="ord-card">
        <div class="ord-head">
          <div class="om"><b>${ob.ico}</b><span>${ob.naziv}</span></div>
          <div class="oi"><h4>${ob.naziv} — ${broj} ${broj===1?'porcija':'porcija'}</h4>
            <div class="osub">${st.length} ${st.length===1?'jelo':'jela'}${showCene?' · '+fmtDin(total):''}</div></div>
          <div class="oactions">${statusTag(o.status)}
            ${jeAdmin?adminOrdActions(o):''}
            ${jeKuvar?`<button class="btn btn-sm btn-ghost" onclick="stampaj('${o.id}')">🖨</button>`:''}
            ${uloga==='klijent'&&o.status==='nova'?`<button class="btn btn-sm btn-danger" onclick="obrisiPorudzbinu('${o.id}')">Otkaži</button>`:''}
          </div>
        </div>
        <div class="ord-body">
          ${st.map(s=>`<div class="ord-line"><span class="olq">${s.kolicina}×</span>
            <span class="oln">${esc(s.jelo_naziv)}</span>
            ${showCene?`<span class="muted" style="font-size:13px">${fmtDin(s.cena_porcije*s.kolicina)}</span>`:''}</div>`).join('')}
        </div></div>`;
    });
  });
  setMain(`<div class="page-head"><div><h2>${naslov}</h2>
    <div class="desc">${admin?'Pristigle porudžbine od bolnice Avala':'Pregled poslatih porudžbina'}</div></div></div>${html}`);
}
async function obrisiPorudzbinu(id){
  if(!confirm('Otkazati ovu porudžbinu?'))return;
  await sb.from('av_porudzbine').delete().eq('id',id);
  toast('Porudžbina otkazana.','ok');
  go(S.user.uloga==='klijent'?'moje':'porudzbine');
}

// ════════════════════════════════════════════════
//  ADMIN — PREGLED (dashboard)
// ════════════════════════════════════════════════
RENDER.pregled = async function(){
  loading();
  const [{data:ords},art] = await Promise.all([
    sb.from('av_porudzbine').select('*'),
    loadArtikli()
  ]);
  const sutraOrd=(ords||[]).filter(o=>o.datum_za===sutra());
  const nove=(ords||[]).filter(o=>o.status==='nova');
  const ispod=art.filter(a=>Number(a.stanje)<=Number(a.min_zaliha)&&Number(a.min_zaliha)>0);
  const vrednostLagera=art.reduce((a,x)=>a+Number(x.stanje)*Number(x.cena_po_jedinici),0);
  setBadge('porudzbine',nove.length);

  // stavke za sutra
  const sutraIds=sutraOrd.map(o=>o.id);
  let sutraStavke=[];
  if(sutraIds.length){const {data}=await sb.from('av_stavke').select('*').in('porudzbina_id',sutraIds);sutraStavke=data||[];}
  const sutraPorcija=sutraStavke.reduce((a,s)=>a+s.kolicina,0);

  setMain(`
    <div class="page-head"><div><h2>Pregled</h2><div class="desc">${danUNedelji(danas())}, ${datSr(danas())}</div></div></div>
    <div class="grid stat-grid" style="margin-bottom:20px">
      <div class="stat accent"><div class="lbl">Za sutra</div><div class="val">${sutraOrd.length} <small>${sutraOrd.length===1?'porudžbina':'porudžbina'}</small></div></div>
      <div class="stat"><div class="lbl">Porcija za sutra</div><div class="val">${sutraPorcija}</div></div>
      <div class="stat ${nove.length?'warn':''}"><div class="lbl">Nove (nepotvrđene)</div><div class="val">${nove.length}</div></div>
      <div class="stat ${ispod.length?'warn':''}"><div class="lbl">Artikli ispod minimuma</div><div class="val">${ispod.length}</div></div>
      <div class="stat"><div class="lbl">Vrednost lagera</div><div class="val" style="font-size:23px">${fmt(vrednostLagera)} <small>RSD</small></div></div>
    </div>
    ${ispod.length?`<div class="card card-pad" style="margin-bottom:18px;border-color:#eccab5">
      <h3 style="font-size:16px;margin-bottom:12px;color:var(--warn)">⚠ Potrebna nabavka</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Artikal</th><th class="num">Stanje</th><th class="num">Minimum</th><th class="num">Nedostaje</th></tr></thead>
      <tbody>${ispod.map(a=>`<tr><td class="t-strong">${esc(a.naziv)}</td>
        <td class="num">${fmt(a.stanje)} ${a.jedinica}</td><td class="num muted">${fmt(a.min_zaliha)} ${a.jedinica}</td>
        <td class="num" style="color:var(--warn);font-weight:600">${fmt(a.min_zaliha-a.stanje)} ${a.jedinica}</td></tr>`).join('')}</tbody></table></div>
    </div>`:''}
    <div class="card card-pad">
      <h3 style="font-size:16px;margin-bottom:6px">Sumarno za sutra (${datSr(sutra())})</h3>
      ${sutraPorcija?renderSutraSumarno(sutraStavke):'<p class="muted" style="padding:14px 0">Još nema porudžbina za sutra.</p>'}
    </div>`);
};
function renderSutraSumarno(stavke){
  const agg={};
  stavke.forEach(s=>{agg[s.jelo_naziv]=(agg[s.jelo_naziv]||0)+s.kolicina;});
  const rows=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  return `<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Jelo</th><th class="num">Ukupno porcija</th></tr></thead>
    <tbody>${rows.map(([n,q])=>`<tr><td class="t-strong">${esc(n)}</td><td class="num">${q}</td></tr>`).join('')}</tbody></table></div>`;
}

// ════════════════════════════════════════════════
//  ADMIN — PORUDZBINE
// ════════════════════════════════════════════════
RENDER.porudzbine = async function(){
  loading();

// ── Skupi sve porudzbine za dati datum, grupisano po obroku ──
async function dnevneStavke(dat){
  const {data:ords}=await sb.from('av_porudzbine').select('*').eq('datum_za',dat);
  if(!ords||!ords.length)return null;
  const ids=ords.map(o=>o.id);
  const {data:stavke}=await sb.from('av_stavke').select('*').in('porudzbina_id',ids);
  const perObrok={};
  OBROCI.forEach(ob=>{
    const oIds=ords.filter(o=>o.obrok===ob.id).map(o=>o.id);
    const st=(stavke||[]).filter(s=>oIds.includes(s.porudzbina_id));
    // agregiraj po jelu
    const agg={};
    st.forEach(s=>{
      if(!agg[s.jelo_id])agg[s.jelo_id]={naziv:s.jelo_naziv,kolicina:0};
      agg[s.jelo_id].kolicina+=s.kolicina;
    });
    perObrok[ob.id]=Object.values(agg).sort((a,b)=>b.kolicina-a.kolicina);
  });
  return {ords,perObrok};
}

      <div class="field"><label>Naziv jela</label><input id="j-naziv" value="${esc(e.naziv)}" placeholder="npr. Punjena pileća šnicla"></div>
      <div class="field-row">
        <div class="field"><label>Kategorija</label><select id="j-kat">
          ${KATEGORIJE.map(k=>`<option value="${k}" ${e.kategorija===k?'selected':''}>${KAT_NAZIV[k]}</option>`).join('')}</select></div>
        <div class="field"><label>Cena porcije (RSD)</label><input id="j-cena" type="number" step="1" value="${e.cena_porcije}"></div>
      </div>
      <div class="field"><label>Dostupno za obroke</label>
        <div class="chips" id="j-obroci">${OBROCI.map(o=>`<div class="chip ${obr.includes(o.id)?'on':''}" data-o="${o.id}" onclick="this.classList.toggle('on')">${o.ico} ${o.naziv}</div>`).join('')}</div></div>
      <div class="field"><label>Opis (opciono)</label><input id="j-opis" value="${esc(e.opis||'')}" placeholder="kratak opis"></div>
      <div class="field"><label><input type="checkbox" id="j-aktivno" ${e.aktivno?'checked':''} style="width:auto;margin-right:6px"> Aktivno (vidljivo klijentu)</label></div>
    </div>`,
    [j?`<button class="btn btn-danger" onclick="obrisiJelo('${j.id}')">Obriši</button>`:'',
     `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>`,
     `<button class="btn btn-primary" onclick="sacuvajJelo(${j?`'${j.id}'`:'null'})">Sačuvaj</button>`].join(''));
}
async function sacuvajJelo(id){
  const obroci=[...document.querySelectorAll('#j-obroci .chip.on')].map(c=>c.dataset.o);
  if(!obroci.length){toast('Izaberite bar jedan obrok.','err');return;}
  const rec={
    naziv:val('j-naziv').trim(), kategorija:val('j-kat'), obrok:obroci,
    cena_porcije:parseFloat(val('j-cena'))||0, opis:val('j-opis').trim()||null,
    aktivno:document.getElementById('j-aktivno').checked
  };
  if(!rec.naziv){toast('Unesite naziv.','err');return;}
  if(id){await sb.from('av_jela').update(rec).eq('id',id);}
  else{await sb.from('av_jela').insert(rec);}
  closeModal();toast('Sačuvano.','ok');await Promise.all([loadJela(),loadNormativi()]);renderJela();
}
async function obrisiJelo(id){
  if(!confirm('Obrisati jelo? Briše se i njegov normativ.'))return;
  await sb.from('av_jela').delete().eq('id',id);
  closeModal();toast('Obrisano.','ok');await Promise.all([loadJela(),loadNormativi()]);renderJela();
}

RENDER.normativi = async function(){
  loading();
  await Promise.all([loadJela(),loadArtikli(),loadNormativi()]);
  renderNormativi();
};
let normJelo=null;
function renderNormativi(){
  if(!S.jela.length){
    setMain(`<div class="page-head"><div><h2>Normativi</h2></div></div>
      <div class="empty"><div class="big">📋</div><h3>Prvo dodajte jela</h3><p>Normativ povezuje jelo sa artiklima sa lagera.</p></div>`);
    return;
  }
  if(!normJelo)normJelo=S.jela[0].id;
  const j=S.jela.find(x=>x.id===normJelo);
  const norms=S.normativi.filter(n=>n.jelo_id===normJelo);
  const cenaKost=norms.reduce((a,n)=>{const art=S.artikli.find(x=>x.id===n.artikl_id);return a+(art?Number(art.cena_po_jedinici)*Number(n.kolicina):0);},0);
  setMain(`
    <div class="page-head"><div><h2>Normativi</h2><div class="desc">Utrošak artikala po porciji — automatski skida lager pri potvrdi porudžbine</div></div></div>
    <div class="card card-pad" style="margin-bottom:16px">
      <div class="field" style="margin:0;max-width:420px"><label>Izaberi jelo</label>
        <select onchange="normJelo=this.value;renderNormativi()">
          ${KATEGORIJE.map(k=>{const l=S.jela.filter(x=>x.kategorija===k);if(!l.length)return'';
            return `<optgroup label="${KAT_NAZIV[k]}">${l.map(x=>`<option value="${x.id}" ${x.id===normJelo?'selected':''}>${esc(x.naziv)}</option>`).join('')}</optgroup>`;}).join('')}
        </select></div>
    </div>
    <div class="card">
      <div class="cart-head" style="border-bottom:1px solid var(--line)">
        <h3 style="font-size:17px">Normativ: ${esc(j.naziv)}</h3>
        <div class="spacer" style="flex:1"></div>
        <span class="tag tag-info">Cena koštanja: ${fmt(cenaKost)} RSD</span>
        ${j.cena_porcije>0?`<span class="tag ${j.cena_porcije-cenaKost>0?'tag-ok':'tag-warn'}" style="margin-left:6px">Marža: ${fmt(j.cena_porcije-cenaKost)} RSD</span>`:''}
      </div>
      <div style="padding:0">
        ${norms.length?`<div class="tbl-wrap" style="border:none"><table><thead><tr><th>Artikal</th><th class="num">Količina / porcija</th><th class="num">Cena koštanja</th><th></th></tr></thead>
          <tbody>${norms.map(n=>{const art=S.artikli.find(x=>x.id===n.artikl_id);if(!art)return'';
            return `<tr><td class="t-strong">${esc(art.naziv)}</td>
              <td class="num">${fmt(n.kolicina)} ${art.jedinica}</td>
              <td class="num">${fmt(Number(art.cena_po_jedinici)*Number(n.kolicina))} RSD</td>
              <td class="num"><button class="btn btn-sm btn-danger" onclick="obrisiNormativ('${n.id}')">Ukloni</button></td></tr>`;
          }).join('')}</tbody></table></div>`:'<div class="cart-empty" style="padding:30px">Normativ još nije definisan za ovo jelo.</div>'}
      </div>
      <div class="cart-foot" style="border-top:1px solid var(--line)">
        ${S.artikli.length?`<div class="field-row" style="grid-template-columns:2fr 1fr auto;align-items:end;gap:10px">
          <div class="field" style="margin:0"><label>Artikal</label><select id="nm-art">
            ${S.artikli.filter(a=>!norms.some(n=>n.artikl_id===a.id)).map(a=>`<option value="${a.id}">${esc(a.naziv)} (${a.jedinica})</option>`).join('')}</select></div>
          <div class="field" style="margin:0"><label>Količina</label><input id="nm-kol" type="number" step="0.001" placeholder="0"></div>
          <button class="btn btn-gold" onclick="dodajNormativ()">Dodaj</button>
        </div>`:'<p class="muted">Prvo dodajte artikle u magacin.</p>'}
      </div>
    </div>`);
}
function otvoriNormativ(jid){normJelo=jid;renderNormativi();}
async function dodajNormativ(){
  const art=val('nm-art'),kol=parseFloat(val('nm-kol'))||0;
  if(!art){toast('Izaberite artikal.','err');return;}
  if(kol<=0){toast('Unesite količinu.','err');return;}
  await sb.from('av_normativ').insert({jelo_id:normJelo,artikl_id:art,kolicina:kol});
  toast('Dodato u normativ.','ok');await loadNormativi();renderNormativi();
}
async function obrisiNormativ(id){
  await sb.from('av_normativ').delete().eq('id',id);
  toast('Uklonjeno.','ok');await loadNormativi();renderNormativi();
}

RENDER.statistika = async function(){
  loading();
  const [{data:ords},{data:stavke},art] = await Promise.all([
    sb.from('av_porudzbine').select('*'),
    sb.from('av_stavke').select('*'),
    loadArtikli()
  ]);
  const O=ords||[], ST=stavke||[];
  const stById={}; O.forEach(o=>stById[o.id]=o);

  // KPI
  const ukPorudzbina=O.length;
  const ukPorcija=ST.reduce((a,s)=>a+s.kolicina,0);
  const ukVrednost=ST.reduce((a,s)=>a+s.cena_porcije*s.kolicina,0);
  const vrednostLagera=art.reduce((a,x)=>a+Number(x.stanje)*Number(x.cena_po_jedinici),0);
  const danaAktivnih=new Set(O.map(o=>o.datum_za)).size;
  const prosekDan=danaAktivnih?Math.round(ukPorcija/danaAktivnih):0;

  // Porcije po obroku
  const poObroku={dorucak:0,rucak:0,vecera:0};
  ST.forEach(s=>{const o=stById[s.porudzbina_id];if(o)poObroku[o.obrok]=(poObroku[o.obrok]||0)+s.kolicina;});

  // Top jela
  const poJelu={};
  ST.forEach(s=>{poJelu[s.jelo_naziv]=(poJelu[s.jelo_naziv]||0)+s.kolicina;});
  const topJela=Object.entries(poJelu).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // Porcije po danu (poslednjih 14 datuma)
  const poDanu={};
  ST.forEach(s=>{const o=stById[s.porudzbina_id];if(o)poDanu[o.datum_za]=(poDanu[o.datum_za]||0)+s.kolicina;});
  const daniSort=Object.keys(poDanu).sort().slice(-14);

  // Status raspodela
  const poStatusu={nova:0,potvrdjena:0,isporucena:0};
  O.forEach(o=>poStatusu[o.status]=(poStatusu[o.status]||0)+1);

  if(!O.length){
    setMain(`<div class="page-head"><div><h2>Statistika</h2><div class="desc">Pregled poslovanja Vilara × Avala</div></div></div>
      <div class="empty"><div class="big">📊</div><h3>Još nema podataka</h3><p>Statistika će se popuniti kada krenu porudžbine.</p></div>`);
    return;
  }

  setMain(`
    <div class="page-head"><div><h2>Statistika</h2><div class="desc">Pregled poslovanja Vilara × Avala</div></div></div>
    <div class="grid stat-grid" style="margin-bottom:22px">
      <div class="stat accent"><div class="lbl">Ukupno porcija</div><div class="val">${ukPorcija}</div></div>
      <div class="stat"><div class="lbl">Porudžbina</div><div class="val">${ukPorudzbina}</div></div>
      <div class="stat"><div class="lbl">Aktivnih dana</div><div class="val">${danaAktivnih}</div></div>
      <div class="stat"><div class="lbl">Prosek porcija/dan</div><div class="val">${prosekDan}</div></div>
      ${ukVrednost>0?`<div class="stat"><div class="lbl">Vrednost porudžbina</div><div class="val" style="font-size:22px">${fmt(ukVrednost)} <small>RSD</small></div></div>`:''}
      <div class="stat"><div class="lbl">Vrednost lagera</div><div class="val" style="font-size:22px">${fmt(vrednostLagera)} <small>RSD</small></div></div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card card-pad">
        <h3 style="font-size:16px;margin-bottom:16px">Porcije po obroku</h3>
        ${barChart([
          {label:'☕ Doručak',val:poObroku.dorucak,color:'#d82028'},
          {label:'🍲 Ručak',val:poObroku.rucak,color:'#2f3640'},
          {label:'🌙 Večera',val:poObroku.vecera,color:'#2f5e7d'},
        ])}
      </div>
      <div class="card card-pad">
        <h3 style="font-size:16px;margin-bottom:16px">Status porudžbina</h3>
        ${barChart([
          {label:'Nova',val:poStatusu.nova,color:'#2f5e7d'},
          {label:'Potvrđena',val:poStatusu.potvrdjena,color:'#2f7d56'},
          {label:'Isporučena',val:poStatusu.isporucena,color:'#8b929c'},
        ])}
      </div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px">
      <h3 style="font-size:16px;margin-bottom:18px">Porcije po danu ${daniSort.length>1?`(poslednjih ${daniSort.length})`:''}</h3>
      ${lineChart(daniSort.map(d=>({x:d,y:poDanu[d]})))}
    </div>

    <div class="card card-pad">
      <h3 style="font-size:16px;margin-bottom:14px">Najtraženija jela (top 10)</h3>
      ${topJela.length?`<div class="tbl-wrap" style="border:none"><table><thead><tr><th style="width:40px">#</th><th>Jelo</th><th class="num">Porcija</th><th style="width:40%">Udeo</th></tr></thead>
        <tbody>${topJela.map(([n,q],i)=>{
          const pct=Math.round(q/topJela[0][1]*100);
          return `<tr><td class="muted">${i+1}</td><td class="t-strong">${esc(n)}</td><td class="num">${q}</td>
            <td><div style="background:var(--cream);border-radius:6px;height:18px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--forest);border-radius:6px"></div></div></td></tr>`;
        }).join('')}</tbody></table></div>`:'<p class="muted">Nema podataka.</p>'}
    </div>`);
};

// horizontalni bar chart (SVG-free, čisti div)
function barChart(items){
  const max=Math.max(1,...items.map(i=>i.val));
  return items.map(it=>`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px">
        <span style="font-weight:600">${it.label}</span><span class="muted" style="font-weight:600">${it.val}</span></div>
      <div style="background:var(--cream);border-radius:7px;height:22px;overflow:hidden">
        <div style="width:${it.val/max*100}%;height:100%;background:${it.color};border-radius:7px;transition:.4s"></div></div>
    </div>`).join('');
}

// linijski chart kao SVG
function lineChart(points){
  if(!points.length)return '<p class="muted">Nema podataka.</p>';
  if(points.length===1){
    return `<div style="text-align:center;padding:20px"><div class="val" style="font-family:'Fraunces';font-size:36px">${points[0].y}</div>
      <div class="muted">${datSr(points[0].x)}</div></div>`;
  }
  const W=720,H=200,pad=30;
  const maxY=Math.max(...points.map(p=>p.y));
  const stepX=(W-pad*2)/(points.length-1);
  const scaleY=v=>H-pad-(v/(maxY||1))*(H-pad*2);
  const coords=points.map((p,i)=>[pad+i*stepX,scaleY(p.y)]);
  const path=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=path+` L${coords[coords.length-1][0].toFixed(1)} ${H-pad} L${coords[0][0].toFixed(1)} ${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f3640" stop-opacity="0.18"/><stop offset="100%" stop-color="#2f3640" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/>
    <path d="${path}" fill="none" stroke="#2f3640" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#242a33"/>
      <text x="${c[0].toFixed(1)}" y="${c[1]-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#242a33">${points[i].y}</text>`).join('')}
    ${points.map((p,i)=>`<text x="${(pad+i*stepX).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8b929c">${p.x.slice(8)}.${p.x.slice(5,7)}</text>`).join('')}
  </svg>`;
}

// ════════════════════════════════════════════════
//  ADMIN — KORISNICI (Supabase Auth preko Edge funkcije)
// ════════════════════════════════════════════════
const ULOGE_OPIS={admin:'Administrator (sve)',kuvar:'Kuhinja (jela, normativi, porudžbine)',direktor:'Direktor (statistika)',klijent:'Klijent / Avala (naručivanje)'};
async function mu(action,payload={}){
  const {data,error}=await sb.functions.invoke('manage-users',{body:{action,...payload}});
  if(error){
    // pokušaj da pročitaš poruku iz tela
    let msg='Greška.';
    try{const ctx=await error.context?.json();if(ctx?.error)msg=ctx.error;}catch(e){}
    return {error:msg};
  }
  if(data?.error)return {error:data.error};
  return data;
}
RENDER.korisnici = async function(){
  loading();
  const res=await mu('list');
  if(res.error){setMain(`<div class="page-head"><div><h2>Korisnici</h2></div></div>
    <div class="empty"><div class="big">⚠</div><h3>${esc(res.error)}</h3></div>`);return;}
  renderKorisnici(res.users||[]);
};
function renderKorisnici(users){
  setMain(`
    <div class="page-head"><div><h2>Korisnici</h2><div class="desc">Upravljanje nalozima i ulogama</div></div>
      <div class="ph-actions"><button class="btn btn-primary" onclick="korisnikModal()">+ Novi nalog</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Korisničko ime</th><th>Ime</th><th>Uloga</th><th>Status</th><th></th></tr></thead>
      <tbody>${users.map(u=>`<tr ${u.aktivan?'':'style="opacity:.55"'}>
        <td class="t-strong">${esc(u.korisnicko_ime)}</td>
        <td>${esc(u.ime||'')}</td>
        <td>${ulogaTag(u.uloga)}</td>
        <td>${u.aktivan?'<span class="tag tag-ok tag-dot">Aktivan</span>':'<span class="tag tag-gray tag-dot">Neaktivan</span>'}</td>
        <td class="num"><button class="btn btn-sm btn-ghost" onclick='korisnikModal(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Uredi</button></td>
      </tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12.5px;margin-top:14px">Lozinke se čuvaju bezbedno (heširane) kroz Supabase Auth. Korisnici se prijavljuju korisničkim imenom i lozinkom.</p>`);
}
function ulogaTag(u){
  const m={admin:'tag-warn',kuvar:'tag-info',direktor:'tag-ok',klijent:'tag-gray'};
  const n={admin:'Administrator',kuvar:'Kuhinja',direktor:'Direktor',klijent:'Klijent'};
  return `<span class="tag ${m[u]||'tag-gray'}">${n[u]||u}</span>`;
}
function korisnikModal(u=null){
  const e=u||{korisnicko_ime:'',ime:'',uloga:'klijent',aktivan:true};
  openModal(u?'Izmena naloga':'Novi nalog',`
    <div class="inline-form">
      <div class="field"><label>Korisničko ime</label>
        <input id="k-user" value="${esc(e.korisnicko_ime)}" placeholder="npr. milica" ${u?'disabled style="opacity:.6"':''}></div>
      <div class="field"><label>Ime i prezime</label><input id="k-ime" value="${esc(e.ime||'')}" placeholder="npr. Milica Petrović"></div>
      <div class="field"><label>Uloga</label><select id="k-uloga">
        ${Object.entries(ULOGE_OPIS).map(([v,t])=>`<option value="${v}" ${e.uloga===v?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>${u?'Nova lozinka (ostavi prazno da ne menjaš)':'Lozinka'}</label>
        <input id="k-pass" type="text" placeholder="min. 6 karaktera" autocomplete="new-password"></div>
      ${u?`<div class="field"><label><input type="checkbox" id="k-aktivan" ${e.aktivan?'checked':''} style="width:auto;margin-right:6px"> Nalog aktivan</label></div>`:''}
    </div>`,
    [u&&u.auth_id!==S.user.auth_id?`<button class="btn btn-danger" onclick="obrisiKorisnika('${u.id}')">Obriši</button>`:'',
     `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>`,
     `<button class="btn btn-primary" id="k-save" onclick="sacuvajKorisnika(${u?`'${u.id}'`:'null'})">Sačuvaj</button>`].join(''));
}
async function sacuvajKorisnika(id){
  const btn=document.getElementById('k-save');btn.disabled=true;btn.textContent='Čuvam…';
  const ime=val('k-ime').trim(), uloga=val('k-uloga'), pass=val('k-pass');
  let res;
  if(id){
    const payload={action:'update',id,ime,uloga};
    if(pass)payload.password=pass;
    const akt=document.getElementById('k-aktivan');
    if(akt)payload.aktivan=akt.checked;
    res=await mu('update',payload);
  }else{
    const user=val('k-user').trim().toLowerCase();
    if(!user||!pass){toast('Korisničko ime i lozinka su obavezni.','err');btn.disabled=false;btn.textContent='Sačuvaj';return;}
    res=await mu('create',{korisnicko_ime:user,password:pass,ime,uloga});
  }
  if(res.error){toast(res.error,'err');btn.disabled=false;btn.textContent='Sačuvaj';return;}
  closeModal();toast('Sačuvano.','ok');RENDER.korisnici();
}
async function obrisiKorisnika(id){
  if(!confirm('Obrisati ovaj nalog? Korisnik više neće moći da se prijavi.'))return;
  const res=await mu('delete',{id});
  if(res.error){toast(res.error,'err');return;}
  closeModal();toast('Nalog obrisan.','ok');RENDER.korisnici();
}

//  MODAL HELPERS
// ════════════════════════════════════════════════
function val(id){return document.getElementById(id).value;}
function openModal(title,body,footer){
  const wrap=document.createElement('div');wrap.className='modal-bg';wrap.id='modal-bg';
  wrap.onclick=e=>{if(e.target===wrap)closeModal();};
  wrap.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></div>`;
  document.body.appendChild(wrap);
}
function closeModal(){document.getElementById('modal-bg')?.remove();}
