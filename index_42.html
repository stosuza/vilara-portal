<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilara Partner Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%23000000'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EV%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════
   VILARA × AVALA — Poslovni portal
   Fraunces (naslovi) + Inter (tekst)
   ════════════════════════════════════════════ */
:root{
  /* Avala General Hospital — krimson crvena + grafit na čistoj kliničkoj beloj */
  --forest:#242a33; --forest-2:#2f3640; --forest-3:#191e25;
  --gold:#d82028; --gold-dk:#bd1a22;
  --cream:#f4f5f7; --paper:#ffffff; --line:#e5e8ec;
  --ink:#1b2026; --ink-2:#515862; --ink-3:#8b929c;
  --ok:#2f7d56; --ok-bg:#e7f3ec;
  --warn:#c0492a; --warn-bg:#fbe7df;
  --info:#2f5e7d; --info-bg:#e5eef4;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,24,30,.05),0 4px 16px rgba(20,24,30,.07);
  --shadow-lg:0 8px 40px rgba(20,24,30,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* ── LOGIN (crno-beli brend) ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0a0a0a;padding:20px;z-index:100}
.login-card{background:#fff;border-radius:4px;box-shadow:0 24px 70px rgba(0,0,0,.5);
  padding:48px 40px;width:100%;max-width:380px;text-align:center}
.login-mark{width:64px;height:64px;border-radius:2px;background:#000;color:#fff;
  font-family:'Fraunces',serif;font-weight:700;font-size:36px;line-height:1;
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.login-card h1{font-size:23px;margin-bottom:5px;color:#000;letter-spacing:-.01em}
.login-card .sub{color:#8a8a8a;font-size:13px;margin-bottom:30px;letter-spacing:.01em}
.login-card input{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:2px;
  margin-bottom:10px;background:#fafafa;transition:.15s;text-align:center;color:#000}
.login-card input::placeholder{color:#aaa}
.login-card input:focus{outline:none;border-color:#000;background:#fff}
.login-err{color:#c0392b;font-size:13px;min-height:18px;margin-bottom:6px}
#login .btn-primary{background:#000;color:#fff;border-radius:2px;padding:13px 18px;
  font-weight:600;letter-spacing:.02em;transition:.15s}
#login .btn-primary:hover{background:#2a2a2a}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--gold);color:#fff}
.btn-primary:hover{background:var(--gold-dk)}
.btn-gold{background:var(--forest);color:#fff}
.btn-gold:hover{background:var(--forest-2)}
.btn-ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px}
.btn-danger{background:var(--warn-bg);color:var(--warn)}
.btn-danger:hover{background:#f6dccf}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:var(--forest);color:var(--cream);
  display:flex;align-items:center;gap:14px;padding:0 22px;height:60px}
.topbar .mark{width:36px;height:36px;border-radius:2px;background:#000;color:#fff;
  font-family:'Fraunces',serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.topbar .brand{font-family:'Fraunces',serif;font-weight:600;font-size:17px}
.topbar .brand small{display:block;font-family:'Inter';font-weight:400;font-size:11px;opacity:.6;letter-spacing:.02em}
.topbar .spacer{flex:1}
.topbar .who{font-size:13px;opacity:.85;display:flex;align-items:center;gap:8px}
.topbar .who .role{background:rgba(216,32,40,.16);color:var(--gold);padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.topbar .logout{color:var(--cream);opacity:.7;font-size:13px;padding:6px 10px;border-radius:7px}
.topbar .logout:hover{opacity:1;background:rgba(255,255,255,.08)}

.layout{display:flex;max-width:1240px;margin:0 auto}
.nav{width:212px;flex-shrink:0;padding:22px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;
  border-radius:9px;color:var(--ink-2);font-size:14px;font-weight:500;transition:.13s;margin-bottom:2px}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button.active{background:var(--forest);color:var(--cream);font-weight:600}
.nav button.active .ico{opacity:1}
.nav button .ico{width:18px;height:18px;flex-shrink:0;opacity:.6}
.nav button .badge{margin-left:auto;background:var(--gold);color:#fff;font-size:11px;font-weight:700;
  min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

.main{flex:1;min-width:0;padding:26px 26px 80px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:27px}
.page-head .desc{color:var(--ink-3);font-size:13.5px;margin-top:3px}
.page-head .ph-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ── CARDS / PANELS ── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.grid{display:grid;gap:16px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:5px;line-height:1}
.stat .val small{font-size:15px;color:var(--ink-3);font-family:'Inter';font-weight:500}
.stat.accent{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.stat.accent .lbl{color:rgba(247,243,234,.6)}
.stat.warn{border-color:#eccab5}
.stat.warn .val{color:var(--warn)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:14px}
thead th{text-align:left;padding:12px 15px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-3);font-weight:600;background:var(--cream);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8f9fb}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{font-weight:600}
.muted{color:var(--ink-3)}

/* ── BADGES ── */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-info{background:var(--info-bg);color:var(--info)}
.tag-gray{background:#eceef1;color:var(--ink-2)}
.tag-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── FORMS ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:var(--paper);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field textarea{resize:vertical;min-height:64px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border:1.5px solid var(--line);border-radius:20px;font-size:13px;font-weight:500;color:var(--ink-2);transition:.13s}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,30,.55);backdrop-filter:blur(3px);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
.modal{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:560px;margin:auto}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:20px}
.modal-head .x{margin-left:auto;font-size:22px;color:var(--ink-3);width:30px;height:30px;border-radius:7px;line-height:1}
.modal-head .x:hover{background:var(--cream);color:var(--ink)}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ── A LA CARTE ORDER UI ── */
.meal-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.meal-tab{padding:11px 20px;border-radius:30px;background:var(--paper);border:1.5px solid var(--line);
  font-weight:600;font-size:14px;color:var(--ink-2);transition:.15s;display:flex;align-items:center;gap:9px}
.meal-tab .ct{background:var(--cream);color:var(--ink-3);font-size:12px;padding:1px 8px;border-radius:12px;font-weight:700}
.meal-tab.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.meal-tab.on .ct{background:var(--gold);color:#fff}
.cat-block{margin-bottom:22px}
.cat-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:11px;
  padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cat-title::before{content:"";width:5px;height:16px;background:var(--gold);border-radius:3px}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.dish{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;transition:.15s}
.dish.has{border-color:var(--gold);background:#fff5f5}

/* ── ISPORUKA soba kartice ── */
.soba-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.soba-card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;cursor:pointer;transition:.15s;min-height:64px}

/* ── HUB (izbor firme) ── */
.hub{max-width:760px;margin:0 auto;padding:26px 0 40px}
.hub-head{text-align:center;margin-bottom:28px}
.hub-head h1{font-size:31px;margin-bottom:6px}
.hub-head p{color:var(--ink-3);font-size:14px}
.hub-zbir{display:flex;align-items:center;gap:14px;background:var(--forest);color:var(--cream);
  border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.hub-zbir:hover{background:var(--forest-2);transform:translateY(-1px)}
.hub-zbir .hz-ico{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hub-zbir .hz-txt h3{font-size:16px;font-family:'Inter';font-weight:700}
.hub-zbir .hz-txt p{font-size:12.5px;opacity:.65;margin-top:2px}
.hub-zbir .hz-arrow{margin-left:auto;font-size:20px;opacity:.5}
.hub-grid{display:grid;gap:12px}
.firma-card{display:flex;align-items:center;gap:14px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:16px 20px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.firma-card:hover{border-color:var(--fc,var(--gold));transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.firma-card .fc-mark{width:46px;height:46px;border-radius:11px;background:var(--fc,var(--gold));color:#fff;
  font-family:'Fraunces',serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.firma-card .fc-mark.plus{background:var(--cream);color:var(--ink-3);font-family:'Inter';font-weight:400;font-size:26px}
.firma-card .fc-body h3{font-size:17px;font-family:'Inter';font-weight:700}
.firma-card .fc-body p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.firma-card .fc-arrow{margin-left:auto;font-size:19px;color:var(--ink-3)}
.firma-card.nova{border-style:dashed;box-shadow:none}
.firma-card.nova:hover{border-color:var(--ink-3)}
.hub-alati{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.hub-alat{display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.hub-alat:hover{border-color:var(--gold);transform:translateY(-1px)}
.hub-alat .ha-ico{width:38px;height:38px;border-radius:9px;background:var(--cream);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hub-alat .ha-txt h4{font-size:14.5px;font-family:'Inter';font-weight:700}
.hub-alat .ha-txt p{font-size:12px;color:var(--ink-3);margin-top:1px}
@media(max-width:640px){.hub-alati{grid-template-columns:1fr}}

/* ── JELOVNIK: dani ── */
.dani-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
.dan-kol{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.dan-h{background:var(--forest);color:var(--cream);padding:10px 12px;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:space-between}
.dan-h .dan-ct{background:var(--gold);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.dan-body{padding:6px}
.dan-jelo{display:flex;align-items:flex-start;gap:6px;padding:8px 9px;border-radius:7px;transition:.13s}
.dan-jelo:hover{background:var(--cream)}
.dan-jelo .dj-txt{flex:1;min-width:0}
.dan-jelo .dj-txt b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.dan-jelo .dj-txt span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.dan-jelo .dj-x{color:var(--ink-3);font-size:13px;padding:2px 4px;border-radius:4px;flex-shrink:0;opacity:0;transition:.13s}
.dan-jelo:hover .dj-x{opacity:1}
.dan-jelo .dj-x:hover{background:var(--warn-bg);color:var(--warn)}
.dan-prazno{padding:18px 10px;text-align:center;color:var(--ink-3);font-size:12px;font-style:italic}
.dan-add{width:100%;padding:9px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;
  color:var(--ink-2);transition:.13s;background:var(--cream)}
.dan-add:hover{background:var(--forest);color:var(--cream)}
@media(max-width:1000px){.dani-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.dani-grid{grid-template-columns:1fr}}

/* ── izbor jela (modal) ── */
.jel-izbor{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.ji-kat{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:700;
  padding:8px 13px 5px;background:var(--cream);position:sticky;top:0}
.ji-item{display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;transition:.13s}
.ji-item:last-child{border-bottom:none}
.ji-item:hover{background:var(--cream)}
.ji-item span b{font-size:13.5px;font-weight:600;display:block}
.ji-item span small{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}

/* ── jelovnik: status traka + istorija ── */
.jel-status{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--radius);
  margin-bottom:18px;border:1.5px solid var(--line);background:var(--paper);flex-wrap:wrap}
.jel-status.nacrt{border-color:#c6d4e0;background:#f2f7fb}
.jel-status.poslat{border-color:#bcdccb;background:#f0f8f3}
.jel-status .js-badge{font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:5px 11px;border-radius:4px;flex-shrink:0}
.jel-status.nacrt .js-badge{background:var(--info);color:#fff}
.jel-status.poslat .js-badge{background:var(--ok);color:#fff}
.jel-status .js-txt b{display:block;font-size:13.5px;font-weight:700}
.jel-status .js-txt span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.jel-status .js-akcije{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.jelovnik-red{padding:16px 18px;cursor:pointer;transition:.15s;border-left:4px solid var(--line)}
.jelovnik-red:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.jelovnik-red.nacrt{border-left-color:var(--info)}
.jelovnik-red.poslat{border-left-color:var(--ok)}

/* ── lista tipova (modal) ── */
.tip-lista{border:1px solid var(--line);border-radius:var(--radius-sm);max-height:280px;overflow-y:auto}
.tip-red{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)}
.tip-red:last-child{border-bottom:none}
.tip-red .tip-naziv{flex:1;font-weight:600;font-size:13.5px;display:flex;align-items:center}
.tip-red button{flex-shrink:0}
.tip-red button:disabled{opacity:.35;cursor:not-allowed}

/* ── KETERING info panel ── */
.ket-info{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ki-red{background:var(--paper);padding:12px 15px;display:flex;flex-direction:column;gap:3px}
.ki-red span{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:700}
.ki-red b{font-size:14px;font-weight:600;line-height:1.35}
.ki-red.total{grid-column:1/-1;background:var(--forest);color:var(--cream)}
.ki-red.total span{color:rgba(247,243,234,.6)}
.ki-red.total b{font-family:'Fraunces',serif;font-size:22px;color:var(--gold)}
@media(max-width:820px){.ket-info{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.ket-info{grid-template-columns:1fr}}

/* ── JELOVNIK BUILDER (paleta + drag&drop) ── */
.jel-builder{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.jel-paleta{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);position:sticky;top:80px;overflow:hidden}
.jp-head{padding:14px 15px;border-bottom:1px solid var(--line);background:var(--cream)}
.jp-head h3{font-size:14.5px;font-family:'Inter';font-weight:700}
.jp-head p{font-size:11.5px;color:var(--ink-3);margin:3px 0 9px}

/* ── topbar: naziv firme + povratak ── */

  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}

  box-shadow:var(--shadow-lg);animation:tin .3s;max-width:90vw}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--warn)}

.loading{display:flex;align-items:center;justify-content:center;padding:50px;color:var(--ink-3);gap:10px}

.inline-form{display:grid;gap:12px}

  border-radius:var(--radius-sm);padding:4px 4px 4px 14px;font-weight:600}

@media(max-width:880px){
  .layout{flex-direction:column}

    border-bottom:1px solid var(--line);background:var(--paper)}
  .nav-group{display:none}
  .nav button{flex-direction:column;gap:5px;font-size:11px;padding:9px 12px;min-width:74px;text-align:center;white-space:nowrap}
  .nav button .badge{position:absolute;margin:0;top:5px;right:8px}
  .nav button{position:relative}
  .main{padding:18px 14px 70px}

}

@media(max-width:1080px){.order-layout{grid-template-columns:1fr 300px}}
</style>

<body>

<!-- ════ LOGIN ════ -->
<div id="login">
  <div class="login-card">
    <div class="login-mark">V</div>
    <h1>Vilara Partner Portal</h1>
    <div class="sub">Prijavite se na svoj nalog</div>
    <input id="li-user" placeholder="Korisničko ime" autocomplete="username">
    <input id="li-pin" type="password" placeholder="Lozinka" autocomplete="current-password">
    <div class="login-err" id="li-err"></div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Prijava</button>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="app">
  <div class="topbar">
    <div class="mark">V</div>
    <div class="brand">Vilara Partner Portal<small id="tb-sub">Portal</small></div>
    <div class="tb-firma" id="tb-firma"></div>
    <div class="spacer"></div>
    <div class="who"><span id="tb-name"></span><span class="role" id="tb-role"></span></div>
    <button class="logout" onclick="logout()">Odjava</button>
  </div>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ════════════════════════════════════════════════
//  KONFIGURACIJA
// ════════════════════════════════════════════════
const SB_URL = 'https://xlavckejuwldtpdnqabj.supabase.co';
const SB_KEY = 'sb_publishable_UkyzsM2DEJE7fNydLmR2QA_mBBzs3t3';
const sb = supabase.createClient(SB_URL, SB_KEY);

const OBROCI = [
  {id:'dorucak', naziv:'Doručak', ico:'☕'},
  {id:'rucak',   naziv:'Ručak',   ico:'🍲'},
  {id:'vecera',  naziv:'Večera',  ico:'🌙'},
];
const KATEGORIJE = ['dorucak','glavno','dijeta','supa','dezert'];
const KAT_NAZIV = {dorucak:'Doručak',glavno:'Glavna jela',dijeta:'Lagana dijeta',supa:'Supe i čorbe',dezert:'Dezerti'};

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let S = {
  user:null,           // {korisnicko_ime, uloga, ime, firma_id}
  page:null,
  firme:[],            // sve aktivne firme
  firma:null,          // trenutno izabrana firma
  jela:[],
  cart:{},             // {obrok: {jelo_id: qty}}
  orderObrok:'dorucak',
  orderDatum:sutra(),
};

function sutra(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function danas(){return new Date().toISOString().slice(0,10);}
function fmt(n){return Number(n||0).toLocaleString('sr-RS',{minimumFractionDigits:0,maximumFractionDigits:2});}
function fmtDin(n){return fmt(n)+' RSD';}
function datSr(s){if(!s)return'';const[y,m,d]=s.split('-');return `${d}.${m}.${y}.`;}
function danUNedelji(s){const dani=['Nedelja','Ponedeljak','Utorak','Sreda','Četvrtak','Petak','Subota'];return dani[new Date(s+'T00:00').getDay()];}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
function toast(msg,type=''){
  const t=document.createElement('div');
  t.className='toast '+type; t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2600);
}

// ════════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════════
const EMAIL_DOMEN = '@vilara.local';
async function doLogin(){
  const u=document.getElementById('li-user').value.trim().toLowerCase();
  const p=document.getElementById('li-pin').value;
  const err=document.getElementById('li-err');
  err.textContent='';
  if(!u||!p){err.textContent='Unesite korisničko ime i lozinku.';return;}
  const email = u.includes('@') ? u : u+EMAIL_DOMEN;
  const {data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error||!data.user){err.textContent='Pogrešno korisničko ime ili lozinka.';return;}
  // učitaj ulogu iz av_korisnici
  const {data:row}=await sb.from('av_korisnici').select('*').eq('auth_id',data.user.id).maybeSingle();
  if(!row||!row.aktivan){err.textContent='Nalog nije aktivan. Kontaktirajte administratora.';await sb.auth.signOut();return;}
  S.user={korisnicko_ime:row.korisnicko_ime,uloga:row.uloga,ime:row.ime,id:row.id,auth_id:row.auth_id,firma_id:row.firma_id};
  await startApp();
}
async function logout(){await sb.auth.signOut();location.reload();}

async function startApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').style.display='block';
  document.getElementById('tb-name').textContent=S.user.ime||S.user.korisnicko_ime;
  document.getElementById('tb-role').textContent={admin:'Administrator',kuvar:'Kuhinja',direktor:'Direktor',klijent:'Klijent'}[S.user.uloga]||S.user.uloga;
  // personalizovan pozdrav
  if(!S._pozdravljen){
    S._pozdravljen=true;
    let poz;
    if(S.user.korisnicko_ime==='kaca') poz='Zdravo Kaća <3';
    else if(S.user.korisnicko_ime==='direktor') poz='Zdravo mama Adrijana <3';
    else poz='Zdravo '+(S.user.ime||S.user.korisnicko_ime)+'!';
    setTimeout(()=>toast(poz,'ok'),400);
  }
  await loadFirme();
  // klijent ide direktno u svoju firmu; ostali biraju
  if(S.user.uloga==='klijent' && S.user.firma_id){
    const f=S.firme.find(x=>x.id===S.user.firma_id);
    if(f){usjiUFirmu(f.id);return;}
  }
  prikaziHub();
}
async function loadFirme(){
  const {data}=await sb.from('av_firme').select('*').eq('aktivna',true).order('naziv');
  S.firme=data||[];
}
// ── HUB: izbor firme (Vilara Partner Portal) ──
function prikaziHub(){
  S.firma=null;
  document.getElementById('tb-sub').textContent='Partner Portal';
  document.getElementById('nav').innerHTML='';
  document.getElementById('nav').style.display='none';
  document.getElementById('tb-firma').innerHTML='';
  const jeAdmin=S.user.uloga==='admin';
  const vidiStatistiku=['admin','direktor'].includes(S.user.uloga);
  setMain(`
    <div class="hub">
      <div class="hub-head">
        <h1>Vilara Partner Portal</h1>
        <p>Izaberi firmu za rad${vidiStatistiku?' ili pogledaj zbirnu statistiku':''}</p>
      </div>
      ${vidiStatistiku?`<div class="hub-zbir" onclick="go('zbirno')">
        <div class="hz-ico">${ICONS.chart.replace('class="ico"','style="width:22px;height:22px"')}</div>
        <div class="hz-txt"><h3>Zbirna statistika</h3><p>Ukupni podaci za sve firme</p></div>
        <div class="hz-arrow">→</div>
      </div>`:''}
      ${jeAdmin?`<div class="hub-alati">
        <div class="hub-alat" onclick="go('katalog')">
          <div class="ha-ico">${ICONS.dish.replace('class="ico"','style="width:20px;height:20px"')}</div>
          <div class="ha-txt"><h4>Katalog jela</h4><p>Centralna baza jela</p></div>
        </div>
        <div class="hub-alat" onclick="go('jelovnici')">
          <div class="ha-ico">${ICONS.order.replace('class="ico"','style="width:20px;height:20px"')}</div>
          <div class="ha-txt"><h4>Jelovnici</h4><p>Kreiraj i pošalji firmama</p></div>
        </div>
        <div class="hub-alat" onclick="go('ketering')" style="grid-column:1/-1">
          <div class="ha-ico">${ICONS.truck.replace('class="ico"','style="width:20px;height:20px"')}</div>
          <div class="ha-txt"><h4>Ketering</h4><p>Otpremnice, artikli i klijenti keteringa</p></div>
        </div>
      </div>`:''}
      <div class="hub-grid">
        ${S.firme.map(f=>`<div class="firma-card" onclick="usjiUFirmu('${f.id}')" style="--fc:${f.boja||'#d82028'}">
          <div class="fc-mark">${esc(f.naziv.charAt(0))}</div>
          <div class="fc-body">
            <h3>${esc(f.naziv)}</h3>
          </div>
          <div class="fc-arrow">→</div>
        </div>`).join('')}
        ${jeAdmin?`<div class="firma-card nova" onclick="firmaModal()">
          <div class="fc-mark plus">+</div>
          <div class="fc-body"><h3>Nova firma</h3><p>Dodaj klijenta u portal</p></div>
        </div>`:''}
      </div>
    </div>`);
}
function usjiUFirmu(fid){
  const f=S.firme.find(x=>x.id===fid);
  if(!f){toast('Firma nije pronađena.','err');return;}
  S.firma=f;
  document.getElementById('nav').style.display='';
  document.getElementById('tb-sub').textContent={admin:'Administracija',kuvar:'Kuhinja',direktor:'Izveštaji',klijent:'Naručivanje'}[S.user.uloga]||'';
  // dugme za povratak na hub (osim klijenta koji ima samo svoju firmu)
  const back = S.user.uloga==='klijent' ? '' :
    `<button class="tb-back" onclick="prikaziHub()">← Sve firme</button>`;
  document.getElementById('tb-firma').innerHTML=`${back}<span class="tb-firma-naziv" style="--fc:${f.boja||'#d82028'}">${esc(f.naziv)}</span>`;
  buildNav();
  const first=NAV[S.user.uloga][0].items[0].id;
  go(first);
}

// ════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════
const ICONS={
  order:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M3 6h18M3 12h18M3 18h12"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg>',
  dish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M3 11h18M12 3v8M7 21V11M17 21V11"/></svg>',
  norm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M3 3v18h18M8 17V9M13 17V5M18 17v-6"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ico"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7M5.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM18.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>',
};

      {id:'porudzbine',n:'Porudžbine',i:'order'},

  ],
  kuvar:[
    {grp:'Kuhinja',items:[
      {id:'porudzbine',n:'Porudžbine',i:'order'},
    ]},
    {grp:'Šifarnici',items:[

  ],

      {id:'moje',n:'Moje porudžbine',i:'hist'},

};
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=NAV[S.user.uloga].map(g=>
    (g.grp?`<div class="nav-group">${g.grp}</div>`:'')+
    g.items.map(it=>`<button id="nav-${it.id}" onclick="go('${it.id}')">${ICONS[it.i]}<span>${it.n}</span><span class="badge hidden" id="badge-${it.id}"></span></button>`).join('')
  ).join('');
}
function setBadge(id,n){
  const b=document.getElementById('badge-'+id);if(!b)return;
  if(n>0){b.textContent=n;b.classList.remove('hidden');}else b.classList.add('hidden');
}
function go(page){
  S.page=page;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+page)?.classList.add('active');
  RENDER[page]?.();
}
const RENDER={};
function setMain(html){document.getElementById('main').innerHTML=html;}
function loading(){setMain('<div class="loading"><div class="spin"></div> Učitavanje…</div>');}

// ════════════════════════════════════════════════
//  DATA LOADERS
// ════════════════════════════════════════════════
async function loadJela(){
  const {data}=await sb.from('av_jela').select('*').eq('firma_id',S.firma.id).order('kategorija').order('naziv');
  S.jela=data||[];return S.jela;
}

// init
(async function(){
  document.getElementById('li-pin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('li-user').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('li-pin').focus();});
  const {data}=await sb.auth.getSession();
  if(data.session?.user){
    const {data:row}=await sb.from('av_korisnici').select('*').eq('auth_id',data.session.user.id).maybeSingle();
    if(row&&row.aktivan){
      S.user={korisnicko_ime:row.korisnicko_ime,uloga:row.uloga,ime:row.ime,id:row.id,auth_id:row.auth_id,firma_id:row.firma_id};
      await startApp();
    }
  }
})();

<script id="views">
// ════════════════════════════════════════════════
//  KLIJENT — NARUČIVANJE (a la carte)
// ════════════════════════════════════════════════
RENDER.naruci = async function(){
  loading();
  await loadJela();
  if(!S.cart[S.orderObrok]) S.cart[S.orderObrok]={};
  renderNaruci();
};
function renderNaruci(){
  const aktivna = S.jela.filter(j=>j.aktivno);
  const tabs = OBROCI.map(o=>{
    const ct = Object.values(S.cart[o.id]||{}).reduce((a,b)=>a+b,0);
    return `<button class="meal-tab ${o.id===S.orderObrok?'on':''}" onclick="switchObrok('${o.id}')">
      ${o.ico} ${o.naziv} ${ct>0?`<span class="ct">${ct}</span>`:''}</button>`;
  }).join('');

  const jelaObrok = aktivna.filter(j=>(j.obrok||[]).includes(S.orderObrok));
  let body='';
  if(!jelaObrok.length){
    body=`<div class="empty"><div class="big">🍽️</div><h3>Nema jela za ovaj obrok</h3><p>Vilara još nije dodala jela u ovu kategoriju.</p></div>`;
  } else {
    KATEGORIJE.forEach(kat=>{
      const list=jelaObrok.filter(j=>j.kategorija===kat);
      if(!list.length)return;
      body+=`<div class="cat-block"><div class="cat-title">${KAT_NAZIV[kat]}</div><div class="dish-grid">`;
      list.forEach(j=>{
        const q=S.cart[S.orderObrok][j.id]||0;
        body+=`<div class="dish ${q>0?'has':''}" id="dish-${j.id}">
          <div class="dn">${esc(j.naziv)}</div>
          <div class="dd">${esc(j.opis||'')}</div>
          <div class="drow">
            <span class="price">${fmtDin(j.cena_porcije)}</span>
            <div class="qty">
              <button onclick="qChange('${j.id}',-1)">−</button>
              <input type="text" value="${q}" id="q-${j.id}" onchange="qSet('${j.id}',this.value)">
              <button onclick="qChange('${j.id}',1)">+</button>
            </div>
          </div></div>`;
      });
      body+=`</div></div>`;
    });
  }

  setMain(`
    <div class="page-head">
      <div><h2>Naruči obroke</h2><div class="desc">Izbor jela za isporuku — a la carte</div></div>
      <div class="ph-actions">
        <div class="date-pick">📅 <span class="muted" style="font-size:13px">${danUNedelji(S.orderDatum)}</span>
          <input type="date" value="${S.orderDatum}" min="${danas()}" onchange="setDatum(this.value)"></div>
      </div>
    </div>
    <div class="meal-tabs">${tabs}</div>
    <div class="order-layout">
      <div>${body}</div>
      <div>${renderCart()}</div>
    </div>`);
}
function renderCart(){
  let items='', total=0, count=0;
  OBROCI.forEach(o=>{
    const c=S.cart[o.id]||{};
    Object.entries(c).forEach(([jid,q])=>{
      if(q<=0)return;
      const j=S.jela.find(x=>x.id===jid);if(!j)return;
      const sum=j.cena_porcije*q; total+=sum; count+=q;
      items+=`<div class="cart-item"><span class="ci-q">${q}×</span>
        <span class="ci-n">${esc(j.naziv)}<small>${OBROCI.find(x=>x.id===o.id).naziv} · ${fmtDin(j.cena_porcije)}</small></span>
        <span class="ci-p">${fmt(sum)}</span></div>`;
    });
  });
  return `<div class="card cart">
    <div class="cart-head">${ICONS.cart.replace('class="ico"','style="width:18px;height:18px"')}<h3>Porudžbina</h3></div>
    <div class="cart-items">${items||'<div class="cart-empty">Korpa je prazna.<br>Dodajte jela klikom na +</div>'}</div>
    <div class="cart-foot">
      <div class="cart-total"><span>Ukupno</span><span>${fmt(total)} RSD</span></div>
      <button class="btn btn-primary btn-block" ${count?'':'disabled'} onclick="posalji()">Pošalji porudžbinu (${count})</button>
    </div></div>`;
}
function switchObrok(o){S.orderObrok=o;if(!S.cart[o])S.cart[o]={};renderNaruci();}
function setDatum(d){S.orderDatum=d;renderNaruci();}
function qChange(jid,delta){
  const c=S.cart[S.orderObrok];
  c[jid]=Math.max(0,(c[jid]||0)+delta);
  if(c[jid]===0)delete c[jid];
  renderNaruci();
}
function qSet(jid,val){
  const n=Math.max(0,parseInt(val)||0);
  const c=S.cart[S.orderObrok];
  if(n===0)delete c[jid];else c[jid]=n;
  renderNaruci();
}
async function posalji(){
  // skupi sve obroke koji imaju stavke -> zasebne porudzbine
  const obrociSaStavkama = OBROCI.filter(o=>Object.values(S.cart[o.id]||{}).some(q=>q>0));
  if(!obrociSaStavkama.length){toast('Korpa je prazna.','err');return;}
  let kreirano=0;
  for(const o of obrociSaStavkama){
    const c=S.cart[o.id];
    const {data:ord,error}=await sb.from('av_porudzbine').insert({
      datum_za:S.orderDatum, obrok:o.id, status:'nova', kreirao:S.user.ime||S.user.korisnicko_ime
    }).select().single();
    if(error){toast('Greška pri slanju.','err');return;}
    const stavke=Object.entries(c).filter(([_,q])=>q>0).map(([jid,q])=>{
      const j=S.jela.find(x=>x.id===jid);
      return {porudzbina_id:ord.id, jelo_id:jid, jelo_naziv:j.naziv, kolicina:q, cena_porcije:j.cena_porcije};
    });
    await sb.from('av_stavke').insert(stavke);
    kreirano++;
  }
  S.cart={};
  toast(`Poslato! (${kreirano} ${kreirano===1?'obrok':'obroka'})`,'ok');
  go('moje');
}

// ════════════════════════════════════════════════
//  KLIJENT — MOJE PORUDZBINE
// ════════════════════════════════════════════════
RENDER.moje = async function(){
  loading();
  const {data:ords}=await sb.from('av_porudzbine').select('*').order('datum_za',{ascending:false}).order('created_at',{ascending:false});
  const ids=(ords||[]).map(o=>o.id);
  let stavke=[];
  if(ids.length){const {data}=await sb.from('av_stavke').select('*').in('porudzbina_id',ids);stavke=data||[];}
  renderPorudzbineList(ords||[],stavke,false);
};
function statusTag(st){
  if(st==='nova')return '<span class="tag tag-info tag-dot">Nova</span>';
  if(st==='potvrdjena')return '<span class="tag tag-ok tag-dot">Potvrđena</span>';
  if(st==='isporucena')return '<span class="tag tag-gray tag-dot">Isporučena</span>';
  return st;
}
function renderPorudzbineList(ords,stavke,admin){
  const uloga=S.user.uloga;
  const jeKuvar=uloga==='kuvar';
  const jeAdmin=uloga==='admin';
  const naslov=admin?(jeKuvar?'Porudžbine za kuhinju':'Porudžbine'):'Moje porudžbine';
  const showCene=jeAdmin||uloga==='klijent'; // kuvar ne vidi cene
  if(!ords.length){
    setMain(`<div class="page-head"><div><h2>${naslov}</h2></div></div>
      <div class="empty"><div class="big">📋</div><h3>Nema porudžbina</h3><p>${admin?'Klijent još nije poslao nijednu porudžbinu.':'Još niste poslali nijednu porudžbinu.'}</p></div>`);
    return;
  }
  // grupisi po datumu
  const byDate={};
  ords.forEach(o=>{(byDate[o.datum_za]=byDate[o.datum_za]||[]).push(o);});
  let html='';
  Object.keys(byDate).sort().reverse().forEach(dat=>{
    html+=`<div style="margin:20px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="font-size:17px">${danUNedelji(dat)}, ${datSr(dat)}</h3>
      <span class="muted" style="font-size:13px">${dat===sutra()?'(sutra)':dat===danas()?'(danas)':''}</span>
      ${(jeAdmin||jeKuvar)?`<div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-sm btn-ghost" onclick="nalogKuvar('${dat}')">🍳 Nalog za kuvara</button>
        ${jeAdmin?`<button class="btn btn-sm btn-ghost" onclick="nalogVozac('${dat}')">🚐 Nalog za vozača</button>`:''}
      </div>`:''}</div>`;
    OBROCI.forEach(ob=>{
      const o=byDate[dat].find(x=>x.obrok===ob.id);
      if(!o)return;
      const st=stavke.filter(s=>s.porudzbina_id===o.id);
      const total=st.reduce((a,s)=>a+s.cena_porcije*s.kolicina,0);
      const broj=st.reduce((a,s)=>a+s.kolicina,0);
      html+=`<div class="ord-card">
        <div class="ord-head">
          <div class="om"><b>${ob.ico}</b><span>${ob.naziv}</span></div>
          <div class="oi"><h4>${ob.naziv} — ${broj} ${broj===1?'porcija':'porcija'}</h4>
            <div class="osub">${st.length} ${st.length===1?'jelo':'jela'}${showCene?' · '+fmtDin(total):''}</div></div>
          <div class="oactions">${statusTag(o.status)}
            ${jeAdmin?adminOrdActions(o):''}
            ${jeKuvar?`<button class="btn btn-sm btn-ghost" onclick="stampaj('${o.id}')">🖨</button>`:''}
            ${uloga==='klijent'&&o.status==='nova'?`<button class="btn btn-sm btn-danger" onclick="obrisiPorudzbinu('${o.id}')">Otkaži</button>`:''}
          </div>
        </div>
        <div class="ord-body">
          ${st.map(s=>`<div class="ord-line"><span class="olq">${s.kolicina}×</span>
            <span class="oln">${esc(s.jelo_naziv)}</span>
            ${showCene?`<span class="muted" style="font-size:13px">${fmtDin(s.cena_porcije*s.kolicina)}</span>`:''}</div>`).join('')}
        </div></div>`;
    });
  });
  setMain(`<div class="page-head"><div><h2>${naslov}</h2>
    <div class="desc">${admin?'Pristigle porudžbine od bolnice Avala':'Pregled poslatih porudžbina'}</div></div></div>${html}`);
}
async function obrisiPorudzbinu(id){
  if(!confirm('Otkazati ovu porudžbinu?'))return;
  await sb.from('av_porudzbine').delete().eq('id',id);
  toast('Porudžbina otkazana.','ok');
  go(S.user.uloga==='klijent'?'moje':'porudzbine');
}

// ════════════════════════════════════════════════
//  ADMIN — PREGLED (dashboard)
// ════════════════════════════════════════════════
RENDER.pregled = async function(){
  loading();
  const [{data:ords},{data:ispDanas},{data:ispStavke}] = await Promise.all([
    sb.from('av_porudzbine').select('*'),
    sb.from('av_isporuka').select('*').eq('firma_id',S.firma.id).eq('datum',danas()),
    sb.from('av_isporuka_stavke').select('*')
  ]);
  const sutraOrd=(ords||[]).filter(o=>o.datum_za===sutra());
  const nove=(ords||[]).filter(o=>o.status==='nova');
  setBadge('porudzbine',nove.length);

  // prihod danas iz isporuke
  const danasIds=new Set((ispDanas||[]).map(i=>i.id));
  const stDanas=(ispStavke||[]).filter(s=>danasIds.has(s.isporuka_id));
  const prihodDanas=stDanas.reduce((a,s)=>a+s.cena_porcije*s.kolicina,0);
  const porcijaDanas=stDanas.reduce((a,s)=>a+s.kolicina,0);

  // stavke za sutra
  const sutraIds=sutraOrd.map(o=>o.id);
  let sutraStavke=[];
  if(sutraIds.length){const {data}=await sb.from('av_stavke').select('*').in('porudzbina_id',sutraIds);sutraStavke=data||[];}
  const sutraPorcija=sutraStavke.reduce((a,s)=>a+s.kolicina,0);

  setMain(`
    <div class="page-head"><div><h2>Pregled</h2><div class="desc">${danUNedelji(danas())}, ${datSr(danas())}</div></div></div>
    <div class="grid stat-grid" style="margin-bottom:20px">
      <div class="stat accent"><div class="lbl">Prihod danas (isporuka)</div><div class="val" style="font-size:24px">${fmt(prihodDanas)} <small>RSD</small></div><div style="font-size:11.5px;opacity:.6;margin-top:3px">${porcijaDanas} porcija</div></div>
      <div class="stat"><div class="lbl">Za sutra (porudžbine)</div><div class="val">${sutraOrd.length}</div></div>
      <div class="stat"><div class="lbl">Porcija za sutra</div><div class="val">${sutraPorcija}</div></div>
      <div class="stat ${nove.length?'warn':''}"><div class="lbl">Nove (nepotvrđene)</div><div class="val">${nove.length}</div></div>
    </div>
    <div class="card card-pad">
      <h3 style="font-size:16px;margin-bottom:6px">Sumarno za sutra (${datSr(sutra())})</h3>
      ${sutraPorcija?renderSutraSumarno(sutraStavke):'<p class="muted" style="padding:14px 0">Još nema porudžbina za sutra.</p>'}
    </div>`);
};
function renderSutraSumarno(stavke){
  const agg={};
  stavke.forEach(s=>{agg[s.jelo_naziv]=(agg[s.jelo_naziv]||0)+s.kolicina;});
  const rows=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  return `<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Jelo</th><th class="num">Ukupno porcija</th></tr></thead>
    <tbody>${rows.map(([n,q])=>`<tr><td class="t-strong">${esc(n)}</td><td class="num">${q}</td></tr>`).join('')}</tbody></table></div>`;
}

// ════════════════════════════════════════════════
//  ADMIN — PORUDZBINE
// ════════════════════════════════════════════════
RENDER.porudzbine = async function(){
  loading();
  await loadJela();
  const {data:ords}=await sb.from('av_porudzbine').select('*').order('datum_za',{ascending:false}).order('created_at',{ascending:false});
  const ids=(ords||[]).map(o=>o.id);
  let stavke=[];
  if(ids.length){const {data}=await sb.from('av_stavke').select('*').in('porudzbina_id',ids);stavke=data||[];}
  const nove=(ords||[]).filter(o=>o.status==='nova').length;
  setBadge('porudzbine',nove);
  renderPorudzbineList(ords||[],stavke,true);
};
function adminOrdActions(o){
  let btns='';
  if(o.status==='nova'){
    btns+=`<button class="btn btn-sm btn-gold" onclick="potvrdi('${o.id}')">Potvrdi</button>`;
  }else if(o.status==='potvrdjena'){
    btns+=`<button class="btn btn-sm btn-primary" onclick="isporuci('${o.id}')">Označi isporučeno</button>`;
  }
  btns+=`<button class="btn btn-sm btn-ghost" onclick="stampaj('${o.id}')">🖨</button>`;
  btns+=`<button class="btn btn-sm btn-danger" onclick="obrisiPorudzbinu('${o.id}')">✕</button>`;
  return btns;
}
async function potvrdi(id){
  if(!confirm('Potvrditi porudžbinu?'))return;
  await sb.from('av_porudzbine').update({status:'potvrdjena'}).eq('id',id);
  toast('Potvrđeno.','ok');
  go('porudzbine');
}
async function isporuci(id){
  await sb.from('av_porudzbine').update({status:'isporucena'}).eq('id',id);
  toast('Označeno kao isporučeno.','ok');
  go('porudzbine');
}
async function stampaj(id){
  const {data:o}=await sb.from('av_porudzbine').select('*').eq('id',id).single();
  const {data:st}=await sb.from('av_stavke').select('*').eq('porudzbina_id',id);
  const ob=OBROCI.find(x=>x.id===o.obrok);
  const total=st.reduce((a,s)=>a+s.cena_porcije*s.kolicina,0);
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>Porudžbina ${ob.naziv} ${datSr(o.datum_za)}</title>
    <style>body{font-family:Georgia,serif;padding:40px;color:#242a33;max-width:600px;margin:auto}
    h1{font-size:22px;border-bottom:2px solid #242a33;padding-bottom:10px}
    .meta{color:#555;margin:8px 0 20px;font-size:14px}
    table{width:100%;border-collapse:collapse;font-family:Arial}
    th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #ddd}
    th{font-size:12px;text-transform:uppercase;color:#888}
    .num{text-align:right}.tot{font-weight:bold;font-size:16px}
    @media print{.np{display:none}}</style></head><body>
    <h1>Vilara Ketering — Porudžbenica</h1>
    <div class="meta"><b>${ob.naziv}</b> za ${danUNedelji(o.datum_za)}, ${datSr(o.datum_za)}<br>
    Naručio: ${esc(o.kreirao||'—')} · Status: ${o.status}</div>
    <table><thead><tr><th>Jelo</th><th class="num">Porcija</th><th class="num">Cena</th><th class="num">Iznos</th></tr></thead>
    <tbody>${st.map(s=>`<tr><td>${esc(s.jelo_naziv)}</td><td class="num">${s.kolicina}</td>
      <td class="num">${fmt(s.cena_porcije)}</td><td class="num">${fmt(s.cena_porcije*s.kolicina)}</td></tr>`).join('')}
    <tr class="tot"><td colspan="3">UKUPNO</td><td class="num">${fmt(total)} RSD</td></tr></tbody></table>
    <button class="np" onclick="print()" style="margin-top:24px;padding:10px 20px;font-size:14px">Štampaj</button>
    </body></html>`);
  w.document.close();
}

// ── Skupi sve porudzbine za dati datum, grupisano po obroku ──
async function dnevneStavke(dat){
  const {data:ords}=await sb.from('av_porudzbine').select('*').eq('datum_za',dat);
  if(!ords||!ords.length)return null;
  const ids=ords.map(o=>o.id);
  const {data:stavke}=await sb.from('av_stavke').select('*').in('porudzbina_id',ids);
  const perObrok={};
  OBROCI.forEach(ob=>{
    const oIds=ords.filter(o=>o.obrok===ob.id).map(o=>o.id);
    const st=(stavke||[]).filter(s=>oIds.includes(s.porudzbina_id));
    // agregiraj po jelu
    const agg={};
    st.forEach(s=>{
      if(!agg[s.jelo_id])agg[s.jelo_id]={naziv:s.jelo_naziv,kolicina:0};
      agg[s.jelo_id].kolicina+=s.kolicina;
    });
    perObrok[ob.id]=Object.values(agg).sort((a,b)=>b.kolicina-a.kolicina);
  });
  return {ords,perObrok};
}

async function nalogKuvar(dat){
  const d=await dnevneStavke(dat);
  if(!d){toast('Nema porudžbina za taj dan.','err');return;}
  let secs='';
  OBROCI.forEach(ob=>{
    const items=d.perObrok[ob.id];
    const ukupno=items.reduce((a,i)=>a+i.kolicina,0);
    secs+=`<div class="sec"><div class="sec-h">${ob.naziv.toUpperCase()}<span class="cnt">${ukupno} porcija</span></div>`;
    if(items.length){
      secs+=`<div class="tbl-wrap"><table><thead><tr><th class="q">Porcija</th><th>Jelo</th></tr></thead><tbody>`;
      items.forEach(i=>{
        secs+=`<tr><td class="q">${i.kolicina}</td><td class="jn">${esc(i.naziv)}</td></tr>`;
      });
      secs+=`</tbody></table></div>`;
    } else secs+=`<div class="empty-sec">Nema porudžbina za ovaj obrok.</div>`;
    secs+=`</div>`;
  });
  otvoriNalog('Nalog za kuvara — '+dat,`
    ${nalogHead('Nalog za kuhinju',dat)}
    <div class="meta">Generisano: ${new Date().toLocaleString('sr-RS')} · Pripremiti za isporuku ${datSr(dat)}</div>
    ${secs}
    <div class="sign"><div>Preuzeo (kuvar)</div><div>Predao</div></div>
    <div class="foot"><span>Vilara Ketering d.o.o.</span><span>Bolnica Avala</span></div>`);
}

async function nalogVozac(dat){

  let secs='';

async function sacuvajJelo(id){
  const obroci=[...document.querySelectorAll('#j-obroci .chip.on')].map(c=>c.dataset.o);
  if(!obroci.length){toast('Izaberite bar jedan obrok.','err');return;}
  const rec={
    naziv:val('j-naziv').trim(), kategorija:val('j-kat'), obrok:obroci,
    cena_porcije:parseFloat(val('j-cena'))||0, opis:val('j-opis').trim()||null,
    aktivno:document.getElementById('j-aktivno').checked
  };
  if(!rec.naziv){toast('Unesite naziv.','err');return;}
  if(id){await sb.from('av_jela').update(rec).eq('id',id);}
  else{await sb.from('av_jela').insert({...rec, firma_id:S.firma.id});}
  closeModal();toast('Sačuvano.','ok');await loadJela();renderJela();
}
async function obrisiJelo(id){
  if(!confirm('Obrisati jelo?'))return;
  await sb.from('av_jela').delete().eq('id',id);
  closeModal();toast('Obrisano.','ok');await loadJela();renderJela();
}

let ISP={ datum:danas(), odeljenje:'hirurgija', obrok:'rucak', sobe:[], isporuke:[], stavke:[] };
const ODELJENJA=[{id:'hirurgija',naziv:'Hirurgija'},{id:'ginekologija',naziv:'Ginekologija'}];

RENDER.isporuka = async function(){
  loading();
  await Promise.all([loadJela(), loadSobe()]);
  await ucitajIsporuke();
  renderIsporuka();
};
async function loadSobe(){
  const {data}=await sb.from('av_sobe').select('*').eq('firma_id',S.firma.id).eq('aktivna',true).order('odeljenje').order('redosled');
  ISP.sobe=data||[];
}
async function ucitajIsporuke(){
  const {data:isp}=await sb.from('av_isporuka').select('*')
    .eq('firma_id',S.firma.id).eq('datum',ISP.datum).eq('odeljenje',ISP.odeljenje);
  ISP.isporuke=isp||[];
  const ids=ISP.isporuke.map(i=>i.id);
  if(ids.length){const {data:st}=await sb.from('av_isporuka_stavke').select('*').in('isporuka_id',ids);ISP.stavke=st||[];}
  else ISP.stavke=[];
}
function renderIsporuka(){
  const sobe=ISP.sobe.filter(s=>s.odeljenje===ISP.odeljenje);
  // mapa: soba -> {obrok -> {porcija, prihod, br_isporuka}}
  const ispById={}; ISP.isporuke.forEach(i=>ispById[i.id]=i);
  const sobaObrok={}; // soba|obrok -> isporuka
  ISP.isporuke.forEach(i=>{sobaObrok[i.soba+'|'+i.obrok]=i;});
  const stavkeByIsp={};
  ISP.stavke.forEach(s=>{(stavkeByIsp[s.isporuka_id]=stavkeByIsp[s.isporuka_id]||[]).push(s);});

  // prihod ukupno za dan/odeljenje
  const prihodDan=ISP.stavke.reduce((a,s)=>a+s.cena_porcije*s.kolicina,0);
  const porcijaDan=ISP.stavke.reduce((a,s)=>a+s.kolicina,0);

  const obrTabs=OBROCI.map(o=>`<button class="meal-tab ${o.id===ISP.obrok?'on':''}" onclick="ispObrok('${o.id}')">${o.ico} ${o.naziv}</button>`).join('');
  const odTabs=ODELJENJA.map(o=>`<button class="sub-tab ${o.id===ISP.odeljenje?'on':''}" onclick="ispOdeljenje('${o.id}')">${o.naziv}</button>`).join('');

  // kartice soba za izabrani obrok
  const cards=sobe.map(s=>{
    const isp=sobaObrok[s.naziv+'|'+ISP.obrok];
    const st=isp?(stavkeByIsp[isp.id]||[]):[];
    const porc=st.reduce((a,x)=>a+x.kolicina,0);
    const prihod=st.reduce((a,x)=>a+x.cena_porcije*x.kolicina,0);
    const ima=st.length>0;
    return `<div class="soba-card ${ima?'has':''}" onclick="ispSobaModal('${s.naziv}')">
      <div class="soba-top"><span class="soba-naziv">${esc(s.naziv)}</span>
        ${ima?`<span class="tag tag-ok" style="font-size:11px">${porc} porc.</span>`:'<span class="soba-add">+ dodaj</span>'}</div>
      ${ima?`<div class="soba-jela">${st.map(x=>`${x.kolicina}× ${esc(x.jelo_naziv)}`).join('<br>')}</div>
        <div class="soba-prihod">${fmt(prihod)} RSD</div>`:''}
    </div>`;
  }).join('');

  setMain(`
    <div class="page-head"><div><h2>Isporuka</h2><div class="desc">Evidencija stvarno isporučenih obroka po sobama</div></div>
      <div class="ph-actions">
        <button class="btn btn-ghost" onclick="nalogKuhinjaModal()">Nalog za kuhinju</button>
        <button class="btn btn-ghost" onclick="stikeriModal()">Stikeri</button>
        <button class="btn btn-ghost" onclick="izvestajKlijent()">Izveštaj za klijenta</button>
        <div class="date-pick">📅 <span class="muted" style="font-size:13px">${danUNedelji(ISP.datum)}</span>
          <input type="date" value="${ISP.datum}" onchange="ispDatum(this.value)"></div>
      </div></div>

    <div class="sub-tabs" style="margin-bottom:16px">${odTabs}</div>

    <div class="grid stat-grid" style="margin-bottom:18px">
      <div class="stat accent"><div class="lbl">Prihod ${ODELJENJA.find(o=>o.id===ISP.odeljenje).naziv} · ${datSr(ISP.datum)}</div>
        <div class="val" style="font-size:23px">${fmt(prihodDan)} <small>RSD</small></div></div>
      <div class="stat"><div class="lbl">Porcija (dan/odeljenje)</div><div class="val">${porcijaDan}</div></div>
      <div class="stat"><div class="lbl">Soba sa isporukom</div><div class="val">${new Set(ISP.isporuke.map(i=>i.soba)).size} <small>/ ${sobe.length}</small></div></div>
    </div>

    <div class="meal-tabs">${obrTabs}</div>
    <div class="soba-grid">${cards||'<p class="muted">Nema soba za ovo odeljenje.</p>'}</div>
  `);
}
function ispDatum(d){ISP.datum=d;RENDER.isporuka();}
function ispOdeljenje(o){ISP.odeljenje=o;RENDER.isporuka();}
function ispObrok(o){ISP.obrok=o;renderIsporuka();}

// modal za unos jela u sobu
let ispModalStanje={soba:null,stavke:[]};
function ispSobaModal(soba){
  const isp=ISP.isporuke.find(i=>i.soba===soba && i.obrok===ISP.obrok);
  const postojece=isp?ISP.stavke.filter(s=>s.isporuka_id===isp.id):[];
  ispModalStanje={soba, isporuka_id:isp?isp.id:null,
    stavke:postojece.map(s=>({jelo_id:s.jelo_id,jelo_naziv:s.jelo_naziv,kolicina:s.kolicina,cena_porcije:s.cena_porcije}))};
  renderIspModal();
}
function renderIspModal(){
  const ob=OBROCI.find(o=>o.id===ISP.obrok);
  const jelaObrok=S.jela.filter(j=>j.aktivno && (j.obrok||[]).includes(ISP.obrok));
  const total=ispModalStanje.stavke.reduce((a,s)=>a+s.cena_porcije*s.kolicina,0);
  const q=(ispModalStanje._pretraga||'').trim().toLowerCase();
  const filtrirana = q ? jelaObrok.filter(j=>j.naziv.toLowerCase().includes(q)) : jelaObrok;
  // rezultati grupisani po kategoriji
  let rezultati='';
  KATEGORIJE.forEach(k=>{
    const l=filtrirana.filter(j=>j.kategorija===k);
    if(!l.length)return;
    rezultati+=`<div class="jsr-kat">${KAT_NAZIV[k]}</div>`;
    rezultati+=l.map(j=>`<div class="jsr-item" onmousedown="ispDodajJelo('${j.id}')">
      <span class="jsr-naziv">${esc(j.naziv)}</span><span class="jsr-cena">${fmt(j.cena_porcije)} RSD</span></div>`).join('');
  });
  if(!rezultati)rezultati=`<div class="jsr-prazno">Nema jela za "${esc(q)}"</div>`;

  const body=`
    <div style="margin-bottom:14px">
      <div class="field" style="margin-bottom:10px;position:relative">
        <label>Dodaj jelo <span class="muted" style="font-weight:400">(kucaj za pretragu)</span></label>
        <input id="isp-search" autocomplete="off" placeholder="npr. omlet, jogurt, losos…"
          value="${esc(ispModalStanje._pretraga||'')}"
          oninput="ispPretraga(this.value)"
          onfocus="ispShowLista(true)"
          onkeydown="ispSearchKey(event)">
        <div id="isp-lista" class="jsr-lista" style="display:${(ispModalStanje._listaOpen&&(ispModalStanje._pretraga||'').length>=0)?'block':'none'}">${rezultati}</div>
      </div>
      ${ispModalStanje.stavke.length?`<div class="tbl-wrap" style="border:1px solid var(--line)"><table>
        <thead><tr><th>Jelo</th><th style="width:120px">Količina</th><th class="num">Iznos</th><th></th></tr></thead>
        <tbody>${ispModalStanje.stavke.map((s,idx)=>`<tr>
          <td class="t-strong">${esc(s.jelo_naziv)}<br><span class="muted" style="font-size:11.5px">${fmt(s.cena_porcije)} RSD</span></td>
          <td><div class="qty"><button onclick="ispQty(${idx},-1)">−</button>
            <input type="text" value="${s.kolicina}" onchange="ispQtySet(${idx},this.value)"><button onclick="ispQty(${idx},1)">+</button></div></td>
          <td class="num t-strong">${fmt(s.cena_porcije*s.kolicina)}</td>
          <td class="num"><button class="btn btn-sm btn-danger" onclick="ispUkloni(${idx})">✕</button></td>
        </tr>`).join('')}</tbody>
        <tfoot><tr style="background:var(--cream)"><td colspan="2" class="t-strong">UKUPNO</td><td class="num t-strong">${fmt(total)} RSD</td><td></td></tr></tfoot>
      </table></div>`:'<div class="cart-empty" style="padding:24px">Nijedno jelo još nije dodato.</div>'}
    </div>`;
  const footer=[
    ispModalStanje.isporuka_id?`<button class="btn btn-danger" onclick="ispObrisiSobu()">Obriši isporuku</button>`:'',
    `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>`,
    `<button class="btn btn-primary" onclick="ispSacuvaj()">Sačuvaj</button>`
  ].join('');
  const existing=document.getElementById('modal-bg');
  if(existing){
    existing.querySelector('.modal-body').innerHTML=body;
    existing.querySelector('.modal-foot').innerHTML=footer;
  }else{
    openModal(`${ob.ico} ${ob.naziv} — soba ${esc(ispModalStanje.soba)}`, body, footer);
  }
  // vrati fokus i poziciju kursora u polje za pretragu
  if(ispModalStanje._fokusSearch){
    const inp=document.getElementById('isp-search');
    if(inp){inp.focus();const v=inp.value;inp.value='';inp.value=v;}
    ispModalStanje._fokusSearch=false;
  }
}
function ispPretraga(v){
  ispModalStanje._pretraga=v;
  ispModalStanje._listaOpen=true;
  ispModalStanje._fokusSearch=true;
  renderIspModal();
}
function ispShowLista(open){
  ispModalStanje._listaOpen=open;
  if(!open){
    // mali delay da klik na stavku stigne pre zatvaranja
    setTimeout(()=>{ispModalStanje._listaOpen=false;},150);
  }
}
function ispSearchKey(e){
  if(e.key==='Enter'){
    // dodaj prvo jelo iz filtrirane liste
    e.preventDefault();

  }else if(e.key==='Escape'){
    ispModalStanje._listaOpen=false;renderIspModal();

}

// ══════════════════════════════════════════════════════════
//  ZAJEDNIČKI: učitaj dnevne isporuke + prepoznaj jogurt/k.mleko
// ══════════════════════════════════════════════════════════
async function ucitajDan(dat){
  const {data:isp}=await sb.from('av_isporuka').select('*').eq('firma_id',S.firma.id).eq('datum',dat);
  if(!isp||!isp.length)return null;
  const ids=isp.map(i=>i.id);
  const {data:stavke}=await sb.from('av_isporuka_stavke').select('*').in('isporuka_id',ids);
  const stByIsp={}; (stavke||[]).forEach(s=>{(stByIsp[s.isporuka_id]=stByIsp[s.isporuka_id]||[]).push(s);});
  return {isp, stByIsp, stavke:stavke||[]};
}
function jeMlecni(naziv){
  const n=(naziv||'').toLowerCase();
  return n.includes('jogurt')||n.includes('kiselo mleko')||n.includes('kiselog mleka');
}
// Dodaci koji se NE broje u "popularnost obroka" (ali se broje u finansijskom izveštaju):
// samostalni jogurt / kiselo mleko / hleb, i sve supe/čorbe/potaži.
function jeDodatak(naziv){
  const n=(naziv||'').trim().toLowerCase();
  if(/^(jogurt|kiselo mleko|hleb|hleba|pecivo|dvopek)$/.test(n))return true;
  // supe/čorbe/potaži — bez \b jer srpski karakteri lome granicu reči
  if(/(supa|supe|corba|čorba|corbe|čorbe|potaz|potaž)/.test(n))return true;
  return false;
}
// Razbij naziv jela na zasebne artikle (za stikere i nalog).
// Pravilo: izdvoj SAMO mlečne (jogurt, kiselo mleko) i čist hleb/pecivo kao
// posebne komponente. Glavni deo (uklj. "Dvopek, sir") ostaje spojen.
// "Dvopek, sir, jogurt"          -> ["Dvopek, sir", "Jogurt"]
// "Omlet sa sirom, jogurt, hleb" -> ["Omlet sa sirom", "Jogurt", "Hleb"]
// "Proja sa sirom, kiselo mleko" -> ["Proja sa sirom", "Kiselo mleko"]
// "Prazan kroasan i jogurt"      -> ["Prazan kroasan", "Jogurt"]
// "Tortilja sa omletom i krem namazom" -> ["Tortilja sa omletom i krem namazom"]
function razbijArtikle(naziv){
  if(!naziv)return [];
  // čist hleb/pecivo = deo koji je SAMO hleb/pecivo (npr "hleb", "pecivo"),
  // ne "Dvopek, sir" i ne glavno jelo koje slučajno sadrži reč.
  const jeCistHleb = t => /^(hleb|hleba|pecivo|kifla|kifle|zemi[čc]ka?)$/i.test(t.trim());
  const jeIzdvojiv = t => jeMlecni(t) || jeCistHleb(t);

  // prvo razbij po zarezu
  let delovi = naziv.split(',').map(x=>x.trim()).filter(Boolean);
  // za delove koji sadrže " i " a taj veznik razdvaja mlečni/hleb — razbij i njih
  delovi = delovi.flatMap(d=>{
    const p = d.split(/\s+i\s+/i).map(x=>x.trim());
    // razbij po "i" samo ako bar jedan nastali deo postaje izdvojiv (mlečno/hleb)
    if(p.length>1 && p.some(x=>jeIzdvojiv(x))) return p;
    return [d];
  });

  const izdvojeni=[]; const glavni=[];
  delovi.forEach(d=>{ if(jeIzdvojiv(d)) izdvojeni.push(d); else glavni.push(d); });

  const rez=[];
  if(glavni.length) rez.push(glavni.join(', '));  // glavni deo ostaje zajedno
  izdvojeni.forEach(x=>rez.push(x));
  return rez.map(x=>x.charAt(0).toUpperCase()+x.slice(1));
}
function sobeRedosled(odeljenje){
  const m={}; ISP.sobe.filter(s=>s.odeljenje===odeljenje).forEach((s,ix)=>m[s.naziv]=ix); return m;
}

async function izvestajKlijent(){
  const dat=ISP.datum;
  const d=await ucitajDan(dat);
  if(!d){toast('Nema isporuke za taj dan.','err');return;}
  const {isp,stByIsp}=d;

  let body='';
  ODELJENJA.forEach(od=>{
    const ispOd=isp.filter(i=>i.odeljenje===od.id);
    if(!ispOd.length)return;
    let odPorc=0; ispOd.forEach(i=>(stByIsp[i.id]||[]).forEach(s=>odPorc+=s.kolicina));
    body+=`<div class="odsek"><div class="odsek-h ${od.id}">${od.naziv}<span class="odsek-uk">${odPorc} porcija</span></div>`;
    OBROCI.forEach(ob=>{
      const ispObrok=ispOd.filter(i=>i.obrok===ob.id);
      if(!ispObrok.length)return;
      const red=sobeRedosled(od.id);
      ispObrok.sort((a,b)=>(red[a.soba]??99)-(red[b.soba]??99));
      let obPorc=0; ispObrok.forEach(i=>(stByIsp[i.id]||[]).forEach(s=>obPorc+=s.kolicina));
      body+=`<div class="obrok-blok"><div class="obrok-h">${ob.naziv}<span class="obrok-uk">${obPorc} porcija</span></div>
        <table><thead><tr><th style="width:90px">Soba</th><th>Artikli</th><th style="width:70px" class="c">Porcija</th></tr></thead><tbody>`;
      ispObrok.forEach(i=>{
        const st=stByIsp[i.id]||[];
        const sobaPorc=st.reduce((a,s)=>a+s.kolicina,0);
        body+=`<tr><td class="soba-c">${esc(i.soba)}</td>
          <td>${st.map(s=>`${s.kolicina} × ${esc(s.jelo_naziv)}`).join('<br>')}</td>
          <td class="c"><b>${sobaPorc}</b></td></tr>`;
      });
      body+=`</tbody></table></div>`;
    });
    body+=`</div>`;
  });

  const html=`
    <div class="rep-head">
      <div class="brand">VILARA KETERING<small>Izveštaj o isporuci</small></div>
      <div class="datum"><b>${danUNedelji(dat)}</b><br>${datSr(dat)}</div>
    </div>
    <div class="meta">${esc(S.firma?.naziv||"")} — raspored po sobama i odeljenjima</div>
    ${body}
    <div class="foot"><span>Vilara Ketering d.o.o.</span><span>${esc(S.firma?.naziv||"")} — ${datSr(dat)}</span></div>`;
  otvoriStampu('Izveštaj isporuke '+datSr(dat), html);
}

async function nalogKuhinja(varijanta, obrokFilter='sve'){
  const dat=ISP.datum;
  const d=await ucitajDan(dat);
  if(!d){toast('Nema isporuke za taj dan.','err');return;}
  const {isp,stByIsp}=d;
  const obroci = obrokFilter==='sve' ? OBROCI : OBROCI.filter(o=>o.id===obrokFilter);

  // sekcija za jedno odeljenje (ili sva)
  function sekcijaOdeljenja(odId, odNaziv){
    const ispOd = odId ? isp.filter(i=>i.odeljenje===odId) : isp;
    // filtriraj na izabrane obroke
    const ispRel = ispOd.filter(i=>obroci.some(o=>o.id===i.obrok));
    if(!ispRel.length)return '';
    let out=`<div class="odsek"><div class="odsek-h ${odId||'hirurgija'}">${odNaziv}</div>`;
    obroci.forEach(ob=>{
      const ispObrok=ispOd.filter(i=>i.obrok===ob.id);
      if(!ispObrok.length)return;
      const obrDorucak = ob.id==='dorucak';
      // agregacija po komponenti (doručak ili mlečno jelo) ili po celom jelu
      const jeloUk={};
      ispObrok.forEach(i=>(stByIsp[i.id]||[]).forEach(s=>{
        const deli = obrDorucak || jeMlecni(s.jelo_naziv);
        const komponente = deli ? razbijArtikle(s.jelo_naziv) : [s.jelo_naziv];
        komponente.forEach(art=>{
          jeloUk[art]=(jeloUk[art]||0)+s.kolicina;
        });
      }));
      const obPorc=Object.values(jeloUk).reduce((a,b)=>a+b,0);
      // raspored po sobama
      const red = odId?sobeRedosled(odId):{};
      const sortiraneSobe=[...ispObrok].sort((a,b)=>{
        if(odId)return (red[a.soba]??99)-(red[b.soba]??99);
        if(a.odeljenje!==b.odeljenje)return a.odeljenje<b.odeljenje?-1:1;
        return a.soba<b.soba?-1:1;
      });
      out+=`<div class="obrok-blok"><div class="obrok-h">${ob.naziv}<span class="obrok-uk">${obPorc} ${obrDorucak?'kom':'porcija'}</span></div>`;
      // sumarno po komponenti/jelu
      out+=`<table><thead><tr><th>${obrDorucak?'Artikal':'Jelo'}</th><th style="width:90px" class="c">Ukupno</th></tr></thead><tbody>`;
      out+=Object.entries(jeloUk).sort((a,b)=>b[1]-a[1]).map(([n,q])=>
        `<tr><td class="${jeMlecni(n)?'soba-c':''}">${esc(n)}</td><td class="c"><b>${q}</b></td></tr>`).join('');
      out+=`</tbody></table>`;
      // raspored po sobama
      out+=`<table style="border-top:1px solid #d7dbe0"><thead><tr><th style="width:${odId?'90':'150'}px">${odId?'Soba':'Odeljenje / soba'}</th><th>Artikli</th><th style="width:70px" class="c">Porc.</th></tr></thead><tbody>`;
      sortiraneSobe.forEach(i=>{
        const st=stByIsp[i.id]||[];
        const sobaPorc=st.reduce((a,s)=>a+s.kolicina,0);
        const sobaLbl=odId?esc(i.soba):`${ODELJENJA.find(o=>o.id===i.odeljenje).naziv} · ${esc(i.soba)}`;
        // prikaz artikala: razbij za doručak ili za mlečno jelo
        const artikliTxt = st.map(s=>{
          if(obrDorucak || jeMlecni(s.jelo_naziv)){
            return razbijArtikle(s.jelo_naziv).map(a=>`${s.kolicina} × ${esc(a)}${jeMlecni(a)?' ◄':''}`).join('<br>');
          }
          return `${s.kolicina} × ${esc(s.jelo_naziv)}${jeMlecni(s.jelo_naziv)?' ◄':''}`;
        }).join('<br>');
        out+=`<tr><td class="soba-c">${sobaLbl}</td>
          <td>${artikliTxt}</td>
          <td class="c"><b>${sobaPorc}</b></td></tr>`;
      });
      out+=`</tbody></table></div>`;
    });
    out+=`</div>`;
    return out;
  }

  function dokument(naslovOdeljenje, telo){
    const obrokLbl = obrokFilter==='sve' ? '' : (OBROCI.find(o=>o.id===obrokFilter)?.naziv||'');
    return `
      <div class="rep-head">
        <div class="brand">VILARA KETERING<small>Nalog za kuhinju${obrokLbl?' — '+obrokLbl.toUpperCase():''}</small></div>
        <div class="datum"><b>${danUNedelji(dat)}</b><br>${datSr(dat)}</div>
      </div>
      <div class="meta">${esc(S.firma?.naziv||"")}${naslovOdeljenje?' — '+naslovOdeljenje:''}${obrokLbl?' — '+obrokLbl:''} — priprema i raspored po sobama</div>
      ${telo}
      <div class="foot"><span>Vilara Ketering d.o.o.</span><span>Nalog za kuhinju — ${datSr(dat)}</span></div>`;
  }

  if(varijanta==='odvojeno'){
    let out='';
    ODELJENJA.forEach((od,ix)=>{
      const sek=sekcijaOdeljenja(od.id, od.naziv);
      if(!sek)return;
      if(out)out+=`<div style="page-break-before:always"></div>`;
      out+=dokument(od.naziv, sek);
    });
    if(!out){toast('Nema isporuke.','err');return;}
    otvoriStampu('Nalog za kuhinju (odvojeno) '+datSr(dat), out);
  }else{
    const sek=sekcijaOdeljenja(null,'Sva odeljenja');
    otvoriStampu('Nalog za kuhinju (objedinjeno) '+datSr(dat), dokument('', sek));
  }
}

      <div id="stik-grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:260px;margin:0 auto">
        ${Array.from({length:65}).map((_,ix)=>`<div class="stik-cell" data-ix="${ix}" onclick="stikPickStart(${ix})"
          style="aspect-ratio:38/21;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink-3);cursor:pointer">${ix+1}</div>`).join('')}
      </div>
      <p style="text-align:center;font-size:12.5px;margin-top:10px;color:var(--ink-2)">Počinje od pozicije <b id="stik-start-lbl">1</b> · slobodno <b id="stik-free-lbl">65</b> na prvom listu</p>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>
     <button class="btn btn-primary" onclick="closeModal();stikeri(_stikObrok,_stikStart)">Štampaj</button>`);
  stikPickStart(0);
}
function stikPickObrok(o){
  _stikObrok=o;
  document.querySelectorAll('#stik-obrok-chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.o===o));
}
function stikPickStart(ix){
  _stikStart=ix;
  document.querySelectorAll('#stik-grid .stik-cell').forEach(c=>{
    const i=+c.dataset.ix;
    if(i<ix){c.style.background='#e5e8ec';c.style.borderColor='#d7dbe0';c.style.color='#b0b6bd';}
    else if(i===ix){c.style.background='var(--gold)';c.style.borderColor='var(--gold)';c.style.color='#fff';c.style.fontWeight='700';}
    else {c.style.background='#fff5f5';c.style.borderColor='#f0c9c9';c.style.color='var(--ink-3)';c.style.fontWeight='400';}
  });
  const lbl=document.getElementById('stik-start-lbl'); if(lbl)lbl.textContent=ix+1;
  const free=document.getElementById('stik-free-lbl'); if(free)free.textContent=65-ix;
}
async function stikeri(obrokFilter, startOffset=0){
  const dat=ISP.datum;
  const d=await ucitajDan(dat);
  if(!d){toast('Nema isporuke za taj dan.','err');return;}
  const {isp,stByIsp}=d;

  // Stiker po KOMADU. Doručak se deli na komponente (omlet / jogurt / hleb),
  // jer se serviraju odvojeno. Ručak i večera idu kao ceo obrok na jedan tanjir
  // (npr. "Chicken tikka, pirinač") -> jedan stiker.
  const stikeri=[];
  ODELJENJA.forEach(od=>{
    let ispOd=isp.filter(i=>i.odeljenje===od.id);
    if(obrokFilter!=='sve')ispOd=ispOd.filter(i=>i.obrok===obrokFilter);
    const red=sobeRedosled(od.id);
    ispOd.sort((a,b)=>{
      if(a.obrok!==b.obrok)return OBROCI.findIndex(o=>o.id===a.obrok)-OBROCI.findIndex(o=>o.id===b.obrok);
      return (red[a.soba]??99)-(red[b.soba]??99);
    });
    ispOd.forEach(i=>{
      const st=stByIsp[i.id]||[];
      st.forEach(s=>{
        // razbij za doručak, ili za bilo koje jelo koje sadrži mlečni proizvod
        // (jogurt/kiselo mleko ide u čaši, pa uvek dobija zaseban stiker)
        const deli = i.obrok==='dorucak' || jeMlecni(s.jelo_naziv);
        const komponente = deli ? razbijArtikle(s.jelo_naziv) : [s.jelo_naziv];
        for(let k=0;k<s.kolicina;k++){
          komponente.forEach(art=>{
            stikeri.push({soba:i.soba, jelo:art, mlecni:jeMlecni(art)});
          });
        }
      });
    });
  });
  if(!stikeri.length){toast('Nema stavki za štampu.','err');return;}

  // A4 = 210 x 297 mm. Grid 5 kolona x 13 redova = 65 nalepnica.
  // Avery L7651: nalepnica 38.1 x 21.2 mm, leva margina 4.75mm, gornja 10.7mm, bez razmaka.
  const PO_LISTU=65, KOL=5, RED=13;
  const css=`
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:#e8eaed}
    .btnbar{padding:10mm;text-align:center;background:#fff;position:sticky;top:0;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:5}
    .btnbar button{padding:11px 26px;font-size:14px;background:#242a33;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
    .btnbar .info{color:#6b727c;font-size:12.5px;margin-top:8px}
    .list{width:210mm;min-height:297mm;background:#fff;margin:8mm auto;
      display:grid;grid-template-columns:repeat(${KOL},38.1mm);grid-template-rows:repeat(${RED},21.2mm);
      justify-content:center;align-content:start;padding-top:10.7mm;page-break-after:always}
    .cell{width:38.1mm;height:21.2mm;padding:1.6mm 2mm;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
      border:0.2mm dashed #d0d4d9}
    .cell.mlecni{background:#fdf7e6}
    .cell.blank{border:none !important;background:transparent}
    .c-soba{font-size:15pt;font-weight:800;color:#111;line-height:1;letter-spacing:.3px}
    .c-jelo{font-size:6.6pt;font-weight:600;color:#333;line-height:1.12;margin-top:1mm;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    @page{size:A4;margin:0}
    @media print{
      body{background:#fff}
      .btnbar{display:none}
      .list{margin:0;box-shadow:none;width:210mm;height:297mm}
      .cell{border:none}
    }
  `;
  // podeli na listove po 65, sa praznim mestima na početku prvog lista (startOffset)
  let listovi='';
  const blankCell='<div class="cell blank"></div>';
  // prvi list: startOffset praznih + stikeri do popune lista
  let idx=0;
  let prvi=true;
  while(idx<stikeri.length || (prvi && startOffset>0 && stikeri.length>0)){
    let cells='';
    let kapacitet=PO_LISTU;
    if(prvi && startOffset>0){
      cells+=blankCell.repeat(startOffset);
      kapacitet=PO_LISTU-startOffset;
    }
    const grupa=stikeri.slice(idx, idx+kapacitet);
    idx+=grupa.length;
    cells+=grupa.map(s=>`<div class="cell ${s.mlecni?'mlecni':''}">
      <div class="c-soba">${esc(s.soba)}</div>
      <div class="c-jelo">${esc(s.jelo)}</div>
    </div>`).join('');
    listovi+=`<div class="list">${cells}</div>`;
    prvi=false;
    if(idx>=stikeri.length)break;
  }
  const brLista=(listovi.match(/class="list"/g)||[]).length;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="sr"><head><meta charset="utf-8"><title>Stikeri ${datSr(dat)}</title><style>${css}</style></head>
    <body><div class="btnbar"><button onclick="window.print()">Štampaj stikere</button>
      <div class="info">${stikeri.length} nalepnica · ${brLista} ${brLista===1?'list':'lista'} A4 (5 × 13)${startOffset>0?` · počinje od poz. ${startOffset+1}`:''} · format Avery L7651</div></div>
    ${listovi}</body></html>`);
  w.document.close();
}
