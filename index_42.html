let STAT={period:'mesec', od:null, do:null, dan:null};
RENDER.statistika = async function(){
  loading();
  const {data:isp}=await sb.from('av_isporuka').select('*').eq('firma_id',S.firma.id);
  const ids=(isp||[]).map(i=>i.id);
  let stavke=[];
  if(ids.length){const {data}=await sb.from('av_isporuka_stavke').select('*').in('isporuka_id',ids);stavke=data||[];}
  STAT._isp=isp||[]; STAT._st=stavke;
  renderStatistika();
};
function statPeriodOpseg(){
  // vrati [odDatum, doDatum] (inclusive) na osnovu STAT.period
  const d=new Date(); const iso=x=>x.toISOString().slice(0,10);
  if(STAT.period==='dan'){const t=STAT.dan||danas();return [t,t];}
  if(STAT.period==='nedelja'){
    const day=(d.getDay()+6)%7; // pon=0
    const pon=new Date(d); pon.setDate(d.getDate()-day);
    const ned=new Date(pon); ned.setDate(pon.getDate()+6);
    return [iso(pon),iso(ned)];
  }
  if(STAT.period==='mesec'){const m=danas().slice(0,7);return [m+'-01', m+'-31'];}
  if(STAT.period==='sve'){return ['0000-01-01','9999-12-31'];}
  if(STAT.period==='period'){return [STAT.od||danas(), STAT.do||danas()];}
  return ['0000-01-01','9999-12-31'];
}
function renderStatistika(){
  const O=STAT._isp, STall=STAT._st;
  const stById={}; O.forEach(o=>stById[o.id]=o);
  const val=s=>s.cena_porcije*s.kolicina;

  if(!O.length){
    setMain(`${statHeader()}<div class="empty"><div class="big">📊</div><h3>Još nema podataka</h3><p>Statistika se popunjava čim uneseš isporuke.</p></div>`);
    return;
  }

  const [od,doo]=statPeriodOpseg();
  const uOpsegu=o=>o.datum>=od && o.datum<=doo;
  const ispIds=new Set(O.filter(uOpsegu).map(o=>o.id));
  const ST=STall.filter(s=>ispIds.has(s.isporuka_id));

  // ── OSNOVNO za period ──
  const ukPorcija=ST.reduce((a,s)=>a+s.kolicina,0);
  const ukPrihod=ST.reduce((a,s)=>a+val(s),0);
  const daniSet=new Set([...ispIds].map(id=>stById[id].datum));
  const danaAktivnih=daniSet.size;
  const prihodDan=danaAktivnih?ukPrihod/danaAktivnih:0;
  const brIsporuka=ispIds.size;
  const prosekPorcija=ukPorcija?ukPrihod/ukPorcija:0;

  // ── PRIHOD PO DANU (u opsegu) ──
  const prihodPoDanu={};
  ST.forEach(s=>{const o=stById[s.isporuka_id];prihodPoDanu[o.datum]=(prihodPoDanu[o.datum]||0)+val(s);});
  const daniSort=Object.keys(prihodPoDanu).sort();

  // ── PRIHOD PO MESECU (uvek celokupno, za trend) ──
  const prihodPoMesecu={};
  STall.forEach(s=>{const o=stById[s.isporuka_id];if(o){const m=o.datum.slice(0,7);prihodPoMesecu[m]=(prihodPoMesecu[m]||0)+val(s);}});
  const meseciSort=Object.keys(prihodPoMesecu).sort();

  // ── POPULARNOST OBROKA (porcije + prihod) ──
  const obrokAgg={dorucak:{q:0,rev:0},rucak:{q:0,rev:0},vecera:{q:0,rev:0}};
  ST.forEach(s=>{
    if(jeDodatak(s.jelo_naziv))return;   // supe, jogurt, kiselo mleko, hleb se ne broje
    const o=stById[s.isporuka_id];obrokAgg[o.obrok].q+=s.kolicina;obrokAgg[o.obrok].rev+=val(s);
  });
  const ukObrokPorc=obrokAgg.dorucak.q+obrokAgg.rucak.q+obrokAgg.vecera.q;

  // ── PO DANU U NEDELJI ──
  const dow=['Nedelja','Ponedeljak','Utorak','Sreda','Četvrtak','Petak','Subota'];
  const prihodDow=[0,0,0,0,0,0,0];
  ST.forEach(s=>{const o=stById[s.isporuka_id];prihodDow[new Date(o.datum+'T00:00').getDay()]+=val(s);});

  // ── PO ODELJENJU ──
  const prihodOdel={hirurgija:0,ginekologija:0};
  ST.forEach(s=>{const o=stById[s.isporuka_id];prihodOdel[o.odeljenje]=(prihodOdel[o.odeljenje]||0)+val(s);});

  // ── TOP JELA ──
  const jeloAgg={};
  ST.forEach(s=>{if(!jeloAgg[s.jelo_naziv])jeloAgg[s.jelo_naziv]={q:0,rev:0};jeloAgg[s.jelo_naziv].q+=s.kolicina;jeloAgg[s.jelo_naziv].rev+=val(s);});
  const topPrihod=Object.entries(jeloAgg).sort((a,b)=>b[1].rev-a[1].rev).slice(0,10);
  const topPopularnost=Object.entries(jeloAgg).sort((a,b)=>b[1].q-a[1].q).slice(0,10);

  const opisPeriod={dan:(STAT.dan&&STAT.dan!==danas())?datSr(STAT.dan):'Danas',nedelja:'Ova nedelja',mesec:'Ovaj mesec',sve:'Sve vreme',period:`${datSr(od)} – ${datSr(doo)}`}[STAT.period];

  setMain(`
    ${statHeader()}
    <div class="card card-pad" style="margin-bottom:16px;padding:14px 18px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-weight:600;font-size:13px;color:var(--ink-2)">Period:</span>
        ${['dan','nedelja','mesec','sve','period'].map(p=>`<button class="sub-tab ${STAT.period===p?'on':''}" onclick="statSetPeriod('${p}')">${({dan:'Dan',nedelja:'Nedelja',mesec:'Mesec',sve:'Sve',period:'Opseg'})[p]}</button>`).join('')}
        ${STAT.period==='dan'?`<input type="date" value="${STAT.dan||danas()}" onchange="STAT.dan=this.value;renderStatistika()" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;margin-left:8px">`:''}
        ${STAT.period==='period'?`<span style="display:inline-flex;gap:6px;align-items:center;margin-left:8px">
          <input type="date" value="${STAT.od||danas()}" onchange="STAT.od=this.value;renderStatistika()" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px">
          <span class="muted">→</span>
          <input type="date" value="${STAT.do||danas()}" onchange="STAT.do=this.value;renderStatistika()" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px">
        </span>`:''}
        <span style="margin-left:auto;font-weight:700;color:var(--gold-dk)">${opisPeriod}</span>
      </div>
    </div>

    <div class="grid stat-grid" style="margin-bottom:14px">
      <div class="stat accent"><div class="lbl">Prihod (${opisPeriod.toLowerCase()})</div><div class="val" style="font-size:24px">${fmt(ukPrihod)} <small>RSD</small></div><div style="font-size:11.5px;opacity:.6;margin-top:3px">${ukPorcija} porcija</div></div>
      <div class="stat"><div class="lbl">Prosek / dan</div><div class="val" style="font-size:22px">${fmt(prihodDan)} <small>RSD</small></div></div>
      <div class="stat"><div class="lbl">Isporuka</div><div class="val">${brIsporuka}</div></div>
      <div class="stat"><div class="lbl">Prosečna cena porcije</div><div class="val" style="font-size:20px">${fmt(prosekPorcija)} <small>RSD</small></div></div>
      <div class="stat"><div class="lbl">Aktivnih dana</div><div class="val">${danaAktivnih}</div></div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px">
      <h3 style="font-size:16px;margin-bottom:18px">Dnevni prihod ${daniSort.length>1?`(${daniSort.length} dana)`:''}</h3>
      ${moneyLineChart(daniSort.map(d=>({x:d,y:prihodPoDanu[d]})))}
    </div>

    <div class="card card-pad" style="margin-bottom:16px">
      <h3 style="font-size:16px;margin-bottom:6px">Popularnost obroka</h3>
      <p class="muted" style="font-size:12.5px;margin-bottom:16px">Udeo po broju porcija u izabranom periodu — bez supa, jogurta, kiselog mleka i hleba</p>
      ${OBROCI.map(ob=>{
        const a=obrokAgg[ob.id];const pct=ukObrokPorc?Math.round(a.q/ukObrokPorc*100):0;
        const col={dorucak:'#d82028',rucak:'#2f3640',vecera:'#2f5e7d'}[ob.id];
        return `<div style="margin-bottom:15px">
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px">
            <span style="font-weight:600">${ob.ico} ${ob.naziv}</span>
            <span><b>${a.q}</b> <span class="muted">porc. · ${pct}% · ${fmt(a.rev)} RSD</span></span></div>
          <div style="background:var(--cream);border-radius:7px;height:24px;overflow:hidden;position:relative">
            <div style="width:${pct}%;height:100%;background:${col};border-radius:7px;transition:.4s"></div>
            ${pct>=8?`<span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#fff;font-size:12px;font-weight:700">${pct}%</span>`:''}
          </div></div>`;
      }).join('')}
    </div>

    ${meseciSort.length>1?`<div class="card card-pad" style="margin-bottom:16px">
      <h3 style="font-size:16px;margin-bottom:16px">Prihod po mesecima (ukupno)</h3>
      ${barChart(meseciSort.map(m=>({label:mesecNaziv(m),val:Math.round(prihodPoMesecu[m]),color:'#d82028',money:true})))}
    </div>`:''}

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card card-pad">
        <h3 style="font-size:16px;margin-bottom:16px">Prihod po danu u nedelji</h3>
        ${barChart([1,2,3,4,5,6,0].map(i=>({label:dow[i],val:Math.round(prihodDow[i]),color:'#2f3640',money:true})))}
      </div>
      <div class="card card-pad">
        <h3 style="font-size:16px;margin-bottom:16px">Prihod po odeljenju</h3>
        ${barChart([
          {label:'🔵 Hirurgija',val:Math.round(prihodOdel.hirurgija),color:'#2f5e7d',money:true},
          {label:'🔴 Ginekologija',val:Math.round(prihodOdel.ginekologija),color:'#d82028',money:true},
        ])}
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px">
      <div class="card card-pad">
        <h3 style="font-size:16px;margin-bottom:14px">Najprofitabilnija jela</h3>
        ${topPrihod.length?`<div class="tbl-wrap" style="border:none"><table><thead><tr><th style="width:30px">#</th><th>Jelo</th><th class="num">Prihod</th></tr></thead>
          <tbody>${topPrihod.map(([n,d],i)=>`<tr><td class="muted">${i+1}</td><td class="t-strong">${esc(n)}</td><td class="num t-strong">${fmt(d.rev)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nema podataka.</p>'}
      </div>
      <div class="card card-pad">
        <h3 style="font-size:16px;margin-bottom:14px">Najtraženija jela (porcije)</h3>
        ${topPopularnost.length?`<div class="tbl-wrap" style="border:none"><table><thead><tr><th style="width:30px">#</th><th>Jelo</th><th class="num">Porcija</th></tr></thead>
          <tbody>${topPopularnost.map(([n,d],i)=>`<tr><td class="muted">${i+1}</td><td class="t-strong">${esc(n)}</td><td class="num t-strong">${d.q}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nema podataka.</p>'}
      </div>
    </div>`);
}
function statHeader(){
  const btn=`<div class="ph-actions"><button class="btn btn-primary" onclick="finIzvestaj()">Finansijski izveštaj</button></div>`;
  if(S.user.korisnicko_ime==='kaca'){
    return `<div class="page-head"><div><h2>Zdravo Kaća <3</h2><div class="desc">Prihod i analitika — ${esc(S.firma?.naziv||"")}</div></div>${btn}</div>`;

  }

}
function statSetPeriod(p){
  STAT.period=p;
  if(p==='period'){STAT.od=STAT.od||danas();STAT.do=STAT.do||danas();}
  renderStatistika();
}

// ══════════════════════════════════════════════════════════
//  FINANSIJSKI IZVEŠTAJ (za štampu / fakturisanje)
// ══════════════════════════════════════════════════════════
function finIzvestaj(){
  const O=STAT._isp||[], STall=STAT._st||[];
  if(!O.length){toast('Nema podataka za izveštaj.','err');return;}
  const stById={}; O.forEach(o=>stById[o.id]=o);
  const [od,doo]=statPeriodOpseg();
  const ispIds=new Set(O.filter(o=>o.datum>=od && o.datum<=doo).map(o=>o.id));
  const ST=STall.filter(s=>ispIds.has(s.isporuka_id));
  if(!ST.length){toast('Nema isporuka u izabranom periodu.','err');return;}
  const val=s=>s.cena_porcije*s.kolicina;

  // ── specifikacija po stavci (naziv + jedinična cena) ──
  const spec={};
  ST.forEach(s=>{
    const k=s.jelo_naziv+'|'+s.cena_porcije;
    if(!spec[k])spec[k]={naziv:s.jelo_naziv, cena:s.cena_porcije, kol:0, iznos:0};
    spec[k].kol+=s.kolicina; spec[k].iznos+=val(s);
  });
  const specLista=Object.values(spec).sort((a,b)=>b.iznos-a.iznos);

  // ── po obroku ──
  const poObroku={dorucak:{kol:0,iznos:0},rucak:{kol:0,iznos:0},vecera:{kol:0,iznos:0}};
  ST.forEach(s=>{const o=stById[s.isporuka_id];poObroku[o.obrok].kol+=s.kolicina;poObroku[o.obrok].iznos+=val(s);});

  // ── po odeljenju ──

    <div class="odsek">

      <div class="obrok-blok">
        <table><thead><tr><th>Obrok</th><th class="c" style="width:90px">Količina</th><th class="c" style="width:130px">Iznos (RSD)</th></tr></thead>
        <tbody>${OBROCI.map(ob=>{const a=poObroku[ob.id];if(!a.kol)return'';
          return `<tr><td class="soba-c">${ob.naziv}</td><td class="c">${a.kol}</td><td class="c"><b>${fmt(a.iznos)}</b></td></tr>`;}).join('')}
        <tr style="background:#f4f5f7"><td class="soba-c">UKUPNO</td><td class="c"><b>${ukKol}</b></td><td class="c"><b>${fmt(ukIznos)}</b></td></tr>
        </tbody></table>
      </div>
    </div>

    <div class="odsek">
      <div class="odsek-h ginekologija">Rekapitulacija po odeljenju</div>
      <div class="obrok-blok">
        <table><thead><tr><th>Odeljenje</th><th class="c" style="width:90px">Količina</th><th class="c" style="width:130px">Iznos (RSD)</th></tr></thead>
        <tbody>${ODELJENJA.map(o=>{const a=poOdel[o.id];if(!a||!a.kol)return'';
          return `<tr><td class="soba-c">${o.naziv}</td><td class="c">${a.kol}</td><td class="c"><b>${fmt(a.iznos)}</b></td></tr>`;}).join('')}
        <tr style="background:#f4f5f7"><td class="soba-c">UKUPNO</td><td class="c"><b>${ukKol}</b></td><td class="c"><b>${fmt(ukIznos)}</b></td></tr>

function mesecNaziv(m){const[y,mm]=m.split('-');const n=['','Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];return n[parseInt(mm)]+' '+y;}

//  ZBIRNA STATISTIKA — sve firme (admin, direktor, Kaća)
// ══════════════════════════════════════════════════════════
let ZB={period:'mesec', od:null, do:null, dan:null};
RENDER.zbirno = async function(){
  loading();
  const [{data:isp},{data:stavke}] = await Promise.all([
    sb.from('av_isporuka').select('*'),
    sb.from('av_isporuka_stavke').select('*'),
  ]);
  ZB._isp=isp||[]; ZB._st=stavke||[];
  renderZbirno();
};
function zbPeriodOpseg(){
  const d=new Date(); const iso=x=>x.toISOString().slice(0,10);
  if(ZB.period==='dan'){const t=ZB.dan||danas();return [t,t];}
  if(ZB.period==='nedelja'){
    const day=(d.getDay()+6)%7;
    const pon=new Date(d); pon.setDate(d.getDate()-day);
    const ned=new Date(pon); ned.setDate(pon.getDate()+6);
    return [iso(pon),iso(ned)];
  }
  if(ZB.period==='mesec'){const m=danas().slice(0,7);return [m+'-01', m+'-31'];}
  if(ZB.period==='sve'){return ['0000-01-01','9999-12-31'];}
  if(ZB.period==='period'){return [ZB.od||danas(), ZB.do||danas()];}
  return ['0000-01-01','9999-12-31'];
}
function zbSetPeriod(p){
  ZB.period=p;
  if(p==='period'){ZB.od=ZB.od||danas();ZB.do=ZB.do||danas();}
  if(p==='dan'){ZB.dan=ZB.dan||danas();}
  renderZbirno();
}
function renderZbirno(){
  const O=ZB._isp||[], STall=ZB._st||[];
  const stById={}; O.forEach(o=>stById[o.id]=o);
  const val=s=>s.cena_porcije*s.kolicina;
  const [od,doo]=zbPeriodOpseg();
  const ispIds=new Set(O.filter(o=>o.datum>=od && o.datum<=doo).map(o=>o.id));
  const ST=STall.filter(s=>ispIds.has(s.isporuka_id));

  const nazivFirme={}; S.firme.forEach(f=>nazivFirme[f.id]={naziv:f.naziv,boja:f.boja||'#d82028'});

  // po firmi
  const poFirmi={};
  ST.forEach(s=>{const o=stById[s.isporuka_id];if(!o)return;
    const fid=o.firma_id||'nepoznato';
    if(!poFirmi[fid])poFirmi[fid]={kol:0,rev:0,dani:new Set()};
    poFirmi[fid].kol+=s.kolicina; poFirmi[fid].rev+=val(s); poFirmi[fid].dani.add(o.datum);});

  const ukPrihod=ST.reduce((a,s)=>a+val(s),0);
  const ukPorcija=ST.reduce((a,s)=>a+s.kolicina,0);
  const daniSet=new Set([...ispIds].map(id=>stById[id].datum));
  const prosekDan=daniSet.size?ukPrihod/daniSet.size:0;

  // prihod po danu (zbirno)
  const poDanu={};
  ST.forEach(s=>{const o=stById[s.isporuka_id];poDanu[o.datum]=(poDanu[o.datum]||0)+val(s);});
  const daniSort=Object.keys(poDanu).sort();

  // prihod po mesecu (ukupno, sve vreme)
  const poMesecu={};
  STall.forEach(s=>{const o=stById[s.isporuka_id];if(o){const m=o.datum.slice(0,7);poMesecu[m]=(poMesecu[m]||0)+val(s);}});
  const meseciSort=Object.keys(poMesecu).sort();

  const opisPeriod={dan:(ZB.dan&&ZB.dan!==danas())?datSr(ZB.dan):'Danas',nedelja:'Ova nedelja',mesec:'Ovaj mesec',sve:'Sve vreme',period:`${datSr(od)} – ${datSr(doo)}`}[ZB.period];

  const firmeLista=Object.entries(poFirmi).sort((a,b)=>b[1].rev-a[1].rev);

  setMain(`
    <div class="page-head">
      <div><h2>Zbirna statistika</h2><div class="desc">Svi klijenti — Vilara Partner Portal</div></div>
      <div class="ph-actions"><button class="btn btn-ghost" onclick="prikaziHub()">← Sve firme</button></div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px;padding:14px 18px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-weight:600;font-size:13px;color:var(--ink-2)">Period:</span>
        ${['dan','nedelja','mesec','sve','period'].map(p=>`<button class="sub-tab ${ZB.period===p?'on':''}" onclick="zbSetPeriod('${p}')">${({dan:'Dan',nedelja:'Nedelja',mesec:'Mesec',sve:'Sve',period:'Opseg'})[p]}</button>`).join('')}
        ${ZB.period==='dan'?`<input type="date" value="${ZB.dan||danas()}" onchange="ZB.dan=this.value;renderZbirno()" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;margin-left:8px">`:''}
        ${ZB.period==='period'?`<span style="display:inline-flex;gap:6px;align-items:center;margin-left:8px">
          <input type="date" value="${ZB.od||danas()}" onchange="ZB.od=this.value;renderZbirno()" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px">
          <span class="muted">→</span>
          <input type="date" value="${ZB.do||danas()}" onchange="ZB.do=this.value;renderZbirno()" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px">
        </span>`:''}
        <span style="margin-left:auto;font-weight:700;color:var(--gold-dk)">${opisPeriod}</span>
      </div>
    </div>

    ${!ST.length?`<div class="empty"><div class="big">📊</div><h3>Nema podataka za izabrani period</h3></div>`:`
    <div class="grid stat-grid" style="margin-bottom:20px">
      <div class="stat accent"><div class="lbl">Ukupan prihod (svi klijenti)</div><div class="val" style="font-size:24px">${fmt(ukPrihod)} <small>RSD</small></div><div style="font-size:11.5px;opacity:.6;margin-top:3px">${ukPorcija} porcija</div></div>
      <div class="stat"><div class="lbl">Prosek / dan</div><div class="val" style="font-size:22px">${fmt(prosekDan)} <small>RSD</small></div></div>
      <div class="stat"><div class="lbl">Aktivnih klijenata</div><div class="val">${firmeLista.length}</div></div>
      <div class="stat"><div class="lbl">Aktivnih dana</div><div class="val">${daniSet.size}</div></div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px">
      <h3 style="font-size:16px;margin-bottom:14px">Prihod po klijentu</h3>
      <div class="tbl-wrap" style="border:none"><table>
        <thead><tr><th>Klijent</th><th class="num">Porcija</th><th class="num">Dana</th><th class="num">Prihod</th><th style="width:26%">Udeo</th></tr></thead>
        <tbody>${firmeLista.map(([fid,d])=>{
          const f=nazivFirme[fid]||{naziv:'Nepoznato',boja:'#8b929c'};
          const pct=ukPrihod?Math.round(d.rev/ukPrihod*100):0;
          return `<tr>
            <td class="t-strong"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${f.boja};margin-right:7px"></span>${esc(f.naziv)}</td>
            <td class="num">${d.kol}</td>
            <td class="num muted">${d.dani.size}</td>
            <td class="num t-strong">${fmt(d.rev)} RSD</td>
            <td><div style="display:flex;align-items:center;gap:8px">
              <div style="flex:1;background:var(--cream);border-radius:6px;height:16px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:${f.boja};border-radius:6px"></div></div>
              <span class="muted" style="font-size:12px;min-width:32px">${pct}%</span></div></td>
          </tr>`;}).join('')}
        <tr style="background:var(--cream)"><td class="t-strong">UKUPNO</td><td class="num t-strong">${ukPorcija}</td><td class="num">${daniSet.size}</td><td class="num t-strong">${fmt(ukPrihod)} RSD</td><td></td></tr>
        </tbody></table></div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px">
      <h3 style="font-size:16px;margin-bottom:18px">Dnevni prihod (svi klijenti)</h3>
      ${moneyLineChart(daniSort.map(d=>({x:d,y:poDanu[d]})))}
    </div>

    ${meseciSort.length>1?`<div class="card card-pad">
      <h3 style="font-size:16px;margin-bottom:16px">Prihod po mesecima (ukupno)</h3>
      ${barChart(meseciSort.map(m=>({label:mesecNaziv(m),val:Math.round(poMesecu[m]),color:'#d82028',money:true})))}
    </div>`:''}
    `}`);
}

function firmaModal(f=null){
  const e=f||{naziv:'',slug:'',tip:'nedeljni',boja:'#2f5e7d'};
  openModal(f?'Izmena firme':'Nova firma',`
    <div class="inline-form">
      <div class="field"><label>Naziv firme</label><input id="f-naziv" value="${esc(e.naziv)}" placeholder="npr. Delta Holding"></div>
      <div class="field"><label>Skraćenica (slug)</label><input id="f-slug" value="${esc(e.slug)}" placeholder="npr. delta" ${f?'disabled style="opacity:.6"':''}></div>
      <div class="field-row">
        <div class="field"><label>Tip naručivanja</label><select id="f-tip">
          <option value="alacarte" ${e.tip==='alacarte'?'selected':''}>A la carte (kao Avala)</option>
          <option value="nedeljni" ${e.tip==='nedeljni'?'selected':''}>Nedeljni meni unapred</option>
        </select></div>
        <div class="field"><label>Boja</label><input id="f-boja" type="color" value="${e.boja||'#2f5e7d'}" style="height:42px;padding:4px"></div>
      </div>
      <p class="muted" style="font-size:12.5px">Napomena: modul za nedeljno naručivanje je u pripremi. Firme tog tipa se za sada mogu kreirati, ali njihov radni ekran dolazi kasnije.</p>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>
     <button class="btn btn-primary" onclick="sacuvajFirmu(${f?`'${f.id}'`:'null'})">Sačuvaj</button>`);
}
async function sacuvajFirmu(id){
  const naziv=val('f-naziv').trim();
  const slug=val('f-slug').trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  const tip=val('f-tip'), boja=val('f-boja');
  if(!naziv){toast('Unesite naziv.','err');return;}
  if(!id && !slug){toast('Unesite skraćenicu.','err');return;}
  if(id){
    await sb.from('av_firme').update({naziv,tip,boja}).eq('id',id);
  }else{
    const {error}=await sb.from('av_firme').insert({naziv,slug,tip,boja,aktivna:true});
    if(error){toast(error.message.includes('duplicate')?'Skraćenica već postoji.':'Greška pri čuvanju.','err');return;}
  }
  closeModal();toast('Firma sačuvana.','ok');
  await loadFirme();prikaziHub();
}

// horizontalni bar chart
function barChart(items){
  const max=Math.max(1,...items.map(i=>i.val));
  return items.map(it=>`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px">
        <span style="font-weight:600">${it.label}</span><span class="muted" style="font-weight:600">${it.money?fmt(it.val)+' RSD':it.val}</span></div>
      <div style="background:var(--cream);border-radius:7px;height:22px;overflow:hidden">
        <div style="width:${it.val/max*100}%;height:100%;background:${it.color};border-radius:7px;transition:.4s"></div></div>
    </div>`).join('');
}

// linijski chart za novac (RSD)
function moneyLineChart(points){
  if(!points.length)return '<p class="muted">Nema podataka.</p>';
  if(points.length===1){
    return `<div style="text-align:center;padding:20px"><div style="font-family:'Fraunces';font-size:32px;font-weight:600">${fmt(points[0].y)} RSD</div>
      <div class="muted">${datSr(points[0].x)}</div></div>`;
  }
  const W=720,H=210,pad=34,padL=54;
  const maxY=Math.max(...points.map(p=>p.y));
  const stepX=(W-padL-pad)/(points.length-1);
  const scaleY=v=>H-pad-(v/(maxY||1))*(H-pad*2);
  const coords=points.map((p,i)=>[padL+i*stepX,scaleY(p.y)]);
  const path=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=path+` L${coords[coords.length-1][0].toFixed(1)} ${H-pad} L${coords[0][0].toFixed(1)} ${H-pad} Z`;
  const kfmt=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':v;
  const showEvery=Math.ceil(points.length/12);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
    <defs><linearGradient id="lgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d82028" stop-opacity="0.16"/><stop offset="100%" stop-color="#d82028" stop-opacity="0"/></linearGradient></defs>
    ${[0,0.5,1].map(f=>{const y=H-pad-f*(H-pad*2);const v=Math.round(maxY*f);return `<line x1="${padL}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#e5e8ec" stroke-width="1"/><text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="10" fill="#8b929c">${kfmt(v)}</text>`;}).join('')}
    <path d="${area}" fill="url(#lgm)"/>
    <path d="${path}" fill="none" stroke="#d82028" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="#d82028"/>`).join('')}
    ${points.map((p,i)=>i%showEvery===0?`<text x="${(padL+i*stepX).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#8b929c">${p.x.slice(8)}.${p.x.slice(5,7)}.</text>`:'').join('')}
  </svg>`;
}

// stari linijski chart (za slučaj korišćenja drugde)
function lineChart(points){
  if(!points.length)return '<p class="muted">Nema podataka.</p>';
  if(points.length===1){
    return `<div style="text-align:center;padding:20px"><div class="val" style="font-family:'Fraunces';font-size:36px">${points[0].y}</div>
      <div class="muted">${datSr(points[0].x)}</div></div>`;
  }
  const W=720,H=200,pad=30;
  const maxY=Math.max(...points.map(p=>p.y));
  const stepX=(W-pad*2)/(points.length-1);
  const scaleY=v=>H-pad-(v/(maxY||1))*(H-pad*2);
  const coords=points.map((p,i)=>[pad+i*stepX,scaleY(p.y)]);
  const path=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=path+` L${coords[coords.length-1][0].toFixed(1)} ${H-pad} L${coords[0][0].toFixed(1)} ${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">

const ULOGE_OPIS={admin:'Administrator (sve firme, sve funkcije)',kuvar:'Kuhinja (jela, porudžbine)',direktor:'Direktor (statistika svih firmi)',klijent:'Klijent (naručivanje — vezan za firmu)'};
async function mu(action,payload={}){
  const {data,error}=await sb.functions.invoke('manage-users',{body:{action,...payload}});
  if(error){
    // pokušaj da pročitaš poruku iz tela
    let msg='Greška.';
    try{const ctx=await error.context?.json();if(ctx?.error)msg=ctx.error;}catch(e){}
    return {error:msg};
  }
  if(data?.error)return {error:data.error};
  return data;
}

async function sacuvajKorisnika(id){
  const btn=document.getElementById('k-save');btn.disabled=true;btn.textContent='Čuvam…';
  const ime=val('k-ime').trim(), uloga=val('k-uloga'), pass=val('k-pass');
  const firma_id = uloga==='klijent' ? (val('k-firma')||null) : null;
  if(uloga==='klijent' && !firma_id){
    toast('Za klijentski nalog izaberite firmu.','err');btn.disabled=false;btn.textContent='Sačuvaj';return;
  }
  let res;
  if(id){
    const payload={action:'update',id,ime,uloga,firma_id};
    if(pass)payload.password=pass;
    const akt=document.getElementById('k-aktivan');
    if(akt)payload.aktivan=akt.checked;
    res=await mu('update',payload);
  }else{
    const user=val('k-user').trim().toLowerCase();
    if(!user||!pass){toast('Korisničko ime i lozinka su obavezni.','err');btn.disabled=false;btn.textContent='Sačuvaj';return;}
    res=await mu('create',{korisnicko_ime:user,password:pass,ime,uloga,firma_id});
  }
  if(res.error){toast(res.error,'err');btn.disabled=false;btn.textContent='Sačuvaj';return;}
  closeModal();toast('Sačuvano.','ok');RENDER.korisnici();
}
async function obrisiKorisnika(id){
  if(!confirm('Obrisati ovaj nalog? Korisnik više neće moći da se prijavi.'))return;
  const res=await mu('delete',{id});
  if(res.error){toast(res.error,'err');return;}
  closeModal();toast('Nalog obrisan.','ok');RENDER.korisnici();
}

async function ucitajKatalog(){
  const [{data:jela},{data:cene},{data:tipovi}] = await Promise.all([

  openModal('Tipovi jela',`

        return `<div class="tip-red">

          <span class="muted" style="font-size:12px">${n} ${n===1?'jelo':'jela'}</span>
          <button class="btn btn-sm ${n?'btn-ghost':'btn-danger'}" ${n?'disabled title="Tip ima jela"':''} onclick="obrisiTipJela('${t.id}')">Obriši</button>

      }).join('')}
    </div>

      </div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Zatvori</button>`);

async function dodajTipJela(){
  const naziv=val('nt-naziv').trim();
  if(!naziv){toast('Unesite naziv tipa.','err');return;}
  const maxRed=Math.max(0,...KAT.tipovi.map(t=>t.redosled||0));
  const {error}=await sb.from('av_tipovi_jela').insert({naziv, redosled:maxRed+1});
  if(error){toast(error.message.includes('duplicate')?'Tip već postoji.':'Greška.','err');return;}
  toast('Tip dodat.','ok');
  await ucitajKatalog();
  closeModal();tipoviJelaModal();
}
async function obrisiTipJela(id){
  const ima=KAT.jela.some(j=>j.tip_id===id);
  if(ima){toast('Tip ima jela — prvo ih premesti.','err');return;}
  if(!confirm('Obrisati ovaj tip jela?'))return;
  await sb.from('av_tipovi_jela').delete().eq('id',id);
  toast('Tip obrisan.','ok');
  await ucitajKatalog();
  closeModal();tipoviJelaModal();
}

function ceneModal(j){
  const firme=firmeZaKatalog();
  openModal(`Cene — ${esc(j.naziv)}`,`
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:16px">Definiši cenu ovog jela za svaku firmu. Ostavi prazno ako firma ne dobija ovo jelo.</p>
    <div class="inline-form">

        </div>`;
      }).join('')}
    </div>`,

     <button class="btn btn-primary" onclick="sacuvajCene('${j.id}')">Sačuvaj cene</button>`);

async function sacuvajCene(jeloId){
  const firme=firmeZaKatalog();
  for(const f of firme){
    const el=document.getElementById('c-'+f.id);
    const raw=(el?.value||'').trim();
    if(raw===''){
      await sb.from('av_cene_firma').delete().eq('firma_id',f.id).eq('jelo_id',jeloId);
    }else{
      const cena=parseFloat(raw)||0;
      const {data:post}=await sb.from('av_cene_firma').select('id')
        .eq('firma_id',f.id).eq('jelo_id',jeloId).maybeSingle();
      if(post)await sb.from('av_cene_firma').update({cena}).eq('id',post.id);
      else await sb.from('av_cene_firma').insert({firma_id:f.id,jelo_id:jeloId,cena});
    }
  }
  closeModal();toast('Cene sačuvane.','ok');
  await ucitajKatalog();renderKatalog();
}

  const std=(JEL.tipovi||[]).find(t=>t.naziv.toLowerCase()==='standard');
  const e=j||{naziv:'',datum_od:'',datum_do:'',napomena:'',tip_id:(std?std.id:null)};
  _jelTip=e.tip_id||(std?std.id:null);
  openModal(j?'Izmena jelovnika':'Novi jelovnik',`
    <div class="inline-form">
      <div class="field"><label>Naziv jelovnika</label><input id="jv-naziv" value="${esc(e.naziv)}" placeholder="npr. Nedeljni meni — 20-24. jul"></div>
      <div class="field">
        <label style="display:flex;align-items:center">Tip jelovnika
          <button class="btn btn-sm btn-ghost" style="margin-left:auto;padding:3px 9px;font-size:12px" onclick="tipoviJelovnikaModal()">Uredi tipove</button>
        </label>
        <div class="chips" id="jv-tip-chips">
          ${(JEL.tipovi||[]).map(t=>`<div class="chip ${_jelTip===t.id?'on':''}" data-t="${t.id}" onclick="jelPickTip('${t.id}')">${esc(t.naziv)}</div>`).join('')}
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Od (ponedeljak)</label><input id="jv-od" type="date" value="${e.datum_od||''}"></div>
        <div class="field"><label>Do (petak)</label><input id="jv-do" type="date" value="${e.datum_do||''}"></div>
      </div>
      <div class="field"><label>Napomena (opciono)</label><input id="jv-nap" value="${esc(e.napomena||'')}"></div>
    </div>`,
    [j?`<button class="btn btn-danger" onclick="obrisiJelovnik('${j.id}')">Obriši</button>`:'',
     `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>`,
     `<button class="btn btn-primary" onclick="sacuvajJelovnik(${j?`'${j.id}'`:'null'})">Sačuvaj</button>`].join(''));
}
let _jelTip=null;
function jelPickTip(t){
  _jelTip=t;
  document.querySelectorAll('#jv-tip-chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.t===t));
}
async function sacuvajJelovnik(id){
  const rec={naziv:val('jv-naziv').trim(), tip_id:_jelTip||null, datum_od:val('jv-od')||null,
    datum_do:val('jv-do')||null, napomena:val('jv-nap').trim()||null};
  if(!rec.naziv){toast('Unesite naziv.','err');return;}
  let novId=id;
  if(id){await sb.from('av_jelovnici').update({...rec,updated_at:new Date().toISOString()}).eq('id',id);}
  else{
    const {data,error}=await sb.from('av_jelovnici').insert(rec).select().single();
    if(error){toast('Greška pri čuvanju.','err');return;}
    novId=data.id;
  }
  closeModal();toast('Sačuvano.','ok');
  await ucitajJelovnike();
  otvoriJelovnik(novId);
}

// ── UPRAVLJANJE TIPOVIMA JELOVNIKA ──
function tipoviJelovnikaModal(){
  const brojPoTipu={};
  JEL.lista.forEach(j=>{if(j.tip_id)brojPoTipu[j.tip_id]=(brojPoTipu[j.tip_id]||0)+1;});
  openModal('Tipovi jelovnika',`
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:14px">Tipovi jelovnika (Standard, Vegetarijanski…). Tip se ne može obrisati dok ima jelovnika.</p>
    <div class="tip-lista">
      ${(JEL.tipovi||[]).map(t=>{
        const n=brojPoTipu[t.id]||0;
        return `<div class="tip-red">
          <span class="tip-naziv"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${t.boja||'#2f3640'};margin-right:8px"></span>${esc(t.naziv)}</span>
          <span class="muted" style="font-size:12px">${n} ${n===1?'jelovnik':'jelovnika'}</span>
          <button class="btn btn-sm ${n?'btn-ghost':'btn-danger'}" ${n?'disabled title="Tip ima jelovnike"':''} onclick="obrisiTipJelovnika('${t.id}')">Obriši</button>
        </div>`;
      }).join('')}
    </div>
    <div class="field" style="margin-top:16px">
      <label>Novi tip</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="ntj-naziv" placeholder="npr. Posni" onkeydown="if(event.key==='Enter')dodajTipJelovnika()">
        <input id="ntj-boja" type="color" value="#2f3640" style="width:52px;height:42px;padding:4px">
        <button class="btn btn-primary" onclick="dodajTipJelovnika()">Dodaj</button>
      </div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Zatvori</button>`);
}
async function dodajTipJelovnika(){
  const naziv=val('ntj-naziv').trim();
  const boja=val('ntj-boja');
  if(!naziv){toast('Unesite naziv tipa.','err');return;}
  const maxRed=Math.max(0,...(JEL.tipovi||[]).map(t=>t.redosled||0));
  const {error}=await sb.from('av_tipovi_jelovnika').insert({naziv, boja, redosled:maxRed+1});
  if(error){toast(error.message.includes('duplicate')?'Tip već postoji.':'Greška.','err');return;}
  toast('Tip dodat.','ok');
  await ucitajJelovnike();
  closeModal();tipoviJelovnikaModal();
}
async function obrisiTipJelovnika(id){
  const ima=JEL.lista.some(j=>j.tip_id===id);
  if(ima){toast('Tip ima jelovnike — prvo ih premesti.','err');return;}
  if(!confirm('Obrisati ovaj tip jelovnika?'))return;
  await sb.from('av_tipovi_jelovnika').delete().eq('id',id);
  toast('Tip obrisan.','ok');
  await ucitajJelovnike();
  closeModal();tipoviJelovnikaModal();
}
async function obrisiJelovnik(id){
  if(!confirm('Obrisati jelovnik?'))return;
  await sb.from('av_jelovnici').delete().eq('id',id);
  closeModal();toast('Obrisano.','ok');
  JEL.aktivan=null;
  await ucitajJelovnike();renderJelovnici();
}
async function otvoriJelovnik(id){
  loading();
  JEL.aktivan=JEL.lista.find(x=>x.id===id);
  if(!JEL.aktivan){await ucitajJelovnike();JEL.aktivan=JEL.lista.find(x=>x.id===id);}
  const {data:st}=await sb.from('av_jelovnik_stavke').select('*').eq('jelovnik_id',id).order('dan').order('redosled');
  JEL.stavke=st||[];
  renderJelovnikDetalj();
}
function renderJelovnikDetalj(){
  const j=JEL.aktivan;
  const firmeId=JEL.firmePoJelovniku[j.id]||[];
  const firme=firmeId.map(fid=>S.firme.find(f=>f.id===fid)).filter(Boolean);
  const jeloById={}; KAT.jela.forEach(x=>jeloById[x.id]=x);
  const poslat=j.status==='poslat';
  const tip=tipJelovnika(j.tip_id);
  const q=(JEL._pretraga||'').trim().toLowerCase();
  const paleta=KAT.jela.filter(x=>x.aktivno && (!q || x.naziv.toLowerCase().includes(q)));

  setMain(`
    <div class="page-head">
      <div><h2>${esc(j.naziv)}</h2>
        <div class="desc">
          <span class="tag" style="background:${tip.boja};color:#fff;margin-right:7px">${tip.naziv}</span>
          ${j.datum_od?`${datSr(j.datum_od)} – ${datSr(j.datum_do||j.datum_od)}`:'Nedeljni jelovnik'} · ${JEL.stavke.length} ${JEL.stavke.length===1?'stavka':'stavki'}</div></div>
      <div class="ph-actions">
        <button class="btn btn-ghost" onclick="JEL.aktivan=null;renderJelovnici()">← Svi jelovnici</button>
        <button class="btn btn-ghost" onclick='jelovnikModal(${JSON.stringify(j).replace(/'/g,"&#39;")})'>Uredi</button>
        <button class="btn btn-ghost" onclick="stampajJelovnik()">Štampaj</button>
        <button class="btn btn-primary" onclick="posaljiJelovnikModal()">${poslat?'Izmeni primaoce':'Pošalji firmama'}</button>
      </div>
    </div>

    <div class="jel-status ${poslat?'poslat':'nacrt'}">
      <div class="js-badge">${poslat?'POSLAT':'NACRT'}</div>
      <div class="js-txt">
        ${poslat
          ? `<b>Jelovnik je poslat</b><span>Vidljiv firmama: ${firme.map(f=>esc(f.naziv)).join(', ')}</span>`
          : `<b>Radna verzija (nacrt)</b><span>Firme još ne vide ovaj jelovnik. Sve izmene se čuvaju automatski.</span>`}
      </div>
      <div class="js-akcije">
        ${firme.length?firme.map(f=>`<span class="tag tag-gray"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${f.boja||'#8b929c'};margin-right:5px"></span>${esc(f.naziv)}</span>`).join(''):''}
        ${poslat?`<button class="btn btn-sm btn-ghost" onclick="vratiUNacrt()">Vrati u nacrt</button>`:''}
      </div>
    </div>

    <div class="jel-builder">
      <!-- PALETA: katalog jela -->
      <div class="jel-paleta">
        <div class="jp-head">
          <h3>Katalog jela</h3>
          <p>Prevuci jelo u dan, ili klikni „+" na danu</p>
          <input id="jp-search" placeholder="Pretraži jela…" value="${esc(JEL._pretraga||'')}" oninput="jelPretraga(this.value)">
        </div>
        <div class="jp-lista">
          ${!KAT.jela.length?`<div class="dan-prazno">Katalog je prazan.<br><b onclick="go('katalog')" style="cursor:pointer;text-decoration:underline">Dodaj jela</b></div>`:
            !paleta.length?`<div class="dan-prazno">Nema rezultata</div>`:
            [...KAT.tipovi.map(t=>({t, l:paleta.filter(x=>x.tip_id===t.id)})),
              {t:{id:null,naziv:'Bez tipa'}, l:paleta.filter(x=>!x.tip_id)}]
             .filter(g=>g.l.length).map(({t,l})=>{
              return `<div class="jp-kat">${esc(t.naziv)}</div>
                ${l.map(x=>`<div class="jp-jelo" draggable="true"
                    ondragstart="jelDragStart(event,'${x.id}')" ondragend="jelDragEnd(event)">
                  <span class="jp-grip">⋮⋮</span>
                  <span class="jp-naziv">${esc(x.naziv)}</span>
                </div>`).join('')}`;
            }).join('')}
        </div>
      </div>

      <!-- DANI: drop zone -->
      <div class="dani-grid">
        ${DANI.map(d=>{
          const st=JEL.stavke.filter(s=>s.dan===d.n);
          return `<div class="dan-kol" data-dan="${d.n}"
              ondragover="jelDragOver(event,${d.n})" ondragleave="jelDragLeave(event)" ondrop="jelDrop(event,${d.n})">
            <div class="dan-h">${d.naziv}<span class="dan-ct">${st.length}</span></div>
            <div class="dan-body">
              ${st.length?st.map(s=>{
                const jel=jeloById[s.jelo_id];
                if(!jel)return '';
                return `<div class="dan-jelo">
                  <div class="dj-txt"><b>${esc(jel.naziv)}</b><span>${tipJelaNaziv(jel.tip_id)}</span></div>
                  <button class="dj-x" onclick="ukloniIzJelovnika('${s.id}')">✕</button>
                </div>`;
              }).join(''):'<div class="dan-prazno dan-drop-hint">Prevuci jelo ovde</div>'}
            </div>

          </div>`;
        }).join('')}
      </div>
    </div>`);
}
// ── pretraga u paleti ──
function jelPretraga(v){
  JEL._pretraga=v;
  renderJelovnikDetalj();
  const inp=document.getElementById('jp-search');
  if(inp){inp.focus();const t=inp.value;inp.value='';inp.value=t;}
}
// ── drag & drop ──
let _dragJelo=null;
function jelDragStart(e,jeloId){
  _dragJelo=jeloId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='copy';
  try{e.dataTransfer.setData('text/plain',jeloId);}catch(err){}
}
function jelDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.dan-kol.over').forEach(x=>x.classList.remove('over'));
  _dragJelo=null;
}
function jelDragOver(e,dan){
  e.preventDefault();
  e.dataTransfer.dropEffect='copy';
  e.currentTarget.classList.add('over');
}
function jelDragLeave(e){
  // ukloni samo ako stvarno napuštamo kolonu (ne prelazak na dete)
  if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('over');
}
async function jelDrop(e,dan){
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  const jeloId=_dragJelo || (()=>{try{return e.dataTransfer.getData('text/plain');}catch(err){return null;}})();
  if(!jeloId)return;
  // već postoji u tom danu?
  if(JEL.stavke.some(s=>s.dan===dan && s.jelo_id===jeloId)){
    toast('Jelo je već dodato u taj dan.','err');return;
  }
  const maxRed=Math.max(0,...JEL.stavke.filter(s=>s.dan===dan).map(s=>s.redosled));
  const {error}=await sb.from('av_jelovnik_stavke')
    .insert({jelovnik_id:JEL.aktivan.id, dan, jelo_id:jeloId, redosled:maxRed+1});
  if(error){toast('Greška pri dodavanju.','err');return;}
  const jel=KAT.jela.find(x=>x.id===jeloId);
  toast(`${jel?jel.naziv:'Jelo'} → ${DANI.find(d=>d.n===dan).naziv}`,'ok');
  await otvoriJelovnik(JEL.aktivan.id);
}
function dodajUJelovnikModal(dan){
  const danNaziv=DANI.find(d=>d.n===dan).naziv;
  const vecDodato=new Set(JEL.stavke.filter(s=>s.dan===dan).map(s=>s.jelo_id));
  const dostupna=KAT.jela.filter(j=>j.aktivno && !vecDodato.has(j.id));
  if(!KAT.jela.length){toast('Katalog jela je prazan.','err');return;}
  openModal(`${danNaziv} — dodaj jela`,`
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:14px">Izaberi jedno ili više jela (opcije koje firma bira tog dana).</p>
    ${!dostupna.length?'<div class="cart-empty" style="padding:24px">Sva jela iz kataloga su već dodata za ovaj dan.</div>':
    `<div class="jel-izbor">
      ${[...KAT.tipovi.map(t=>({t, l:dostupna.filter(j=>j.tip_id===t.id)})),
          {t:{id:null,naziv:'Bez tipa'}, l:dostupna.filter(j=>!j.tip_id)}]
         .filter(g=>g.l.length).map(({t,l})=>{
        return `<div class="ji-kat">${esc(t.naziv)}</div>
          ${l.map(j=>`<label class="ji-item">
            <input type="checkbox" value="${j.id}" style="width:auto;margin-right:9px">
            <span><b>${esc(j.naziv)}</b>${j.opis?`<small>${esc(j.opis)}</small>`:''}</span>
          </label>`).join('')}`;
      }).join('')}
    </div>`}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>
     ${dostupna.length?`<button class="btn btn-primary" onclick="dodajUJelovnik(${dan})">Dodaj izabrano</button>`:''}`);
}
async function dodajUJelovnik(dan){
  const izabrani=[...document.querySelectorAll('.jel-izbor input:checked')].map(c=>c.value);
  if(!izabrani.length){toast('Izaberite bar jedno jelo.','err');return;}
  const maxRed=Math.max(0,...JEL.stavke.filter(s=>s.dan===dan).map(s=>s.redosled));
  const rows=izabrani.map((jid,ix)=>({jelovnik_id:JEL.aktivan.id, dan, jelo_id:jid, redosled:maxRed+ix+1}));
  const {error}=await sb.from('av_jelovnik_stavke').insert(rows);
  if(error){toast('Greška pri dodavanju.','err');return;}
  closeModal();toast(`Dodato ${izabrani.length} ${izabrani.length===1?'jelo':'jela'}.`,'ok');
  await otvoriJelovnik(JEL.aktivan.id);
}
async function ukloniIzJelovnika(stavkaId){
  await sb.from('av_jelovnik_stavke').delete().eq('id',stavkaId);
  toast('Uklonjeno.','ok');
  await otvoriJelovnik(JEL.aktivan.id);
}
// ── slanje firmama ──
function posaljiJelovnikModal(){
  const firme=firmeZaKatalog();
  if(!firme.length){toast('Nema firmi koje koriste jelovnike.','err');return;}
  if(!JEL.stavke.length){toast('Jelovnik je prazan — dodaj jela pre slanja.','err');return;}
  const vec=new Set(JEL.firmePoJelovniku[JEL.aktivan.id]||[]);
  openModal('Pošalji jelovnik',`
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:16px">Izaberi firme kojima ovaj jelovnik ide. Firme vide samo jelovnike koji su im poslati.</p>
    <div class="jel-izbor" id="posalji-firme">
      ${firme.map(f=>`<label class="ji-item">
        <input type="checkbox" value="${f.id}" ${vec.has(f.id)?'checked':''} style="width:auto;margin-right:9px">
        <span><b><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${f.boja||'#8b929c'};margin-right:6px"></span>${esc(f.naziv)}</b></span>
      </label>`).join('')}
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>
     <button class="btn btn-primary" onclick="posaljiJelovnik()">Pošalji</button>`);
}
async function posaljiJelovnik(){
  const izabrane=[...document.querySelectorAll('#posalji-firme input:checked')].map(c=>c.value);
  const jid=JEL.aktivan.id;
  // obriši stare veze, upiši nove
  await sb.from('av_jelovnik_firme').delete().eq('jelovnik_id',jid);
  if(izabrane.length){
    await sb.from('av_jelovnik_firme').insert(izabrane.map(fid=>({jelovnik_id:jid, firma_id:fid})));
  }
  await sb.from('av_jelovnici').update({status:izabrane.length?'poslat':'nacrt',updated_at:new Date().toISOString()}).eq('id',jid);
  closeModal();
  toast(izabrane.length?`Poslato: ${izabrane.length} ${izabrane.length===1?'firma':'firme'}.`:'Slanje poništeno.','ok');
  await ucitajJelovnike();
  JEL.aktivan=JEL.lista.find(x=>x.id===jid);
  renderJelovnikDetalj();
}
// ── vrati poslat jelovnik u nacrt (povuci od firmi) ──
async function vratiUNacrt(){
  if(!confirm('Vratiti jelovnik u nacrt? Firme ga više neće videti dok ga ponovo ne pošalješ.'))return;
  const jid=JEL.aktivan.id;
  await sb.from('av_jelovnik_firme').delete().eq('jelovnik_id',jid);
  await sb.from('av_jelovnici').update({status:'nacrt',updated_at:new Date().toISOString()}).eq('id',jid);
  toast('Vraćeno u nacrt.','ok');
  await ucitajJelovnike();
  JEL.aktivan=JEL.lista.find(x=>x.id===jid);
  renderJelovnikDetalj();
}
// ── štampa jelovnika ──
function stampajJelovnik(){
  const j=JEL.aktivan;
  if(!JEL.stavke.length){toast('Jelovnik je prazan.','err');return;}
  const jeloById={}; KAT.jela.forEach(x=>jeloById[x.id]=x);
  let body=`
    <div class="rep-head">
      <div class="brand">VILARA KETERING<small>Nedeljni jelovnik — ${tipJelovnika(j.tip_id).naziv}</small></div>
      <div class="datum"><b>${esc(j.naziv)}</b>${j.datum_od?`<br>${datSr(j.datum_od)} – ${datSr(j.datum_do||j.datum_od)}`:''}</div>
    </div>
    <div class="meta">${j.napomena?esc(j.napomena):'Izbor jela po danima'}</div>`;
  DANI.forEach(d=>{
    const st=JEL.stavke.filter(s=>s.dan===d.n);
    body+=`<div class="odsek"><div class="odsek-h hirurgija">${d.naziv}</div><div class="obrok-blok">`;
    if(st.length){
      body+=`<table><tbody>`;
      [...KAT.tipovi.map(t=>({t, l:st.map(s=>jeloById[s.jelo_id]).filter(x=>x&&x.tip_id===t.id)})),
       {t:{id:null,naziv:'Ostalo'}, l:st.map(s=>jeloById[s.jelo_id]).filter(x=>x&&!x.tip_id)}]
      .filter(g=>g.l.length).forEach(({t,l})=>{
        body+=`<tr><td style="width:130px;color:#6b727c;font-size:11px;text-transform:uppercase;font-weight:700">${esc(t.naziv)}</td>
          <td>${l.map(x=>esc(x.naziv)).join('<br>')}</td></tr>`;
      });
      body+=`</tbody></table>`;
    }else{
      body+=`<div style="padding:12px 14px;color:#aaa;font-style:italic;font-size:12.5px">Nema jela</div>`;
    }
    body+=`</div></div>`;
  });
  body+=`<div class="foot"><span>Vilara Ketering d.o.o.</span><span>${esc(j.naziv)}</span></div>`;
  otvoriStampu('Jelovnik — '+j.naziv, body);
}

//  KETERING — otpremnice, artikli, klijenti
// ══════════════════════════════════════════════════════════
const KET_KATEGORIJE=['hladno','toplo','salata','posno','pecivo','dezert','pice','ostalo'];
const KET_KAT_NAZIV={hladno:'Hladni bife',toplo:'Topla jela',salata:'Salate',posno:'Posno',
  pecivo:'Peciva',dezert:'Dezerti',pice:'Piće',ostalo:'Ostalo'};
const JEDINICE=['kg','kom','l','porcija'];
const PLACANJE=['virman','gotovina','kartica'];
let KET={lista:[], artikli:[], klijenti:[], aktivan:null, stavke:[], pogled:'lista'};

RENDER.ketering = async function(){
  loading();
  await ucitajKetering();
  KET.aktivan=null; KET.pogled='lista';
  renderKetering();
};
async function ucitajKetering(){
  const [{data:lista},{data:artikli},{data:klijenti}] = await Promise.all([
    sb.from('av_keteringi').select('*').order('datum',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('av_ket_artikli').select('*').order('kategorija').order('naziv'),
    sb.from('av_ket_klijenti').select('*').order('naziv')
  ]);
  KET.lista=lista||[]; KET.artikli=artikli||[]; KET.klijenti=klijenti||[];
}
function renderKetering(){
  if(KET.aktivan){renderKeteringDetalj();return;}
  if(KET.pogled==='artikli'){renderKetArtikli();return;}
  if(KET.pogled==='klijenti'){renderKetKlijenti();return;}
  // ── ISTORIJA KETERINGA ──
  const ukupno=(k)=>0; // izračunavamo po otvaranju
  setMain(`
    <div class="page-head">
      <div><h2>Ketering</h2><div class="desc">Otpremnice i ponude za događaje</div></div>
      <div class="ph-actions">
        <button class="btn btn-ghost" onclick="prikaziHub()">← Sve firme</button>
        <button class="btn btn-ghost" onclick="KET.pogled='klijenti';renderKetering()">Klijenti</button>
        <button class="btn btn-ghost" onclick="KET.pogled='artikli';renderKetering()">Artikli</button>
        <button class="btn btn-primary" onclick="ketNoviModal()">+ Novi ketering</button>
      </div>
    </div>
    ${!KET.artikli.length?`<div class="card card-pad" style="margin-bottom:16px;border-color:#eccab5">
      <p style="font-size:13.5px;color:var(--ink-2)">Baza artikala je prazna. Dodaj artikle preko dugmeta „Artikli".</p>
    </div>`:''}
    ${!KET.lista.length?`<div class="empty"><div class="big">🍽️</div><h3>Nema keteringa</h3><p>Kreiraj prvu otpremnicu.</p></div>`:
    `<div class="grid" style="gap:12px">${KET.lista.map(k=>{
      const st={nacrt:'tag-info',potvrdjen:'tag-ok',isporucen:'tag-gray'}[k.status]||'tag-gray';
      const stn={nacrt:'Nacrt',potvrdjen:'Potvrđen',isporucen:'Isporučen'}[k.status]||k.status;
      return `<div class="card jelovnik-red ${k.status==='nacrt'?'nacrt':'poslat'}" onclick="otvoriKetering('${k.id}')">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="min-width:0">
            <h3 style="font-size:16px;font-family:'Inter';font-weight:700">${esc(k.firma_naziv)}</h3>
            <div class="muted" style="font-size:12.5px;margin-top:4px">
              ${k.broj?`<b>${esc(k.broj)}</b> · `:''}${datSr(k.datum)}
              ${k.broj_osoba?` · ${k.broj_osoba} osoba`:''}
              ${k.vreme_komitent?` · isporuka ${esc(k.vreme_komitent)}`:''}</div>
          </div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
            <span class="tag ${st} tag-dot">${stn}</span>
          </div>
        </div>
      </div>`;
    }).join('')}</div>`}`);
}

// ── NOVI / IZMENA KETERINGA (zaglavlje) ──
function ketNoviModal(k=null){
  const e=k||{broj:'',datum:danas(),vreme_kuhinja:'',vreme_komitent:'',adresa_isporuke:'',
    broj_osoba:'',klijent_id:'',firma_naziv:'',kontakt_osoba:'',kontakt_telefon:'',placanje:'virman',napomena:''};
  openModal(k?'Izmena keteringa':'Novi ketering',`
    <div class="inline-form">
      <div class="field">
        <label>Klijent</label>
        <select id="k-klijent" onchange="ketKlijentPromena(this.value)">
          <option value="">— novi klijent (upiši ručno) —</option>
          ${KET.klijenti.map(c=>`<option value="${c.id}" ${e.klijent_id===c.id?'selected':''}>${esc(c.naziv)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Naziv firme</label><input id="k-firma" value="${esc(e.firma_naziv)}" placeholder="npr. Miross"></div>
      <div class="field-row">
        <div class="field"><label>Kontakt osoba</label><input id="k-kontakt" value="${esc(e.kontakt_osoba||'')}"></div>
        <div class="field"><label>Telefon</label><input id="k-tel" value="${esc(e.kontakt_telefon||'')}"></div>
      </div>
      <div class="field" id="k-sacuvaj-wrap" style="display:${e.klijent_id?'none':'block'}">
        <label><input type="checkbox" id="k-sacuvaj-klijenta" style="width:auto;margin-right:6px"> Sačuvaj klijenta za ubuduće</label>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:6px 0 10px">
      <div class="field-row">
        <div class="field"><label>Broj otpremnice</label><input id="k-broj" value="${esc(e.broj||'')}" placeholder="npr. 2503/1/2026"></div>
        <div class="field"><label>Datum</label><input id="k-datum" type="date" value="${e.datum||danas()}"></div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Vreme (kuhinja)</label><input id="k-vk" value="${esc(e.vreme_kuhinja||'')}" placeholder="npr. 11:00"></div>
        <div class="field"><label>Vreme (komitent)</label><input id="k-vkom" value="${esc(e.vreme_komitent||'')}" placeholder="npr. 14:00"></div>
        <div class="field"><label>Broj osoba</label><input id="k-osoba" type="number" value="${e.broj_osoba||''}"></div>
      </div>
      <div class="field"><label>Adresa isporuke</label><input id="k-adresa" value="${esc(e.adresa_isporuke||'')}"></div>
      <div class="field"><label>Plaćanje</label><select id="k-placanje">
        ${PLACANJE.map(p=>`<option value="${p}" ${e.placanje===p?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('')}
      </select></div>
      <div class="field"><label>Napomena</label><input id="k-nap" value="${esc(e.napomena||'')}"></div>
    </div>`,
    [k?`<button class="btn btn-danger" onclick="obrisiKetering('${k.id}')">Obriši</button>`:'',
     `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>`,
     `<button class="btn btn-primary" onclick="sacuvajKetering(${k?`'${k.id}'`:'null'})">Sačuvaj</button>`].join(''));
}
function ketKlijentPromena(kid){
  const w=document.getElementById('k-sacuvaj-wrap');
  if(!kid){ if(w)w.style.display='block'; return; }
  if(w)w.style.display='none';
  const c=KET.klijenti.find(x=>x.id===kid);
  if(!c)return;
  document.getElementById('k-firma').value=c.naziv||'';
  document.getElementById('k-kontakt').value=c.kontakt_osoba||'';
  document.getElementById('k-tel').value=c.telefon||'';
  if(c.adresa)document.getElementById('k-adresa').value=c.adresa;
}
async function sacuvajKetering(id){
  const klijent_id=val('k-klijent')||null;
  const firma_naziv=val('k-firma').trim();
  if(!firma_naziv){toast('Unesite naziv firme.','err');return;}
  const rec={
    broj:val('k-broj').trim()||null, datum:val('k-datum')||danas(),
    vreme_kuhinja:val('k-vk').trim()||null, vreme_komitent:val('k-vkom').trim()||null,
    adresa_isporuke:val('k-adresa').trim()||null,
    broj_osoba:parseInt(val('k-osoba'))||null,
    klijent_id, firma_naziv,
    kontakt_osoba:val('k-kontakt').trim()||null,
    kontakt_telefon:val('k-tel').trim()||null,
    placanje:val('k-placanje'), napomena:val('k-nap').trim()||null
  };
  // sačuvaj novog klijenta ako je čekirano
  const cb=document.getElementById('k-sacuvaj-klijenta');
  if(!klijent_id && cb?.checked){
    const {data:nk}=await sb.from('av_ket_klijenti').insert({
      naziv:firma_naziv, kontakt_osoba:rec.kontakt_osoba, telefon:rec.kontakt_telefon,
      adresa:rec.adresa_isporuke
    }).select().single();
    if(nk)rec.klijent_id=nk.id;
  }
  let novId=id;
  if(id){await sb.from('av_keteringi').update({...rec,updated_at:new Date().toISOString()}).eq('id',id);}
  else{
    const {data,error}=await sb.from('av_keteringi').insert(rec).select().single();
    if(error){toast('Greška pri čuvanju.','err');return;}
    novId=data.id;
  }
  closeModal();toast('Sačuvano.','ok');
  await ucitajKetering();
  otvoriKetering(novId);
}
async function obrisiKetering(id){
  if(!confirm('Obrisati ovaj ketering?'))return;
  await sb.from('av_keteringi').delete().eq('id',id);
  closeModal();toast('Obrisano.','ok');
  KET.aktivan=null;
  await ucitajKetering();renderKetering();
}
async function otvoriKetering(id){
  loading();
  await ucitajKetering();
  KET.aktivan=KET.lista.find(x=>x.id===id);
  if(!KET.aktivan){renderKetering();return;}
  const {data:st}=await sb.from('av_ket_stavke').select('*').eq('ketering_id',id).order('redosled');
  KET.stavke=st||[];
  renderKeteringDetalj();
}
// ── DETALJ KETERINGA (stavke) ──
function renderKeteringDetalj(){
  const k=KET.aktivan;
  const ukupno=KET.stavke.reduce((a,s)=>a+Number(s.kolicina)*Number(s.cena),0);
  const stn={nacrt:'Nacrt',potvrdjen:'Potvrđen',isporucen:'Isporučen'}[k.status];
  const stc={nacrt:'tag-info',potvrdjen:'tag-ok',isporucen:'tag-gray'}[k.status];
  setMain(`
    <div class="page-head">
      <div><h2>${esc(k.firma_naziv)}</h2>
        <div class="desc">${k.broj?`<b>${esc(k.broj)}</b> · `:''}${datSr(k.datum)}${k.broj_osoba?` · ${k.broj_osoba} osoba`:''}</div></div>
      <div class="ph-actions">
        <button class="btn btn-ghost" onclick="KET.aktivan=null;renderKetering()">← Svi keteringi</button>
        <button class="btn btn-ghost" onclick='ketNoviModal(${JSON.stringify(k).replace(/'/g,"&#39;")})'>Uredi podatke</button>
        <button class="btn btn-ghost" onclick="stampajKetering()">Otpremnica</button>
        <button class="btn btn-ghost" onclick="stampajKetNalog()">Nalog (bez cena)</button>
        <button class="btn btn-primary" onclick="ketStatusModal()">${stn}</button>
      </div>
    </div>

    <div class="ket-info">
      <div class="ki-red"><span>Datum</span><b>${datSr(k.datum)}</b></div>
      <div class="ki-red"><span>Vreme kuhinje</span><b>${esc(k.vreme_kuhinja||'—')}</b></div>
      <div class="ki-red"><span>Vreme komitentu</span><b>${esc(k.vreme_komitent||'—')}</b></div>
      <div class="ki-red"><span>Broj osoba</span><b>${k.broj_osoba||'—'}</b></div>
      <div class="ki-red"><span>Kontakt</span><b>${esc(k.kontakt_osoba||'—')}${k.kontakt_telefon?`<br><span style="font-weight:400;color:var(--ink-3)">${esc(k.kontakt_telefon)}</span>`:''}</b></div>
      <div class="ki-red"><span>Plaćanje</span><b>${esc(k.placanje||'—')}</b></div>
      ${k.adresa_isporuke?`<div class="ki-red" style="grid-column:1/-1"><span>Adresa isporuke</span><b>${esc(k.adresa_isporuke)}</b></div>`:''}
      <div class="ki-red total"><span>UKUPAN IZNOS</span><b>${fmt(ukupno)} RSD</b></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="cart-head" style="border-bottom:1px solid var(--line)">
        <h3 style="font-size:16px">Stavke (${KET.stavke.length})</h3>
        <div style="margin-left:auto"><span class="tag ${stc} tag-dot">${stn}</span></div>
      </div>
      ${KET.stavke.length?`<div class="tbl-wrap" style="border:none"><table>
        <thead><tr><th style="width:32px">#</th><th>Artikal</th><th style="width:130px">Količina</th><th style="width:110px" class="num">Cena</th><th style="width:110px" class="num">Iznos</th><th style="width:40px"></th></tr></thead>
        <tbody>${KET.stavke.map((s,ix)=>`<tr>
          <td class="muted">${ix+1}</td>
          <td class="t-strong">${esc(s.naziv)}</td>
          <td><div style="display:flex;align-items:center;gap:5px">
            <input type="number" step="0.1" value="${s.kolicina}" onchange="ketStavkaIzmena('${s.id}','kolicina',this.value)"
              style="width:65px;padding:5px 7px;border:1.5px solid var(--line);border-radius:6px;text-align:right">
            <span class="muted" style="font-size:12px">${esc(s.jedinica)}</span></div></td>
          <td class="num"><input type="number" step="1" value="${s.cena}" onchange="ketStavkaIzmena('${s.id}','cena',this.value)"
              style="width:85px;padding:5px 7px;border:1.5px solid var(--line);border-radius:6px;text-align:right"></td>
          <td class="num t-strong">${fmt(Number(s.kolicina)*Number(s.cena))}</td>
          <td class="num"><button class="btn btn-sm btn-danger" onclick="ukloniKetStavku('${s.id}')">✕</button></td>
        </tr>`).join('')}</tbody>
        <tfoot><tr style="background:var(--cream)">
          <td colspan="4" class="t-strong">UKUPNO</td>
          <td class="num t-strong" style="font-size:15px">${fmt(ukupno)}</td><td></td></tr></tfoot>
      </table></div>`:'<div class="cart-empty" style="padding:30px">Nema stavki. Dodaj artikle ispod.</div>'}
      <div class="cart-foot" style="border-top:1px solid var(--line)">
        <button class="btn btn-primary btn-block" onclick="ketDodajStavkuModal()">+ Dodaj artikal</button>
      </div>
    </div>`);
}
async function ketStavkaIzmena(sid,polje,vrednost){
  const v=parseFloat(vrednost)||0;
  await sb.from('av_ket_stavke').update({[polje]:v}).eq('id',sid);
  const s=KET.stavke.find(x=>x.id===sid);
  if(s)s[polje]=v;
  renderKeteringDetalj();
}
async function ukloniKetStavku(sid){
  await sb.from('av_ket_stavke').delete().eq('id',sid);
  toast('Uklonjeno.','ok');
  await otvoriKetering(KET.aktivan.id);
}
function ketDodajStavkuModal(){
  if(!KET.artikli.length){toast('Baza artikala je prazna.','err');return;}
  const vec=new Set(KET.stavke.map(s=>s.artikl_id).filter(Boolean));
  const dostupni=KET.artikli.filter(a=>a.aktivan && !vec.has(a.id));
  openModal('Dodaj artikle',`
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:14px">Izaberi artikle. Količinu i cenu podešavaš posle dodavanja.</p>
    ${!dostupni.length?'<div class="cart-empty" style="padding:24px">Svi artikli su već dodati.</div>':
    `<div class="jel-izbor" id="ket-izbor">
      ${KET_KATEGORIJE.map(kk=>{
        const l=dostupni.filter(a=>a.kategorija===kk);
        if(!l.length)return'';
        return `<div class="ji-kat">${KET_KAT_NAZIV[kk]}</div>
          ${l.map(a=>`<label class="ji-item">
            <input type="checkbox" value="${a.id}" style="width:auto;margin-right:9px">
            <span><b>${esc(a.naziv)}</b><small>${fmt(a.cena)} RSD / ${esc(a.jedinica)}</small></span>
          </label>`).join('')}`;
      }).join('')}
    </div>`}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>
     ${dostupni.length?'<button class="btn btn-primary" onclick="ketDodajStavke()">Dodaj izabrano</button>':''}`);
}
async function ketDodajStavke(){
  const izabrani=[...document.querySelectorAll('#ket-izbor input:checked')].map(c=>c.value);
  if(!izabrani.length){toast('Izaberite bar jedan artikal.','err');return;}
  const maxRed=Math.max(0,...KET.stavke.map(s=>s.redosled));
  const rows=izabrani.map((aid,ix)=>{
    const a=KET.artikli.find(x=>x.id===aid);
    return {ketering_id:KET.aktivan.id, artikl_id:aid, naziv:a.naziv,
      kolicina:1, jedinica:a.jedinica, cena:Number(a.cena), redosled:maxRed+ix+1};
  });
  const {error}=await sb.from('av_ket_stavke').insert(rows);
  if(error){toast('Greška.','err');return;}
  closeModal();toast(`Dodato ${izabrani.length}.`,'ok');
  await otvoriKetering(KET.aktivan.id);
}
function ketStatusModal(){
  const k=KET.aktivan;
  openModal('Status keteringa',`
    <div class="inline-form">
      ${[['nacrt','Nacrt','Radna verzija'],['potvrdjen','Potvrđen','Klijent je potvrdio'],['isporucen','Isporučen','Ketering je isporučen']]
        .map(([v,n,o])=>`<button class="btn ${k.status===v?'btn-primary':'btn-ghost'} btn-block"
          style="justify-content:flex-start;text-align:left;padding:13px 16px" onclick="ketPostaviStatus('${v}')">
          <div><div style="font-size:14.5px">${n}</div><div style="font-size:12px;opacity:.7;font-weight:400">${o}</div></div>
        </button>`).join('')}
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Zatvori</button>`);
}
async function ketPostaviStatus(status){
  await sb.from('av_keteringi').update({status,updated_at:new Date().toISOString()}).eq('id',KET.aktivan.id);
  closeModal();toast('Status ažuriran.','ok');
  await otvoriKetering(KET.aktivan.id);
}

// ── ARTIKLI KETERINGA (samo unutar keteringa) ──

  setMain(`
    <div class="page-head">
      <div><h2>Artikli keteringa</h2><div class="desc">Baza artikala — koristi se samo za ketering</div></div>
      <div class="ph-actions">
        <button class="btn btn-ghost" onclick="KET.pogled='lista';renderKetering()">← Ketering</button>
        <button class="btn btn-primary" onclick="ketArtiklModal()">+ Novi artikal</button>
      </div>
    </div>
    ${!KET.artikli.length?`<div class="empty"><div class="big">📦</div><h3>Nema artikala</h3><p>Dodaj prvi artikal za ketering.</p></div>`:
    KET_KATEGORIJE.map(kk=>{

          <thead><tr><th>Naziv</th><th style="width:90px">Jedinica</th><th class="num" style="width:110px">Cena</th><th style="width:80px"></th></tr></thead>
          <tbody>${l.map(a=>`<tr ${a.aktivan?'':'style="opacity:.5"'}>
            <td class="t-strong">${esc(a.naziv)}${a.opis?`<br><span class="muted" style="font-size:12px">${esc(a.opis)}</span>`:''}
              ${a.aktivan?'':'<span class="tag tag-gray">neaktivan</span>'}</td>
            <td class="muted">${esc(a.jedinica)}</td>
            <td class="num"><b>${fmt(a.cena)}</b> <span class="muted" style="font-size:11.5px">RSD</span></td>
            <td class="num"><button class="btn btn-sm btn-ghost" onclick='ketArtiklModal(${JSON.stringify(a).replace(/'/g,"&#39;")})'>Uredi</button></td>
          </tr>`).join('')}</tbody></table></div>
      </div>`;
    }).join('')}`);
}
function ketArtiklModal(a=null){
  const e=a||{naziv:'',kategorija:'toplo',jedinica:'kg',cena:0,opis:'',aktivan:true};
  openModal(a?'Izmena artikla':'Novi artikal keteringa',`
    <div class="inline-form">
      <div class="field"><label>Naziv artikla</label><input id="ka-naziv" value="${esc(e.naziv)}" placeholder="npr. Pileći file panko + tartar sos"></div>
      <div class="field-row-3">
        <div class="field"><label>Kategorija</label><select id="ka-kat">
          ${KET_KATEGORIJE.map(k=>`<option value="${k}" ${e.kategorija===k?'selected':''}>${KET_KAT_NAZIV[k]}</option>`).join('')}</select></div>
        <div class="field"><label>Jedinica</label><select id="ka-jed">
          ${JEDINICE.map(j=>`<option value="${j}" ${e.jedinica===j?'selected':''}>${j}</option>`).join('')}</select></div>
        <div class="field"><label>Cena (RSD)</label><input id="ka-cena" type="number" step="1" value="${e.cena}"></div>
      </div>
      <div class="field"><label>Opis (opciono)</label><input id="ka-opis" value="${esc(e.opis||'')}"></div>
      <div class="field"><label><input type="checkbox" id="ka-aktivan" ${e.aktivan?'checked':''} style="width:auto;margin-right:6px"> Aktivan</label></div>
    </div>`,
    [a?`<button class="btn btn-danger" onclick="obrisiKetArtikl('${a.id}')">Obriši</button>`:'',
     `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>`,
     `<button class="btn btn-primary" onclick="sacuvajKetArtikl(${a?`'${a.id}'`:'null'})">Sačuvaj</button>`].join(''));
}
async function sacuvajKetArtikl(id){
  const rec={naziv:val('ka-naziv').trim(), kategorija:val('ka-kat'), jedinica:val('ka-jed'),
    cena:parseFloat(val('ka-cena'))||0, opis:val('ka-opis').trim()||null,
    aktivan:document.getElementById('ka-aktivan').checked};
  if(!rec.naziv){toast('Unesite naziv.','err');return;}
  if(id){await sb.from('av_ket_artikli').update(rec).eq('id',id);}
  else{await sb.from('av_ket_artikli').insert(rec);}
  closeModal();toast('Sačuvano.','ok');
  await ucitajKetering();renderKetArtikli();
}
async function obrisiKetArtikl(id){
  if(!confirm('Obrisati artikal?'))return;
  await sb.from('av_ket_artikli').delete().eq('id',id);
  closeModal();toast('Obrisano.','ok');
  await ucitajKetering();renderKetArtikli();
}

// ── KLIJENTI KETERINGA ──
function renderKetKlijenti(){
  setMain(`
    <div class="page-head">
      <div><h2>Klijenti keteringa</h2><div class="desc">Baza klijenata sa kojima sarađujemo</div></div>
      <div class="ph-actions">
        <button class="btn btn-ghost" onclick="KET.pogled='lista';renderKetering()">← Ketering</button>
        <button class="btn btn-primary" onclick="ketKlijentModal()">+ Novi klijent</button>
      </div>
    </div>
    ${!KET.klijenti.length?`<div class="empty"><div class="big">👥</div><h3>Nema klijenata</h3><p>Klijenti se čuvaju automatski kad kreiraš ketering.</p></div>`:
    `<div class="tbl-wrap"><table>
      <thead><tr><th>Naziv</th><th>Kontakt osoba</th><th>Telefon</th><th>Keteringa</th><th></th></tr></thead>
      <tbody>${KET.klijenti.map(c=>{
        const br=KET.lista.filter(k=>k.klijent_id===c.id).length;
        return `<tr>
          <td class="t-strong">${esc(c.naziv)}</td>
          <td>${esc(c.kontakt_osoba||'—')}</td>
          <td class="muted">${esc(c.telefon||'—')}</td>
          <td class="num">${br}</td>
          <td class="num"><button class="btn btn-sm btn-ghost" onclick='ketKlijentModal(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Uredi</button></td>
        </tr>`;
      }).join('')}</tbody></table></div>`}`);
}
function ketKlijentModal(c=null){
  const e=c||{naziv:'',kontakt_osoba:'',telefon:'',email:'',adresa:'',pib:'',napomena:''};
  openModal(c?'Izmena klijenta':'Novi klijent',`
    <div class="inline-form">
      <div class="field"><label>Naziv firme</label><input id="kk-naziv" value="${esc(e.naziv)}"></div>
      <div class="field-row">
        <div class="field"><label>Kontakt osoba</label><input id="kk-osoba" value="${esc(e.kontakt_osoba||'')}"></div>
        <div class="field"><label>Telefon</label><input id="kk-tel" value="${esc(e.telefon||'')}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Email</label><input id="kk-mail" value="${esc(e.email||'')}"></div>
        <div class="field"><label>PIB</label><input id="kk-pib" value="${esc(e.pib||'')}"></div>
      </div>
      <div class="field"><label>Adresa</label><input id="kk-adresa" value="${esc(e.adresa||'')}"></div>
      <div class="field"><label>Napomena</label><input id="kk-nap" value="${esc(e.napomena||'')}"></div>
    </div>`,
    [c?`<button class="btn btn-danger" onclick="obrisiKetKlijenta('${c.id}')">Obriši</button>`:'',
     `<button class="btn btn-ghost" onclick="closeModal()">Otkaži</button>`,
     `<button class="btn btn-primary" onclick="sacuvajKetKlijenta(${c?`'${c.id}'`:'null'})">Sačuvaj</button>`].join(''));
}
async function sacuvajKetKlijenta(id){
  const rec={naziv:val('kk-naziv').trim(), kontakt_osoba:val('kk-osoba').trim()||null,
    telefon:val('kk-tel').trim()||null, email:val('kk-mail').trim()||null,
    pib:val('kk-pib').trim()||null, adresa:val('kk-adresa').trim()||null,
    napomena:val('kk-nap').trim()||null};
  if(!rec.naziv){toast('Unesite naziv.','err');return;}
  if(id){await sb.from('av_ket_klijenti').update(rec).eq('id',id);}
  else{await sb.from('av_ket_klijenti').insert(rec);}
  closeModal();toast('Sačuvano.','ok');
  await ucitajKetering();renderKetKlijenti();
}
async function obrisiKetKlijenta(id){
  if(!confirm('Obrisati klijenta? Keteringi ostaju sačuvani.'))return;
  await sb.from('av_ket_klijenti').delete().eq('id',id);
  closeModal();toast('Obrisano.','ok');
  await ucitajKetering();renderKetKlijenti();
}

// ── ŠTAMPA OTPREMNICE ──
function stampajKetering(){
  const k=KET.aktivan;
  if(!KET.stavke.length){toast('Nema stavki.','err');return;}
  const ukupno=KET.stavke.reduce((a,s)=>a+Number(s.kolicina)*Number(s.cena),0);
  const body=`
    <div class="rep-head">
      <div class="brand">VILARA KETERING<small>Otpremnica</small></div>
      <div class="datum">${k.broj?`<b>${esc(k.broj)}</b><br>`:''}${datSr(k.datum)}</div>
    </div>
    <div class="meta">${esc(k.firma_naziv)}${k.broj_osoba?` — ${k.broj_osoba} osoba`:''}</div>

    <table class="ket-zaglavlje">
      <tbody>
        <tr><td class="lb">Datum</td><td>${datSr(k.datum)}</td></tr>
        <tr><td class="lb">Vreme isporuke kuhinje</td><td>${esc(k.vreme_kuhinja||'')}</td></tr>
        <tr><td class="lb">Vreme isporuke komitentu</td><td>${esc(k.vreme_komitent||'')}</td></tr>
        <tr><td class="lb">Adresa isporuke</td><td>${esc(k.adresa_isporuke||'')}</td></tr>
        <tr><td class="lb">Broj osoba</td><td>${k.broj_osoba||''}</td></tr>
        <tr><td class="lb">Firma</td><td><b>${esc(k.firma_naziv)}</b></td></tr>
        <tr><td class="lb">Kontakt osoba</td><td>${esc(k.kontakt_osoba||'')}</td></tr>
        <tr><td class="lb">Kontakt telefon</td><td>${esc(k.kontakt_telefon||'')}</td></tr>
        <tr><td class="lb">Plaćanje</td><td><b>${esc(k.placanje||'')}</b></td></tr>
        <tr class="uk"><td class="lb">Ukupan iznos</td><td><b>${fmt(ukupno)} RSD</b></td></tr>
      </tbody>
    </table>

    <table class="ket-stavke">
      <thead><tr><th style="width:34px">#</th><th>PORUDŽBINA</th><th style="width:90px" class="c">Količina</th></tr></thead>
      <tbody>
        ${KET.stavke.map((s,ix)=>`<tr>
          <td>${ix+1}.</td>
          <td>${esc(s.naziv)}</td>
          <td class="c">${fmt(s.kolicina)} ${esc(s.jedinica)}</td></tr>`).join('')}
      </tbody>
    </table>
    ${k.napomena?`<div class="meta" style="margin-top:16px">Napomena: ${esc(k.napomena)}</div>`:''}
    <div class="foot"><span>Vilara Ketering d.o.o.</span><span>${esc(k.firma_naziv)} — ${datSr(k.datum)}</span></div>`;
  otvoriStampu('Otpremnica '+(k.broj||datSr(k.datum)), body, KET_CSS);
}

// ── ŠTAMPA NALOGA ZA KETERING (bez cena — za kuhinju i vozača) ──
function stampajKetNalog(){
  const k=KET.aktivan;
  if(!KET.stavke.length){toast('Nema stavki.','err');return;}
  const ukKol=KET.stavke.length;
  // grupisi po kategoriji artikla (ako je poznata)
  const artById={}; KET.artikli.forEach(a=>artById[a.id]=a);
  const grupe=KET_KATEGORIJE.map(kk=>({
    kat:kk,
    naziv:KET_KAT_NAZIV[kk],
    stavke:KET.stavke.filter(s=>artById[s.artikl_id]?.kategorija===kk)
  })).filter(g=>g.stavke.length);
  const bezKat=KET.stavke.filter(s=>!artById[s.artikl_id]);
  if(bezKat.length)grupe.push({kat:'x',naziv:'Ostalo',stavke:bezKat});

  const body=`
    <div class="rep-head">
      <div class="brand">VILARA KETERING<small>Nalog za pripremu i isporuku</small></div>
      <div class="datum">${k.broj?`<b>${esc(k.broj)}</b><br>`:''}${datSr(k.datum)}</div>
    </div>
    <div class="meta">${esc(k.firma_naziv)}${k.broj_osoba?` — ${k.broj_osoba} osoba`:''}</div>

    <table class="ket-zaglavlje">
      <tbody>
        <tr><td class="lb">Datum</td><td><b>${danUNedelji(k.datum)}, ${datSr(k.datum)}</b></td></tr>
        <tr class="hi"><td class="lb">Vreme isporuke kuhinje</td><td><b>${esc(k.vreme_kuhinja||'—')}</b></td></tr>
        <tr class="hi"><td class="lb">Vreme isporuke komitentu</td><td><b>${esc(k.vreme_komitent||'—')}</b></td></tr>
        <tr><td class="lb">Adresa isporuke</td><td>${esc(k.adresa_isporuke||'—')}</td></tr>
        <tr><td class="lb">Broj osoba</td><td><b>${k.broj_osoba||'—'}</b></td></tr>
        <tr><td class="lb">Firma</td><td><b>${esc(k.firma_naziv)}</b></td></tr>
        <tr><td class="lb">Kontakt osoba</td><td>${esc(k.kontakt_osoba||'—')}</td></tr>
        <tr><td class="lb">Kontakt telefon</td><td><b>${esc(k.kontakt_telefon||'—')}</b></td></tr>
      </tbody>
    </table>

    ${grupe.map(g=>`
      <div class="odsek">
        <div class="odsek-h hirurgija">${esc(g.naziv)}</div>
        <div class="obrok-blok">
          <table class="ket-stavke" style="border:none">
            <thead><tr><th style="width:34px">#</th><th>Artikal</th><th style="width:100px" class="c">Količina</th><th style="width:50px" class="c">✓</th></tr></thead>
            <tbody>${g.stavke.map((s,ix)=>`<tr>
              <td>${ix+1}.</td>
              <td>${esc(s.naziv)}</td>
              <td class="c"><b>${fmt(s.kolicina)} ${esc(s.jedinica)}</b></td>
              <td class="c" style="color:#ccc;font-size:16px">☐</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`).join('')}

    <table class="ket-zaglavlje" style="margin-top:6px">
      <tbody><tr class="uk"><td class="lb">UKUPNO STAVKI</td><td><b>${ukKol}</b></td></tr></tbody>
    </table>

    ${k.napomena?`<div class="napomena-box"><b>NAPOMENA:</b> ${esc(k.napomena)}</div>`:''}
    <div class="sign"><div>Pripremio (kuhinja)</div><div>Preuzeo (vozač)</div><div>Primio (klijent)</div></div>
    <div class="foot"><span>Vilara Ketering d.o.o.</span><span>${esc(k.firma_naziv)} — ${datSr(k.datum)}</span></div>`;
  otvoriStampu('Nalog — '+(k.broj||k.firma_naziv), body, KET_CSS+KET_NALOG_CSS);
}
const KET_NALOG_CSS=`
  .ket-zaglavlje tr.hi td{background:#fff8e6}
  .ket-zaglavlje tr.hi td.lb{background:#f5edd8}
  .napomena-box{border:1.5px solid #d7dbe0;background:#f8f9fb;padding:11px 14px;margin-top:16px;font-size:12.5px}
  .sign{margin-top:34px;display:flex;gap:34px}
  .sign div{flex:1;border-top:1px solid #888;padding-top:7px;font-size:11px;color:#6b727c;text-align:center}
`;
const KET_CSS=`
  .ket-zaglavlje{width:100%;border-collapse:collapse;margin-bottom:22px;border:1px solid #d7dbe0}
  .ket-zaglavlje td{padding:8px 14px;border-bottom:1px solid #edeff2;font-size:12.5px}
  .ket-zaglavlje td.lb{width:200px;background:#f4f5f7;font-weight:700;font-size:11.5px}
  .ket-zaglavlje tr.uk td{background:#242a33;color:#fff;font-size:14px;border:none}
  .ket-zaglavlje tr.uk td.lb{background:#242a33;color:#fff}
  .ket-stavke{width:100%;border-collapse:collapse;border:1px solid #d7dbe0}
  .ket-stavke th{background:#242a33;color:#fff;padding:9px 14px;font-size:11px;text-align:left}
  .ket-stavke th.c{text-align:center}
  .ket-stavke td{padding:8px 14px;border-bottom:1px solid #edeff2;font-size:12.5px}
  .ket-stavke td.c{text-align:center;font-weight:600}
`;

// ════════════════════════════════════════════════
//  MODAL HELPERS
// ════════════════════════════════════════════════
function val(id){return document.getElementById(id).value;}
function openModal(title,body,footer){
  const wrap=document.createElement('div');wrap.className='modal-bg';wrap.id='modal-bg';
  wrap.onclick=e=>{if(e.target===wrap)closeModal();};
  wrap.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></div>`;
  document.body.appendChild(wrap);
}
function closeModal(){document.getElementById('modal-bg')?.remove();}

</script>
</body>
</html>
